name: BTC Binance WS Collector

# A single hourly rolling collector keeps a warm same-product Binance Futures
# WebSocket cache without spawning a near-continuous sequence of short jobs.
# Each capture window is published independently, so Live Cycle can consume the
# latest verified cache even if a later window fails.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_binance_ws_collector.yml'
      - 'src/binance_ws.py'
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

concurrency:
  group: btc-binance-ws-cache
  # Replace an older collector immediately when a new collector run is
  # triggered (e.g. after a collector-code update). The dedicated cache branch
  # already preserves the latest valid rows, so the old process need not finish.
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  GH_TOKEN: ${{ github.token }}

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install free WebSocket dependency
        run: python -m pip install --disable-pip-version-check 'websockets>=15,<16'

      - name: Load existing dedicated cache branch
        shell: bash
        run: |
          set -euo pipefail
          test -s src/binance_ws.py
          rm -f data/binance_ws_1m.json
          if git fetch --no-tags --depth=1 origin binance-ws-cache; then
            if git show origin/binance-ws-cache:data/binance_ws_1m.json > data/binance_ws_1m.json 2>/dev/null; then
              echo 'Loaded prior Binance WS cache from dedicated state branch.'
            else
              echo 'Dedicated cache branch has no cache file yet; starting fresh.'
              rm -f data/binance_ws_1m.json
            fi
          else
            echo 'Dedicated cache branch unavailable; starting fresh cache.'
          fi

      - name: Record fixed collector base SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capture and publish rolling Binance Futures WS windows
        shell: bash
        run: |
          set -euo pipefail

          validate_cache() {
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/binance_ws_1m.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('schema_version') != 1:
              raise SystemExit('invalid WS cache schema')
          if obj.get('source') != 'Binance USD-M Futures WebSocket':
              raise SystemExit('invalid WS cache source')
          if obj.get('stream') != 'btcusdt@kline_1m':
              raise SystemExit('invalid WS cache stream')
          rows=obj.get('rows')
          if not isinstance(rows,list) or not rows:
              raise SystemExit('Binance WebSocket collector produced no usable closed bars')
          required=('open_time_ms','event_time_ms','retrieved_at_ms','open','high','low','close','volume','taker_buy_base')
          for row in rows:
              if not isinstance(row,dict):
                  raise SystemExit('WS cache row is not an object')
              for key in required:
                  if key not in row:
                      raise SystemExit(f'WS cache row missing {key}')
          print(json.dumps({
              'cache_rows':len(rows),
              'latest_open_time_ms':rows[-1]['open_time_ms'],
              'latest_event_time_ms':rows[-1]['event_time_ms'],
              'latest_retrieved_at_ms':rows[-1]['retrieved_at_ms'],
              'updated_at_utc':obj.get('updated_at_utc'),
          },sort_keys=True))
          PY
          }

          publish_cache() {
            # Publish directly to the dedicated cache branch via the GitHub
            # Contents API. Never checkout/switch branches in the active
            # collector workspace: that I/O previously created multi-minute
            # gaps between otherwise healthy WebSocket windows.
            local_file="data/binance_ws_1m.json"
            test -s "$local_file"

            content_b64="$(python - "$local_file" <<'PY'
          import base64,sys
          from pathlib import Path
          print(base64.b64encode(Path(sys.argv[1]).read_bytes()).decode("ascii"))
          PY
            )"

            existing_sha=""
            if existing_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$local_file?ref=binance-ws-cache" --jq '.sha' 2>/dev/null)"; then
              :
            else
              existing_sha=""
            fi

            message="Update Binance Futures WS cache"
            args=(
              --method PUT
              "/repos/$GITHUB_REPOSITORY/contents/$local_file"
              -f "message=$message"
              -f "content=$content_b64"
              -f "branch=binance-ws-cache"
            )
            if [ -n "$existing_sha" ]; then
              args+=( -f "sha=$existing_sha" )
            fi

            for attempt in 1 2 3 4; do
              if gh api "${args[@]}" >/dev/null 2>&1; then
                echo "Published Binance WS cache via Contents API on attempt ${attempt}."
                return 0
              fi

              if [ "${attempt}" -eq 4 ]; then
                echo "Binance WS cache API publish failed after all retries." >&2
                return 1
              fi

              # Re-read the remote blob SHA in case another writer advanced the
              # branch between our GET and PUT.
              existing_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$local_file?ref=binance-ws-cache" --jq '.sha' 2>/dev/null || true)"
              if [ -n "$existing_sha" ]; then
                args+=( -f "sha=$existing_sha" )
              fi
              sleep $((2 * ${attempt}))
            done
          }

          # Keep the dedicated Binance cache continuously warm. Each window is
          # long enough to obtain a closed 1m bar, but short enough that Live
          # Cycle never has to rely on a multi-minute-stale cache.
          iterations=30
          capture_seconds=90

          for n in $(seq 1 "${iterations}"); do
            echo "=== Binance WS rolling window ${n}/${iterations} (${capture_seconds}s) ==="

            captured=false
            for attempt in 1 2; do
              previous_latest=0
              if [ -s data/binance_ws_1m.json ]; then
                previous_latest=$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/binance_ws_1m.json').read_text(encoding='utf-8')).get('rows',[])
          print(int(rows[-1]['open_time_ms']) if rows else 0)
          PY
                )
              fi

              if python -m src.binance_ws --capture-seconds "${capture_seconds}" --output data/binance_ws_1m.json; then
                if validate_cache; then
                  current_latest=$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/binance_ws_1m.json').read_text(encoding='utf-8')).get('rows',[])
          print(int(rows[-1]['open_time_ms']) if rows else 0)
          PY
                  )
                  if [ "${previous_latest}" -eq 0 ] || [ "${current_latest}" -gt "${previous_latest}" ]; then
                    captured=true
                    break
                  fi
                  echo "WARN: WS capture completed but did not advance the latest closed bar (previous=${previous_latest}, current=${current_latest})."
                fi
              fi

              echo "WARN: rolling WS capture attempt ${attempt} did not produce a fresh valid bar; retrying."
              if [ -s /tmp/publish_ws_cache.json ]; then
                cp /tmp/publish_ws_cache.json data/binance_ws_1m.json
              else
                rm -f data/binance_ws_1m.json
              fi
              sleep $((10 * ${attempt}))
            done

            if [ "${captured}" != true ]; then
              echo "Binance WS rolling capture failed for window ${n}; preserving prior published cache and failing closed." >&2
              exit 1
            fi

            publish_cache

            rows=$(python - <<'PY'
          import json
          from pathlib import Path
          print(len(json.loads(Path('data/binance_ws_1m.json').read_text(encoding='utf-8'))['rows']))
          PY
            )
            echo "Published rolling cache rows=${rows}"
          done

          rm -f data/binance_ws_1m.json
          git checkout -B main "${BASE_SHA}"
          echo 'Binance WS rolling collector completed all windows successfully.'
