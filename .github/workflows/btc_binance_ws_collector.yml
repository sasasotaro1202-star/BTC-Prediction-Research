name: BTC Binance WS Collector

# Two staggered rolling collectors keep the same-product Binance Futures
# WebSocket cache continuously warm. Scheduled runs are intentionally allowed
# to overlap; the dedicated cache branch merges checkpoints safely.
# Each capture window is independently recoverable, so a delayed schedule does
# not create a predictable 15-minute cache gap.
on:
  # Keep the rolling cache continuously warm. Changes to this workflow itself
  # are also a recovery trigger so the current hardened collector is started
  # immediately instead of waiting for the next scheduled slot.
  schedule:
    - cron: '3,33 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_binance_ws_collector.yml'
      - 'src/binance_ws.py'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  # Scheduled collectors deliberately get independent concurrency keys so two
  # staggered windows can overlap and cover transient schedule jitter. Manual /
  # Every collector run may overlap safely because checkpoints use direct-ref
  # publication plus remote merge. Never cancel an already-warm capture window.
  group: btc-binance-ws-cache-${{ github.event_name == 'schedule' && github.run_id || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install free WebSocket dependency
        run: python -m pip install --disable-pip-version-check 'websockets>=15,<16'

      - name: Load existing dedicated cache branch
        shell: bash
        run: |
          set -euo pipefail
          test -s src/binance_ws.py
          rm -f data/binance_ws_1m.json data/binance_ws_depth.json
          if git fetch --no-tags --depth=1 origin binance-ws-cache; then
            if git show origin/binance-ws-cache:data/binance_ws_1m.json > data/binance_ws_1m.json 2>/dev/null; then
              echo 'Loaded prior Binance WS cache from dedicated state branch.'
            else
              echo 'Dedicated cache branch has no kline cache yet; starting kline cache fresh.'
            fi
            if git show origin/binance-ws-cache:data/binance_ws_depth.json > data/binance_ws_depth.json 2>/dev/null; then
              echo 'Loaded prior Binance depth WS cache from dedicated state branch.'
            else
              echo 'Dedicated cache branch has no depth cache yet; starting depth cache fresh.'
            fi
          else
            echo 'Dedicated cache branch unavailable; starting fresh caches.'
          fi


      - name: Seed stale Binance Futures cache from closed REST klines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          path = Path("data/binance_ws_1m.json")
          now_ms = int(time.time() * 1000)

          def fresh_contiguous_suffix(obj):
              rows = obj.get("rows", []) if isinstance(obj, dict) else []
              if not isinstance(rows, list) or not rows:
                  return 0, 0, None
              valid_rows = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  try:
                      open_ms = int(row["open_time_ms"])
                  except (KeyError, TypeError, ValueError):
                      continue
                  valid_rows.append((open_ms, row))
              ordered = [row for _, row in sorted(valid_rows, key=lambda item: item[0])]
              if not ordered:
                  return 0, 0, None
              suffix = 1
              for i in range(len(ordered) - 1, 0, -1):
                  if int(ordered[i]["open_time_ms"]) - int(ordered[i - 1]["open_time_ms"]) != 60_000:
                      break
                  suffix += 1
              age = now_ms - int(ordered[-1].get("retrieved_at_ms", 0))
              return len(ordered), suffix, age

          existing = None
          if path.is_file():
              try:
                  existing = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  existing = None

          row_count, suffix, age = fresh_contiguous_suffix(existing)
          if suffix >= 40 and suffix == row_count and age is not None and 0 <= age <= 180_000:
              print(
                  "Existing Binance WS cache is fresh and fully contiguous: "
                  f"rows={row_count} age_ms={age}"
              )
              raise SystemExit(0)

          if row_count:
              print(
                  "Existing Binance WS cache requires REST healing: "
                  f"rows={row_count} contiguous_suffix={suffix} age_ms={age}"
              )

          hosts = (
              "fapi.binance.com",
              "fapi1.binance.com",
              "fapi2.binance.com",
              "fapi3.binance.com",
              "fapi4.binance.com",
          )
          raw = None
          last_error = None
          for host in hosts:
              url = (
                  f"https://{host}/fapi/v1/klines?"
                  + urlencode({"symbol": "BTCUSDT", "interval": "1m", "limit": 720})
              )
              for attempt in range(1, 3):
                  try:
                      req = Request(
                          url,
                          headers={
                              "User-Agent": "BTC-Prediction-Research/binance-cache-seed/1.2",
                              "Accept": "application/json",
                          },
                      )
                      with urlopen(req, timeout=15) as response:
                          candidate_raw = json.loads(response.read())
                      if isinstance(candidate_raw, list):
                          raw = candidate_raw
                          print(f"Binance Futures REST seed succeeded via {host}.")
                          break
                      last_error = RuntimeError(f"non_list_response:{host}")
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          time.sleep(attempt)
              if isinstance(raw, list):
                  break

          if not isinstance(raw, list):
              try:
                  import subprocess
                  result = subprocess.run(
                      [
                          "curl", "-fsS", "--retry", "3", "--retry-all-errors",
                          "--connect-timeout", "10", "--max-time", "20",
                          "-A", "BTC-Prediction-Research/binance-cache-seed/1.1",
                          "-H", "Accept: application/json", url,
                      ],
                      capture_output=True, text=True, timeout=30, check=False,
                  )
                  if result.returncode == 0:
                      raw = json.loads(result.stdout)
                  else:
                      last_error = RuntimeError(
                          f"curl_exit_{result.returncode}: {result.stderr.strip()[:300]}"
                      )
              except Exception as exc:
                  last_error = exc

          if not isinstance(raw, list):
              print(
                  "WARN: Binance REST cache seed unavailable; "
                  f"keeping existing cache and continuing to WebSocket capture. "
                  f"error={type(last_error).__name__ if last_error else 'unknown'}"
              )
              raise SystemExit(0)

          rows = []
          retrieved_ms = int(time.time() * 1000)
          for row in raw:
              if not isinstance(row, list) or len(row) < 11:
                  continue
              try:
                  open_ms = int(row[0])
                  close_ms = int(row[6])
                  if close_ms > retrieved_ms:
                      continue
                  rows.append(
                      {
                          "open_time_ms": open_ms,
                          "open": float(row[1]),
                          "high": float(row[2]),
                          "low": float(row[3]),
                          "close": float(row[4]),
                          "volume": float(row[5]),
                          "taker_buy_base": float(row[9]),
                          "event_time_ms": close_ms,
                          "retrieved_at_ms": retrieved_ms,
                      }
                  )
              except (TypeError, ValueError):
                  continue

          rows = sorted({int(r["open_time_ms"]): r for r in rows}.values(), key=lambda r: r["open_time_ms"])
          suffix = 1 if rows else 0
          for i in range(len(rows) - 1, 0, -1):
              if int(rows[i]["open_time_ms"]) - int(rows[i - 1]["open_time_ms"]) != 60_000:
                  break
              suffix += 1

          if suffix < 40:
              print(
                  "WARN: Binance REST cache seed returned insufficient contiguous closed bars; "
                  f"contiguous_rows={suffix}. Continuing to WebSocket capture."
              )
              raise SystemExit(0)

          payload = {
              "schema_version": 1,
              "source": "Binance USD-M Futures WebSocket",
              "stream": "btcusdt@kline_1m",
              "recovery_epoch_ms": retrieved_ms,
              "rows": rows[-720:],
              "updated_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(retrieved_ms / 1000)),
          }
          temp = path.with_name(".binance_ws_1m.rest_seed.tmp")
          temp.write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          temp.replace(path)
          print(
              "Seeded Binance WS cache from closed Binance Futures REST klines: "
              f"rows={len(rows)} contiguous_rows={suffix} retrieved_at_ms={retrieved_ms}"
          )
          PY

      - name: Record fixed collector base SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify current Binance Futures WebSocket endpoints before long capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import json
          import websockets

          ENDPOINTS = {
              "kline": "wss://fstream.binance.com/market/ws/btcusdt@kline_1m",
              "depth": "wss://fstream.binance.com/public/ws/btcusdt@depth20@100ms",
              "mark": "wss://fstream.binance.com/market/ws/btcusdt@markPrice@1s",
          }

          async def probe_once(name, url):
              async with websockets.connect(
                  url,
                  open_timeout=8,
                  close_timeout=3,
                  ping_interval=20,
                  ping_timeout=20,
                  max_size=2**20,
              ) as ws:
                  raw = await asyncio.wait_for(ws.recv(), timeout=12)

              try:
                  msg = json.loads(raw)
              except Exception as exc:
                  raise RuntimeError(f"Binance {name} WebSocket endpoint returned non-JSON data") from exc

              data = msg.get("data") if isinstance(msg, dict) and isinstance(msg.get("data"), dict) else msg
              if not isinstance(data, dict):
                  raise RuntimeError(f"Binance {name} WebSocket endpoint returned malformed payload")

              if name == "kline":
                  k = data.get("k")
                  if data.get("e") != "kline" or not isinstance(k, dict) or k.get("s") != "BTCUSDT" or k.get("i") != "1m":
                      raise RuntimeError("Binance kline WebSocket endpoint returned an unexpected stream payload")
              elif name == "depth":
                  bids, asks = data.get("b"), data.get("a")
                  if (
                      data.get("e") != "depthUpdate"
                      or data.get("s") != "BTCUSDT"
                      or data.get("ps") != "BTCUSDT"
                      or data.get("st") != 1
                      or not isinstance(bids, list)
                      or not isinstance(asks, list)
                      or min(len(bids), len(asks)) < 20
                      or "E" not in data
                  ):
                      raise RuntimeError("Binance depth WebSocket endpoint returned an unexpected current partial-depth payload")
              else:
                  try:
                      mark_price = float(data.get("p", 0))
                  except (TypeError, ValueError):
                      mark_price = 0.0
                  if data.get("e") != "markPriceUpdate" or data.get("s") != "BTCUSDT" or mark_price <= 0:
                      raise RuntimeError("Binance mark-price WebSocket endpoint returned an unexpected payload")

              return {
                  "name": name,
                  "url": url,
                  "event": data.get("e"),
              }

          async def probe(name, url):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      return await probe_once(name, url)
                  except Exception as exc:
                      last_error = exc
                      if attempt < 3:
                          await asyncio.sleep(2 * attempt)
              raise SystemExit(
                  f"Binance {name} WebSocket endpoint probe failed after 3 attempts: "
                  f"{type(last_error).__name__}: {last_error}"
              ) from last_error

          async def main():
              results = [await probe(name, url) for name, url in ENDPOINTS.items()]
              print(json.dumps({"endpoint_smoke": results}, sort_keys=True))

          asyncio.run(main())
          PY
      - name: Capture and publish rolling Binance Futures WS windows
        shell: bash
        run: |
          set -euo pipefail

          validate_cache() {
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/binance_ws_1m.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('schema_version') != 1:
              raise SystemExit('invalid WS cache schema')
          if obj.get('source') != 'Binance USD-M Futures WebSocket':
              raise SystemExit('invalid WS cache source')
          if obj.get('stream') != 'btcusdt@kline_1m':
              raise SystemExit('invalid WS cache stream')
          rows=obj.get('rows')
          if not isinstance(rows,list) or not rows:
              raise SystemExit('Binance WebSocket collector produced no usable closed bars')
          ordered=sorted(rows,key=lambda row:int(row.get('open_time_ms',0)))
          suffix=1
          for i in range(len(ordered)-1,0,-1):
              if int(ordered[i]['open_time_ms'])-int(ordered[i-1]['open_time_ms']) != 60000:
                  break
              suffix += 1
          print(json.dumps({
              'cache_rows':len(ordered),
              'contiguous_rows':suffix,
              'latest_open_time_ms':ordered[-1].get('open_time_ms'),
              'latest_retrieved_at_ms':ordered[-1].get('retrieved_at_ms'),
              'updated_at_utc':obj.get('updated_at_utc'),
          },sort_keys=True))
          required=('open_time_ms','event_time_ms','retrieved_at_ms','open','high','low','close','volume','taker_buy_base')
          for row in rows:
              if not isinstance(row,dict):
                  raise SystemExit('WS cache row is not an object')
              for key in required:
                  if key not in row:
                      raise SystemExit(f'WS cache row missing {key}')
          print(json.dumps({
              'cache_rows':len(rows),
              'latest_open_time_ms':rows[-1]['open_time_ms'],
              'latest_event_time_ms':rows[-1]['event_time_ms'],
              'latest_retrieved_at_ms':rows[-1]['retrieved_at_ms'],
              'updated_at_utc':obj.get('updated_at_utc'),
          },sort_keys=True))
          PY
          }

          publish_cache() {
            # Publish without switching branches or creating an Actions working-tree
            # commit. Use a temporary index so the live kline capture process keeps
            # running uninterrupted between checkpoints.
            local_file="data/binance_ws_1m.json"
            test -s "$local_file"
            git fetch --no-tags --depth=1 origin binance-ws-cache

            # A REST-healed cache advances a monotonic recovery epoch. Older
            # collectors that started before that repair must never overwrite it.
            if git show origin/binance-ws-cache:data/binance_ws_1m.json > /tmp/btc_remote_ws_cache_epoch.json 2>/dev/null; then
              local_epoch="$(python -c 'import json; from pathlib import Path; obj=json.loads(Path("data/binance_ws_1m.json").read_text(encoding="utf-8")); print(int(obj.get("recovery_epoch_ms", 0) or 0))')"
              remote_epoch="$(python -c 'import json; from pathlib import Path; obj=json.loads(Path("/tmp/btc_remote_ws_cache_epoch.json").read_text(encoding="utf-8")); print(int(obj.get("recovery_epoch_ms", 0) or 0))')"
              if [ "$remote_epoch" -gt "$local_epoch" ]; then
                echo "Binance WS cache recovery epoch is newer remotely (remote=$remote_epoch local=$local_epoch); preserving repaired remote cache."
                return 0
              fi
            fi

            # Merge rows already published remotely before creating the next
            # checkpoint. This prevents a long-lived collector that started with
            # an older snapshot from overwriting a newer bootstrap/cache update.
            # Use the standalone, unit-tested merge helper; keep shell glue minimal and fail-closed.
            remote_file="/tmp/btc_remote_ws_cache.json"
            if git show origin/binance-ws-cache:data/binance_ws_1m.json > "$remote_file" 2>/dev/null; then
              set +e
              python scripts/merge_binance_ws_cache.py "$local_file" "$remote_file"
              merge_status=$?
              set -e
              if [ "$merge_status" -eq 11 ]; then
                return 0
              fi
              if [ "$merge_status" -eq 12 ]; then
                return 0
              fi
              if [ "$merge_status" -ne 0 ]; then
                echo "ERROR: Binance WS cache merge helper failed with status $merge_status." >&2
                return "$merge_status"
              fi
            fi

            for attempt in 1 2 3 4; do
              set +e
              cache_base="$(git rev-parse origin/binance-ws-cache 2>/dev/null)"
              cache_base_status=$?
              set -e
              if [ "$cache_base_status" -ne 0 ] || [ -z "$cache_base" ]; then
                echo 'Dedicated cache branch base is unavailable.' >&2
                return 1
              fi

              tmp_index="$(mktemp)"
              trap 'rm -f "$tmp_index"' RETURN
              GIT_INDEX_FILE="$tmp_index" git read-tree "$cache_base"
              GIT_INDEX_FILE="$tmp_index" git add -- "$local_file"
              cache_tree="$(GIT_INDEX_FILE="$tmp_index" git write-tree)"
              cache_commit="$(printf '%s\n\n%s\n' 'Update Binance Futures WS cache' 'Continuous Binance WS checkpoint' | GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' git commit-tree "$cache_tree" -p "$cache_base")"
              rm -f "$tmp_index"
              trap - RETURN

              if git push origin "$cache_commit:refs/heads/binance-ws-cache"; then
                echo "Published Binance WS cache via direct ref push on attempt ${attempt}."
                return 0
              fi

              if [ "$attempt" -eq 4 ]; then
                echo 'Binance WS cache direct ref publish failed after all retries.' >&2
                return 1
              fi
              echo "Cache direct-ref publish attempt ${attempt} rejected; refreshing branch base." >&2
              git fetch --no-tags --depth=1 origin binance-ws-cache
              sleep $((2 * attempt))
            done
          }

          publish_depth_cache() {
            local local_file="data/binance_ws_depth.json"
            test -s "$local_file"
            git fetch --no-tags --depth=1 origin binance-ws-cache

            # Overlapping collectors can finish in either order. Never let an
            # older depth snapshot overwrite a newer checkpoint already on the
            # dedicated cache branch.
            remote_file="/tmp/btc_remote_ws_depth.json"
            if git show origin/binance-ws-cache:data/binance_ws_depth.json > "$remote_file" 2>/dev/null; then
              if python - "$local_file" "$remote_file" <<'PY'
          import json,sys
          from pathlib import Path

          local_path=Path(sys.argv[1])
          remote_path=Path(sys.argv[2])
          local=json.loads(local_path.read_text(encoding="utf-8"))
          remote=json.loads(remote_path.read_text(encoding="utf-8"))

          def snapshot(obj, label):
              if not isinstance(obj,dict):
                  raise SystemExit(f"{label} depth cache is not an object")
              if obj.get("schema_version") != 1 or obj.get("source") != "Binance USD-M Futures WebSocket":
                  raise SystemExit(f"{label} depth cache provenance invalid")
              snap=obj.get("snapshot")
              if not isinstance(snap,dict):
                  raise SystemExit(f"{label} depth cache snapshot missing")
              retrieved=int(snap.get("retrieved_at_ms",0))
              event=int(snap.get("event_time_ms",0))
              if retrieved <= 0 or event <= 0:
                  raise SystemExit(f"{label} depth cache timestamps invalid")
              return snap, retrieved

          _, local_retrieved = snapshot(local, "local")
          _, remote_retrieved = snapshot(remote, "remote")

          # Exit 11 is a controlled no-op signal to the shell function: the
          # remote checkpoint is newer/equal, so publishing local bytes would
          # regress the dedicated cache and must be skipped entirely.
          if remote_retrieved >= local_retrieved:
              print(
                  f"Depth checkpoint is older than/equal to remote "
                  f"(local={local_retrieved}, remote={remote_retrieved}); preserving remote."
              )
              raise SystemExit(11)
          PY
              then
                :
              else
                rc=$?
                if [ "$rc" -eq 11 ]; then
                  return 0
                fi
                return "$rc"
              fi
            fi

            for attempt in 1 2 3 4; do
              set +e
              cache_base="$(git rev-parse origin/binance-ws-cache 2>/dev/null)"
              cache_base_status=$?
              set -e
              if [ "$cache_base_status" -ne 0 ] || [ -z "$cache_base" ]; then return 1; fi
              tmp_index="$(mktemp)"
              trap 'rm -f "$tmp_index"' RETURN
              GIT_INDEX_FILE="$tmp_index" git read-tree "$cache_base"
              GIT_INDEX_FILE="$tmp_index" git add -- "$local_file"
              cache_tree="$(GIT_INDEX_FILE="$tmp_index" git write-tree)"
              cache_commit="$(printf '%s\n\n%s\n' 'Update Binance Futures depth cache' 'Continuous Binance depth WS checkpoint' | GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' git commit-tree "$cache_tree" -p "$cache_base")"
              rm -f "$tmp_index"
              trap - RETURN
              if git push origin "$cache_commit:refs/heads/binance-ws-cache"; then
                echo "Published Binance depth WS cache on attempt ${attempt}."
                return 0
              fi
              if [ "${attempt}" -eq 4 ]; then return 1; fi
              git fetch --no-tags --depth=1 origin binance-ws-cache
              sleep $((2 * attempt))
            done
          }

          # Keep one WebSocket connection open for the entire collector slot.
          # Checkpoints are written atomically by the Python process and published
          # by a separate lightweight loop, so publication never disconnects the stream.
          # 45m capture every 30m gives a 15m overlap between healthy scheduled
          # collectors. This removes the deterministic hourly 15m cache gap while
          # remaining bounded and recoverable on hosted runners.
          capture_seconds=2700
          checkpoint_seconds=60

          rm -f /tmp/btc_ws_collector.log /tmp/btc_ws_publisher.log
          python -m src.binance_ws             --capture-seconds "${capture_seconds}"             --checkpoint-seconds "${checkpoint_seconds}"             --output data/binance_ws_1m.json             > /tmp/btc_ws_collector.log 2>&1 &
          collector_pid="$!"
           depth_pid=""
           rm -f /tmp/btc_ws_depth.log
           python -m src.binance_ws --mode depth --capture-seconds "${capture_seconds}" --checkpoint-seconds "${checkpoint_seconds}" --output data/binance_ws_depth.json > /tmp/btc_ws_depth.log 2>&1 &
           depth_pid="$!"

          publisher_loop() {
            # Always allow the first checkpoint to publish a freshly REST-seeded cache.
            # The semantic no-op guard inside publish_cache prevents needless commits
            # when the remote checkpoint already contains the same rows.
            local last_published=0
            local last_depth_published=0

            # Publish a REST-healed cache immediately. Do not wait for the first
            # 30-second checkpoint or for the WebSocket process to stay alive;
            # this makes self-heal useful in the same live cycle.
            if [ -s data/binance_ws_1m.json ]; then
              if publish_cache; then
                last_published="$(python -c 'import json; from pathlib import Path; rows=json.loads(Path("data/binance_ws_1m.json").read_text(encoding="utf-8")).get("rows", []); print(int(rows[-1]["open_time_ms"]) if rows else 0)')"
                echo "Initial Binance WS cache checkpoint published latest_open_time_ms=$last_published"
              else
                echo 'WARN: initial Binance WS cache checkpoint publication failed; stream continues.' >&2
              fi
            fi

            if [ -s data/binance_ws_depth.json ]; then
              last_depth_published="$(python -c 'import json; from pathlib import Path; obj=json.loads(Path("data/binance_ws_depth.json").read_text(encoding="utf-8")); snap=obj.get("snapshot", {}); print(int(snap.get("retrieved_at_ms", 0)) if isinstance(snap, dict) else 0)')"
            fi
            while kill -0 "$collector_pid" 2>/dev/null || { [ -n "$depth_pid" ] && kill -0 "$depth_pid" 2>/dev/null; }; do
              sleep 30
              if kill -0 "$collector_pid" 2>/dev/null && [ -s data/binance_ws_1m.json ]; then
                current_latest="$(python -c 'import json; from pathlib import Path; rows=json.loads(Path("data/binance_ws_1m.json").read_text(encoding="utf-8")).get("rows", []); print(int(rows[-1]["open_time_ms"]) if rows else 0)')"
                if [ "$current_latest" -gt "$last_published" ]; then
                  if publish_cache; then
                    last_published="$current_latest"
                    echo "Checkpoint published latest_open_time_ms=$current_latest"
                  else
                    echo "WARN: kline checkpoint publication failed; stream continues." >&2
                  fi
                fi
              fi
              if [ -n "$depth_pid" ] && kill -0 "$depth_pid" 2>/dev/null && [ -s data/binance_ws_depth.json ]; then
                current_depth="$(python -c 'import json; from pathlib import Path; obj=json.loads(Path("data/binance_ws_depth.json").read_text(encoding="utf-8")); snap=obj.get("snapshot", {}); print(int(snap.get("retrieved_at_ms", 0)) if isinstance(snap, dict) else 0)')"
                if [ "$current_depth" -gt "$last_depth_published" ]; then
                  if publish_depth_cache; then
                    last_depth_published="$current_depth"
                    echo "Depth checkpoint published retrieved_at_ms=$current_depth"
                  else
                    echo "WARN: depth checkpoint publication failed; stream continues." >&2
                  fi
                fi
              fi
            done
          }

          publisher_loop > /tmp/btc_ws_publisher.log 2>&1 &
          publisher_pid="$!"

           collector_status=0
           depth_status=0
           wait "$collector_pid" || collector_status=$?
           if [ -n "$depth_pid" ]; then
             wait "$depth_pid" || depth_status=$?
           fi

           if kill -0 "$publisher_pid" 2>/dev/null; then
             set +e
             kill "$publisher_pid"
             publisher_kill_status=$?
             wait "$publisher_pid"
             publisher_wait_status=$?
             set -e
             if [ "$publisher_kill_status" -ne 0 ]; then
               echo "WARN: publisher process could not be signalled (status=${publisher_kill_status}); it may have already exited." >&2
             fi
             if [ "$publisher_wait_status" -ne 0 ] && [ "$publisher_wait_status" -ne 143 ]; then
               echo "WARN: publisher process exited with status ${publisher_wait_status} after shutdown." >&2
             fi
           fi

           cat /tmp/btc_ws_collector.log
           cat /tmp/btc_ws_depth.log
           cat /tmp/btc_ws_publisher.log

           if [ "$collector_status" -ne 0 ]; then
             echo "Binance continuous WS collector failed closed with status $collector_status." >&2
             exit "$collector_status"
           fi
           if [ "$depth_status" -ne 0 ]; then
             echo "WARN: Binance depth WS collector ended with status $depth_status; Live direct-WS depth recovery remains available." >&2
           fi

          if [ "$collector_status" -ne 0 ]; then
            echo "Binance continuous WS collector failed closed with status ${collector_status}." >&2
            exit "$collector_status"
          fi

          if ! validate_cache; then
            echo "Final Binance WS cache validation failed." >&2
            exit 1
          fi

          final_contiguous="$(python -c 'import json; from pathlib import Path; rows=sorted(json.loads(Path("data/binance_ws_1m.json").read_text(encoding="utf-8"))["rows"], key=lambda row:int(row["open_time_ms"])); gaps=[i for i in range(1,len(rows)) if int(rows[i]["open_time_ms"])-int(rows[i-1]["open_time_ms"]) != 60000]; print(len(rows)-gaps[-1] if gaps else len(rows))')"
          if [ "$final_contiguous" -lt 40 ]; then
            echo "Final Binance WS cache has only $final_contiguous contiguous closed bars; failing closed." >&2
            exit 1
          fi

          publish_cache
           if [ -s data/binance_ws_depth.json ]; then
             publish_depth_cache || echo "WARN: final Binance depth cache publication failed; Live will use direct WS recovery." >&2
           fi
          echo "Binance WS continuous collector completed successfully."
