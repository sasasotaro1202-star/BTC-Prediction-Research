name: BTC 9H Research Marathon

# Current-main bootstrap: this comment intentionally triggers a fresh 9H run
# after stale-head recovery so evidence is regenerated only on the current codebase.
# Research-only marathon. It never changes Champion/production model files.
# Three independent OOS diagnostics run in parallel for up to 3h, followed by
# up to 6h of incremental historical research + final integrity checks.
# Total wall-clock envelope: up to 9h. Scheduled daily outside the hourly load peak.
on:
  # This is a long-lived research marathon. Run every 9 hours so the
  # research loop continuously feeds fresh evidence with minimal idle time.
  # Relevant protocol changes also trigger a fresh run through the push filter below.
  schedule:
    - cron: '37 0,9,18 * * *'
  workflow_dispatch:
  # Keep long OOS runs uninterrupted. Source changes are picked up by the next
  # scheduled/manual run instead of cancelling an in-progress evidence build.
concurrency:
  group: btc-9h-research-marathon-main
  # Keep one marathon running to completion; never discard long OOS evidence
  # because a maintenance commit landed on main.
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  context_router:
    name: Context-router chronological OOS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          PY
      - name: Compact exact immutable prediction events
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db
          python scripts/merge_prediction_state.py --compact data/predictions.db

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Compile and run router OOS
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python src/context_router_oos.py
          test -s data/historical_research/context_router_oos.json
      - name: Upload router evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-9h-context-router
          path: data/historical_research/context_router_oos.json
          retention-days: 3

