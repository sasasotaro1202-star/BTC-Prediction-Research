  historical_and_integrity:
    name: Incremental historical research + integrity
    needs: [context_router, interaction, robustness, adaptive_ensemble, risk_aware_dynamic, rolling_challenger, extended_features, model_zoo_regime, recency_weighted, situation_meta, online_expert]
    # Integrate evidence only when every parallel research lane completed
    # successfully. Cancelled/failed lanes remain visible and are retried by the
    # watchdog; the final integrator must not consume another long runner on
    # incomplete evidence.
    if: >-
      needs.context_router.result == 'success' &&
      needs.interaction.result == 'success' &&
      needs.robustness.result == 'success' &&
      needs.adaptive_ensemble.result == 'success' &&
      needs.risk_aware_dynamic.result == 'success' &&
      needs.rolling_challenger.result == 'success' &&
      needs.extended_features.result == 'success' &&
      needs.model_zoo_regime.result == 'success' &&
      needs.recency_weighted.result == 'success' &&
      needs.situation_meta.result == 'success' &&
      needs.online_expert.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore historical archive cache
        uses: actions/cache@v6
        with:
          path: /tmp/btc_prediction_archive_cache
          key: btc-9h-archive-${{ runner.os }}-${{ hashFiles('src/historical_research_runner.py', 'scripts/historical_research_spot_fallback.py') }}
          restore-keys: |
            btc-9h-archive-${{ runner.os }}-
            btc-archive-${{ runner.os }}-
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          PY
      - name: Download parallel research evidence
        uses: actions/download-artifact@v6
        with:
          pattern: btc-9h-*
          path: data/historical_research/9h_evidence
          merge-multiple: false
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Record immutable research run context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": int(os.environ.get("GITHUB_RUN_ID", "0")),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "0")),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          if not payload["github_sha"] or payload["run_id"] <= 0:
              raise SystemExit("research run context is incomplete")
          out = Path("data/historical_research/research_run_context.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(payload, sort_keys=True))
          PY
          test -s data/historical_research/research_run_context.json

      - name: Validate parallel OOS evidence manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/historical_research/9h_evidence")
          expected = {
              "btc-9h-adaptive-ensemble": "adaptive_ensemble_oos.json",
              "btc-9h-context-router": "context_router_oos.json",
              "btc-9h-interaction": "interaction_oos_report.json",
              "btc-9h-robustness": "robustness_oos_report.json",
              "btc-9h-rolling-challenger": "rolling_challenger_oos.json",
              "btc-9h-extended-features": "extended_features_oos.json",
              "btc-9h-model-zoo-regime": "model_zoo_regime_oos.json",
          }
          for directory, filename in expected.items():
              path = root / directory / filename
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"missing evidence: {path}")
              obj = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(obj, dict):
                  raise SystemExit(f"{path}: evidence root must be an object")
              if obj.get("research_only") is not True:
                  raise SystemExit(f"{path}: research_only must be true")
              print(f"verified evidence manifest: {path}")
          # The final promotion gate consumes the canonical root robustness report.
          # Bridge only the validated, run-scoped parallel artifact into that location;
          # never synthesize or reuse an unvalidated/stale robustness result.
          validated_robustness = root / "btc-9h-robustness" / "robustness_oos_report.json"
          canonical_robustness = Path("data/historical_research/robustness_oos_report.json")
          if not validated_robustness.is_file() or validated_robustness.stat().st_size <= 0:
              raise SystemExit(f"validated robustness evidence missing: {validated_robustness}")
          canonical_robustness.write_bytes(validated_robustness.read_bytes())
          print(f"bridged validated robustness evidence to {canonical_robustness}")
          PY
      - name: Compile all research code
        run: python -m compileall -q src scripts tests
      - name: Historical research with bounded retries
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "=== 9h historical research attempt ${attempt}/3 ==="
            set +e
            python scripts/historical_research_spot_fallback.py
            status=$?
            set -e
            if [ "${status}" -eq 0 ]; then exit 0; fi
            echo "historical research attempt ${attempt} failed: ${status}"
            if [ "${attempt}" -lt 3 ]; then sleep $((30 * attempt)); fi
          done
          exit 1
      - name: Validate historical evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/report.json')
          if not p.exists():
              raise SystemExit('historical report missing')
          r=json.loads(p.read_text())
          if r.get('protocol_version') != 'historical-v6-microstructure-incremental-cache':
              raise SystemExit('unexpected historical protocol')
          for h in ('5m','10m'):
              hz=r.get('horizons',{}).get(h,{})
              if hz.get('samples',0) <= 0:
                  raise SystemExit(f'{h}: no historical samples')
          print('historical evidence: VERIFIED')
          PY
      - name: Run production artifact audit
        run: python src/production_artifact_audit.py
      - name: Run strict research input audit
        run: python src/research_input_audit.py

      - name: Run PIT/OOS audit
        run: python src/pit_oos_audit.py
      - name: Run fail-closed promotion safety gate
        run: python src/promotion_gate.py
      - name: Validate promotion gate evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/promotion_gate.json')
          if not p.is_file():
              raise SystemExit('promotion gate artifact missing')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('research_only') is not True:
              raise SystemExit('promotion gate must remain research-only')
          if obj.get('final_holdout_protected') is not True:
              raise SystemExit('promotion gate must protect final holdout')
          if obj.get('production_safety_gate') not in {'PASS', 'HOLD'}:
              raise SystemExit('invalid production safety gate state')
          if obj.get('promotion_status') not in {'ELIGIBLE_PENDING_EXPLICIT_PROMOTION','HOLD'}:
              raise SystemExit('unexpected promotion status')
          if not isinstance(obj.get('promotion_allowed'), bool):
              raise SystemExit('promotion_allowed must be boolean')
          print(f"promotion gate evidence: VERIFIED ({obj.get('production_safety_gate')})")
          print(json.dumps(obj, indent=2, sort_keys=True))
          PY
      - name: Upload complete 9h evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-9h-marathon-final
          path: |
            data/historical_research/report.json
            data/historical_research/research_input_audit.json
            data/historical_research/production_integrity.json
            data/historical_research/robustness_oos_report.json
            data/historical_research/context_router_oos.json
            data/historical_research/promotion_gate.json
            data/historical_research/research_run_context.json
            data/historical_research/9h_evidence/**/*.json
          if-no-files-found: warn
          retention-days: 3
