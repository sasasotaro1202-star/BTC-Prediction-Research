name: BTC 9H Research Marathon

# Research-only marathon. It never changes Champion/production model files.
# Three independent OOS diagnostics run in parallel for up to 3h, followed by
# up to 6h of incremental historical research + final integrity checks.
# Total wall-clock envelope: up to 9h. Scheduled daily outside the hourly load peak.
on:
  # This is a long-lived research marathon. Keep it independent of frequent
  # production-state/code pushes so a 9h run can finish and publish a complete
  # evidence set. Use workflow_dispatch after a major protocol change.
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:

concurrency:
  group: btc-9h-research-marathon
  # Research is disposable: when a relevant code change lands, abandon the
  # stale run and restart from the newest main SHA rather than spending hours
  # on obsolete evidence. Production workflows are not governed by this group.
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  context_router:
    name: Context-router chronological OOS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          PY
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Compile and run router OOS
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python src/context_router_oos.py
          test -s data/historical_research/context_router_oos.json
      - name: Upload router evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-9h-context-router
          path: data/historical_research/context_router_oos.json
          retention-days: 3

  interaction:
