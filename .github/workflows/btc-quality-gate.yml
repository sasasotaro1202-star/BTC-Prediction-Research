name: BTC Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install available dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify production tree is unchanged by research-only router
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          bad = []
          for path in Path("src").rglob("*.py"):
              if path.name == "context_model_oos.py":
                  continue
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Could not parse {path}: {exc}")
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  if any(name.endswith("context_model_oos") for name in names):
                      bad.append(str(path))
          if bad:
              raise SystemExit("Production imports research-only router: " + ", ".join(bad))
          PY
          grep -n "production_changed" tests/test_context_model_oos.py >/dev/null
          echo "Research-only production guard is present."
