name: BTC Production Core Future OOS

on:
  pull_request:
    paths:
      - 'src/production_core_oos.py'
      - 'tests/test_production_core_oos.py'
      - 'src/bootstrap_train.py'
      - 'src/ensemble_model.py'
      - 'src/binance_history.py'
      - 'src/feature_schema.py'
      - 'src/label_policy.py'
      - 'models/5m.joblib'
      - 'models/10m.joblib'
      - 'models/5m.json'
      - 'models/10m.json'
      - '.github/workflows/btc_production_core_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-production-core-oos-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_production_core_oos.py
      - name: Run future OOS
        run: |
          set -euo pipefail
          python src/production_core_oos.py
          test -s data/historical_research/production_core_oos.json
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/production_core_oos.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          assert obj['research_only'] is True
          assert obj['production_changed'] is False
          assert obj['strict_pit'] is False
          assert obj['promotion_evidence_eligible'] is False
          for h,v in obj['horizons'].items():
              if v['status'] == 'OK':
                  assert v['final_holdout_protected'] if 'final_holdout_protected' in v else True
          print('validated research-only production-core OOS evidence')
          PY
      - name: Upload evidence
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-production-core-oos
          path: data/historical_research/production_core_oos.json
          if-no-files-found: error
          retention-days: 7
