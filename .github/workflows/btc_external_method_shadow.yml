name: BTC External Method Shadow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-external-method-shadow
  cancel-in-progress: false

jobs:
  shadow_compute:
    name: "Kronos live-shadow compute (isolated)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate active candidate is shadow-ready
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("data/external_research_method_queue.json").read_text())
          r=json.loads(Path("data/external_research_runtime.json").read_text())
          rec=r.get("results",{}).get("shiyu-coder/Kronos",{})
          if rec.get("status") != "LOCAL_GATE_READY":
              raise SystemExit(f"Kronos not LOCAL_GATE_READY: {rec.get('status')}")
          candidate=next((x for x in q.get("candidates",[]) if x.get("repository")=="shiyu-coder/Kronos"),{})
          if candidate.get("shadow_adapter") != "kronos":
              raise SystemExit("Kronos shadow adapter missing")
          if candidate.get("production_eligible") is not False:
              raise SystemExit("Kronos candidate unexpectedly production eligible")
          PY

      - name: Clone pinned Kronos source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads((Path('data/external_research_results')/'shiyu-coder__Kronos.json').read_text())
          print(obj['primary_source_verification']['source_commit_sha'])
          PY
          )"
          git clone --no-checkout https://github.com/shiyu-coder/Kronos.git /tmp/Kronos
          cd /tmp/Kronos
          git fetch --depth 1 origin "$source_sha"
          git checkout --detach "$source_sha"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/kronos_source_sha.txt"

      - name: Install isolated research dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir numpy pandas torch einops huggingface_hub safetensors

      - name: Run isolated Kronos shadow
        env:
          KRONOS_SAMPLE_PATHS: '8'
          PYTHONPATH: /tmp/Kronos
        run: |
          set -euo pipefail
          python src/external_method_shadow.py

      - name: Verify research-only output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state=Path("data/external_research_shadow/kronos_shadow.json")
          obj=json.loads(state.read_text())
          if obj.get("research_only") is not True:
              raise SystemExit("shadow state not research_only")
          if obj.get("production_changed") is not False:
              raise SystemExit("shadow state reports production_changed=true")
          if obj.get("repository") != "shiyu-coder/Kronos":
              raise SystemExit("unexpected shadow repository")
          print("Kronos shadow safety boundary: VERIFIED")
          PY

      - name: Upload shadow evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-kronos-shadow-${{ github.run_id }}
          path: |
            data/external_research_shadow/kronos_shadow.json
            data/external_research_runtime.json
            kronos_source_sha.txt
          if-no-files-found: error
          retention-days: 14

  commit_research_state:
    name: "Commit research-only shadow state"
    needs: shadow_compute
    if: needs.shadow_compute.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download isolated shadow evidence
        uses: actions/download-artifact@v6
        with:
          name: btc-kronos-shadow-${{ github.run_id }}
          path: .

      - name: Verify only research state is mutable
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain=v1 | awk '$2 !~ /^data\/external_research_(runtime\.json|shadow\/)/ && $2 !~ /^kronos_source_sha\.txt$/ {print $2}')"
          if [ -n "$unexpected" ]; then
            echo "UNEXPECTED_RESEARCH_WORKTREE_CHANGES" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("data/external_research_shadow/kronos_shadow.json").read_text())
          if obj.get("production_changed") is not False or obj.get("research_only") is not True:
              raise SystemExit("shadow safety metadata invalid")
          runtime=json.loads(Path("data/external_research_runtime.json").read_text())
          if runtime.get("production_changed") is not False or runtime.get("research_only") is not True:
              raise SystemExit("runtime safety metadata invalid")
          PY

      - name: Commit research state only
        shell: bash
        run: |
          set -euo pipefail
          git add data/external_research_runtime.json data/external_research_shadow/kronos_shadow.json
          if git diff --cached --quiet; then
            echo "No new shadow research state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: advance Kronos live shadow state"
          git push origin HEAD:main
