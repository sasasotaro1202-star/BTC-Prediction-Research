name: BTC Hierarchical Direction Research

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_hierarchical_research.yml'


concurrency:
  group: btc-hierarchical-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hierarchical:
    name: Hierarchical FLAT-vs-MOVE OOS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          if [ -s data/predictions.db.gz ]; then
            python -c "from pathlib import Path; from src.state_archive import restore_db; restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))"
          else
            echo 'No canonical prediction state; lane will remain DEFERRED.'
          fi
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          python -m pytest -q tests/test_hierarchical_oos.py
      - name: Run hierarchical OOS
        run: |
          set -euo pipefail
          python src/hierarchical_oos.py
          test -s data/historical_research/hierarchical_oos.json
      - name: Validate research-only evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/historical_research/hierarchical_oos.json').read_text(encoding='utf-8'))
          if obj.get('research_only') is not True:
              raise SystemExit('research_only contract violated')
          if obj.get('production_changed') is not False:
              raise SystemExit('production mutation reported')
          if not isinstance(obj.get('horizons'), dict):
              raise SystemExit('horizon evidence missing')
          for h,item in obj['horizons'].items():
              if item.get('status') not in {'OK','DEFERRED'}:
                  raise SystemExit(f'{h}: invalid status')
              if item.get('status') == 'OK' and item.get('final_holdout_protected') is not True:
                  raise SystemExit(f'{h}: holdout protection missing')
          print('hierarchical research evidence: VERIFIED')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: btc-hierarchical-research
          path: data/historical_research/hierarchical_oos.json
          retention-days: 14
