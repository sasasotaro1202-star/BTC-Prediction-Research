name: BTC Consensus Correction OOS

on:
  pull_request:
    paths:
      - 'src/consensus_correction_oos.py'
      - 'tests/test_consensus_correction_oos.py'
      - 'src/model_compare.py'
      - '.github/workflows/btc_consensus_correction_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-consensus-correction-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_consensus_correction_oos.py
      - name: Run chronological OOS
        run: |
          set -euo pipefail
          python src/consensus_correction_oos.py
          test -s data/historical_research/consensus_correction_oos.json
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path("data/historical_research/consensus_correction_oos.json").read_text(encoding="utf-8"))
          assert o.get("schema_version")==1
          assert o.get("research_only") is True
          assert o.get("production_changed") is False
          for h,v in o["horizons"].items():
              assert h in {"5m","10m"}
              assert v.get("research_only") is True
              assert v.get("production_changed") is False
              assert v.get("promotion_allowed",False) is False
          print("consensus correction OOS evidence contract verified")
          PY
      - name: Upload evidence
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-consensus-correction-\${{ github.run_id }}
          path: data/historical_research/consensus_correction_oos.json
          if-no-files-found: error
          retention-days: 7
