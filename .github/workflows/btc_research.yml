name: BTC Research

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

concurrency:
  # Serialize every BTC workflow that can write predictions/models to main.
  group: btc-state-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install research dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then
              exit 0
            fi
            echo "pip install attempt ${attempt} failed"
            sleep $((10 * attempt))
          done
          exit 1
      - name: Compile research code
        run: python -m compileall -q src
      - name: Recalculate calibration metrics
        run: python src/calibration.py
      - name: Run model research and adoption gate
        run: python src/model_compare.py
      - name: Audit production artifact provenance
        run: python src/production_artifact_audit.py
      - name: Validate model and provenance artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          for h in ('5m','10m'):
              p=Path(f'models/{h}.joblib')
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(f'missing production model: {p}')
              meta=Path(f'models/{h}.json')
              if not meta.exists():
                  raise SystemExit(f'missing model metadata: {meta}')
              obj=json.loads(meta.read_text())
              if obj.get('horizon') != h or obj.get('candidate') is not False:
                  raise SystemExit(f'invalid production metadata: {meta}')
          audit=Path('data/historical_research/production_artifact_audit.json')
          if not audit.exists():
              raise SystemExit('missing production artifact provenance audit')
          obj=json.loads(audit.read_text())
          artifacts=obj.get('artifacts')
          if not isinstance(artifacts,list) or len(artifacts) != 2:
              raise SystemExit('invalid production artifact provenance audit')
          for item in artifacts:
              if item.get('horizon') not in {'5m','10m'}:
                  raise SystemExit('invalid audit horizon')
              if len(str(item.get('model_sha256',''))) != 64 or len(str(item.get('metadata_sha256',''))) != 64:
                  raise SystemExit('invalid production artifact fingerprint')
          print('production model and provenance artifact validation: OK')
          PY
      - name: Upload BTC research state before commit
        uses: actions/upload-artifact@v6
        with:
          name: btc-research-state
          path: |
            data/predictions.db
            data/historical_research/production_artifact_audit.json
            models/*.json
            models/*.joblib
          retention-days: 14
      - name: Commit adopted model and provenance state with conflict-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/predictions.db data/historical_research/production_artifact_audit.json models/*.json models/*.joblib
          if git diff --cached --quiet; then
            echo 'No research-state changes to commit.'
            exit 0
          fi
          git commit -m 'Update BTC model research state'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "git push attempt ${attempt} failed; preserving local research state and rebuilding on origin/main"
            rm -rf /tmp/btc_research_models
            mkdir -p /tmp/btc_research_models
            cp -a models/. /tmp/btc_research_models/
            cp data/predictions.db /tmp/btc_research_predictions.db
            if [ -f data/historical_research/production_artifact_audit.json ]; then cp data/historical_research/production_artifact_audit.json /tmp/btc_research_artifact_audit.json; fi
            git rebase --abort 2>/dev/null || true
            git fetch --prune origin main
            git reset --hard origin/main
            cp -a /tmp/btc_research_models/. models/
            cp /tmp/btc_research_predictions.db data/predictions.db
            if [ -f /tmp/btc_research_artifact_audit.json ]; then cp /tmp/btc_research_artifact_audit.json data/historical_research/production_artifact_audit.json; fi
            git add data/predictions.db data/historical_research/production_artifact_audit.json models/*.json models/*.joblib
            git diff --cached --quiet || git commit -m 'Merge BTC research state safely'
            sleep $((5 * attempt))
          done
          echo 'git push failed after 5 attempts'
          exit 1
