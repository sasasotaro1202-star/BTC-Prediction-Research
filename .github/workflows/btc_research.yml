name: BTC Research
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python src/calibration.py
      - run: python src/model_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-research-db
          path: data/predictions.db
