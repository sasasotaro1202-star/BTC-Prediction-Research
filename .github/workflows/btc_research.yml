name: BTC Research
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Recalculate calibration
        run: python src/calibration.py
      - name: Train, OOS-test, compare, and adopt/reject
        run: python src/model_compare.py
      - name: Persist research state
        run: |
          git config user.name "btc-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.db data/models || true
          git commit -m "Persist BTC model research state" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: btc-research-db
          path: |
            data/predictions.db
            data/models/*.json
