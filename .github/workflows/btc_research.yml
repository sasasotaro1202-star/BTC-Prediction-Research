name: BTC Research
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
concurrency:
  group: btc-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Recalculate calibration metrics
        run: python src/calibration.py
      - name: Run model research and adoption gate
        run: python src/model_compare.py
      - name: Commit adopted model state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/predictions.db data/models/*.json data/models/*.joblib
          if git diff --cached --quiet; then
            echo 'No research-state changes to commit.'
          else
            git commit -m 'Update BTC model research state'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: btc-research-state
          path: |
            data/predictions.db
            data/models/*.json
            data/models/*.joblib
