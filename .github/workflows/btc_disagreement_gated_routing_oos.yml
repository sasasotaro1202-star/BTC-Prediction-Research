name: BTC Disagreement-Gated Routing OOS

on:
  pull_request:
    paths:
      - 'src/disagreement_gated_routing_oos.py'
      - 'tests/test_disagreement_gated_routing_oos.py'
      - '.github/workflows/btc_disagreement_gated_routing_oos.yml'
      - 'src/model_compare.py'
      - 'models/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-disagreement-gated-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_disagreement_gated_routing_oos.py
      - name: Run chronological OOS
        run: |
          set -euo pipefail
          python src/disagreement_gated_routing_oos.py
          test -s data/historical_research/disagreement_gated_routing_oos.json
      - name: Validate research evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/disagreement_gated_routing_oos.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["research_only"] is True
          assert d["production_changed"] is False
          for h in ("5m","10m"):
              assert d["horizons"][h]["final_holdout_protected"] is True
          print("evidence contract verified")
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-disagreement-gated-routing-${{ github.run_id }}
          path: data/historical_research/disagreement_gated_routing_oos.json
          if-no-files-found: error
          retention-days: 3
