name: BTC Autonomous Data Frontier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/btc_data_frontier_autoselect.py"
      - "tests/test_btc_data_frontier_autoselect.py"
      - ".github/workflows/btc_autonomous_data_frontier.yml"
  schedule:
    - cron: "*/15 * * * *"
permissions:
  actions: write
  contents: write
concurrency:
  group: btc-autonomous-data-frontier
  cancel-in-progress: false
jobs:
  discover-acquire-select:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - name: Load persistent selector state
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/historical_research/data_frontier_state.json
          if git fetch --no-tags --depth=1 origin btc-data-frontier-state; then
            if git show origin/btc-data-frontier-state:data/historical_research/data_frontier_state.json > data/historical_research/data_frontier_state.json 2>/dev/null; then
              echo "Loaded persistent frontier selector state."
            else
              echo "State branch exists but no state file is published yet; starting selector state fresh."
            fi
          else
            echo "WARN: frontier selector state branch unavailable; selection starts from local evidence only."
          fi
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Compile
        run: python -m py_compile src/btc_data_frontier_autoselect.py tests/test_btc_data_frontier_autoselect.py
      - name: Contract tests
        run: python -m unittest discover -s tests -p 'test_btc_data_frontier_autoselect.py' -v
      - name: Discover, acquire, and select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u src/btc_data_frontier_autoselect.py | tee data_frontier_run.json
      - name: Validate fail-closed output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/historical_research/data_frontier.json").read_text())
          last=json.loads(Path("data/historical_research/data_frontier_run.json").read_text())
          if last.get("free_only") is not True or last.get("production_changed") is not False or last.get("unknown_pit_policy")!="FAIL_CLOSED":
              raise SystemExit("frontier safety contract failed")
          actions=last.get("actions",{})
          if actions.get("continue_discovery") is not True or actions.get("continue_selection") is not True:
              raise SystemExit("continuous frontier loop disabled")
          for row in p.get("candidates",{}).values():
              if row.get("production_eligible") is not False: raise SystemExit("unverified candidate became production eligible")
          print({"cycle":last.get("cycle"),"gap":last.get("gap"),"selected":last.get("selected_source_ids"),"discovered":len(p.get("candidates",{})),"actions":actions})
          PY
      - name: Recover missing verified primary data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          actions_state="$(python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("data/historical_research/data_frontier_run.json").read_text(encoding="utf-8"))
          print(json.dumps(obj.get("actions") or {}, sort_keys=True))
          PY
          )"
          need_live="$(jq -r '.collect_live // false' <<<"$actions_state")"
          need_ws="$(jq -r '.warm_binance_ws // false' <<<"$actions_state")"
          main_sha="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          dispatch_verified() {
            workflow="$1"
            threshold="$2"
            response="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=20")"
            active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress") | select(.head_sha==$sha)] | length' --arg sha "$main_sha" <<<"$response")"
            latest="$(jq -r --arg sha "$main_sha" '[.workflow_runs[]? | select(.status=="completed" and .head_sha==$sha and .conclusion!="skipped")] | sort_by(.updated_at) | last // empty | [.updated_at,.id] | @tsv' <<<"$response")"
            updated="$(cut -f1 <<<"$latest")"
            latest_id="$(cut -f2 <<<"$latest")"
            if [ -z "$updated" ]; then age=999999999; else age=$(( $(date -u +%s) - $(date -d "$updated" +%s) )); fi
            echo "${workflow}: active_current_main=${active} latest_current_main=${latest_id:-none} age=${age}s threshold=${threshold}s"
            if [ "$active" -gt 0 ] || [ "$age" -lt "$threshold" ]; then return 0; fi
            started="$(date -u +%s)"
            gh api --method POST "/repos/${REPO}/actions/workflows/${workflow}/dispatches" -f ref=main >/dev/null
            for _ in 1 2 3 4 5 6; do
              sleep 5
              fresh="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=20" | jq -r --arg sha "$main_sha" --argjson started "$started" '[.workflow_runs[]? | select(.head_sha==$sha and (.created_at | fromdateiso8601) >= $started)] | sort_by(.created_at) | last // empty | [.id,.status] | @tsv')"
              if [ -n "$fresh" ]; then echo "${workflow}: dispatch verified ${fresh}"; return 0; fi
            done
            echo "${workflow}: dispatch verification failed" >&2
            return 1
          }
          if [ "$need_live" = "true" ]; then dispatch_verified btc_live_cycle.yml 300; fi
          if [ "$need_ws" = "true" ]; then dispatch_verified btc_binance_ws_collector.yml 900; fi
      - name: Upload frontier evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-data-frontier-${{ github.run_id }}
          path: |
            data/historical_research/data_frontier.json
            data/historical_research/source_snapshots/
            data/historical_research/data_frontier_state.json
            data_frontier_run.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist frontier selector state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/historical_research/data_frontier_state.json
          if ! git fetch --no-tags --depth=1 origin btc-data-frontier-state; then
            echo "ERROR: frontier selector state branch cannot be fetched; refusing to discard selection memory." >&2
            exit 1
          fi
          git switch --detach origin/btc-data-frontier-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_research/data_frontier_state.json
          if git diff --cached --quiet; then
            echo "Selector state unchanged."
            exit 0
          fi
          git commit -m "chore: persist autonomous BTC frontier selector state"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:btc-data-frontier-state; then
              echo "Persistent selector state published."
              exit 0
            fi
            git fetch --no-tags --depth=1 origin btc-data-frontier-state
            git rebase origin/btc-data-frontier-state
            sleep $((attempt * 2))
          done
          echo "ERROR: selector state branch publish failed after bounded retries." >&2
          exit 1

      - name: Persist newly discovered frontier candidates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_research/data_frontier.json
          if git diff --cached --quiet; then
            echo "No new frontier candidates to persist"
            exit 0
          fi
          git commit -m "chore: advance autonomous BTC data frontier"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "bounded frontier push recovery exhausted" >&2
          exit 1
