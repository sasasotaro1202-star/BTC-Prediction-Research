name: BTC Autonomous Data Frontier
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"
permissions:
  contents: write
concurrency:
  group: btc-autonomous-data-frontier
  cancel-in-progress: false
jobs:
  discover-acquire-select:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Compile
        run: python -m py_compile src/btc_data_frontier_autoselect.py tests/test_btc_data_frontier_autoselect.py
      - name: Contract tests
        run: python -m pytest -q tests/test_btc_data_frontier_autoselect.py tests/test_btc_source_frontier_catalog.py
      - name: Discover, acquire, and select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u src/btc_data_frontier_autoselect.py | tee data_frontier_run.json
      - name: Validate fail-closed output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/historical_research/data_frontier.json").read_text())
          last=p.get("last_run",{})
          if last.get("free_only") is not True or last.get("production_changed") is not False or last.get("unknown_pit_policy")!="FAIL_CLOSED":
              raise SystemExit("frontier safety contract failed")
          for row in p.get("candidates",{}).values():
              if row.get("production_eligible") is not False: raise SystemExit("unverified candidate became production eligible")
          print({"cycle":last.get("cycle"),"gap":last.get("gap"),"selected":last.get("selected_source_ids"),"discovered":len(p.get("candidates",{}))})
          PY
      - name: Upload frontier evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-data-frontier-${{ github.run_id }}
          path: |
            data/historical_research/data_frontier.json
            data/historical_research/source_snapshots/
            data_frontier_run.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist frontier and snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_research/data_frontier.json data/historical_research/source_snapshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: advance autonomous BTC data frontier"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          echo "bounded push recovery exhausted" >&2
          exit 1
