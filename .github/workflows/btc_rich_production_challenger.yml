name: BTC Rich Production Challenger

on:
  push:
    branches: [main]
    paths:
      - 'src/rich_production_research.py'
      - 'src/historical_research.py'
      - 'src/historical_research_runner.py'
      - 'tests/test_rich_production_research.py'
      - '.github/workflows/btc_rich_production_challenger.yml'
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

concurrency:
  group: btc-rich-production-challenger
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then
              exit 0
            fi
            sleep $((15 * attempt))
          done
          exit 1

      - name: Compile challenger
        run: python -m compileall -q src tests

      - name: Run challenger
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "=== rich challenger attempt ${attempt}/3 ==="
            if python -m src.rich_production_research; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((30 * attempt))
            fi
          done
          exit 1

      - name: Validate challenger report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/historical_research/rich_production_challenger.json")
          if not path.is_file():
              raise SystemExit("rich challenger report missing")
          obj = json.loads(path.read_text(encoding="utf-8"))
          assert obj.get("schema_version") == 1
          assert obj.get("research_only") is True
          assert obj.get("production_changed") is False
          assert set(obj.get("horizons", {})) == {"5m", "10m"}
          for horizon, result in obj["horizons"].items():
              assert result["status"] == "OK", horizon
              assert result["frozen_holdout_n"] >= 2000, horizon
              assert set(result["frozen_holdout"]) >= {
                  "current_champion", "legacy_retrained", "rich_candidate",
                  "rich_vs_champion", "stability_vs_champion",
                  "bootstrap_ci_vs_champion"
              }, horizon
          print("rich challenger artifact validation: OK")
          PY

      - name: Upload challenger artifact
        uses: actions/upload-artifact@v6
        with:
          name: btc-rich-production-challenger
          path: |
            data/historical_research/rich_production_challenger.json
            models/5m.rich_candidate.json
            models/10m.rich_candidate.json
            models/5m.rich_candidate.joblib
            models/10m.rich_candidate.joblib
          if-no-files-found: ignore
          retention-days: 7
