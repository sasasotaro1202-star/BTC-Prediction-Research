name: BTC Prediction Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'data/historical_research/forecast_trajectory.json'
      - 'data/historical_research/pit_oos_audit.json'
      - 'data/live_cycle_status.json'
      - '.github/workflows/btc_pages_dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: btc-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare dashboard site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data/historical_research
          cp docs/index.html _site/index.html
          if [ -s data/historical_research/forecast_trajectory.json ]; then
            cp data/historical_research/forecast_trajectory.json _site/data/forecast_trajectory.json
          else
            printf '%s\n' '{"schema_version":1,"status":"UNAVAILABLE","horizons":{}}' > _site/data/forecast_trajectory.json
          fi
          for path in data/historical_research/pit_oos_audit.json data/live_cycle_status.json; do
            if [ -s "$path" ]; then
              cp "$path" "_site/$path"
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("_site/data/forecast_trajectory.json").read_text(encoding="utf-8"))
          if obj.get("status") == "UNAVAILABLE":
              print("BTC dashboard data: WAITING_FOR_FIRST_TRAJECTORY")
          elif obj.get("horizon_order") != ["5m","10m","15m","30m","1h","3h","6h","12h","24h"]:
              raise SystemExit("dashboard trajectory horizon order invalid")
          else:
              print("BTC dashboard data: VERIFIED")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
