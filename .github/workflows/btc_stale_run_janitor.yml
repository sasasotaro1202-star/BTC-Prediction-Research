name: BTC Stale Run Janitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-stale-run-janitor
  cancel-in-progress: true

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel stale main-head runs
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          now="$(date -u +%s)"
          echo "Current main SHA: ${main_sha}"

          # Keep janitor bounded: inspect only the production/research spine.
          # The 5-minute watchdog owns broader recovery; this job only handles clearly
          # stale main-branch runs that can block the spine.
          declare -A THRESHOLD=(
            [btc_continuous_supervisor.yml]=21600
            [btc_live_cycle.yml]=1800
            [btc_binance_ws_collector.yml]=3900
            [btc_9h_research_marathon.yml]=36000
            [btc_rolling_challenger.yml]=28800
          )

          for workflow in "${!THRESHOLD[@]}"; do
            threshold="${THRESHOLD[$workflow]}"
            response="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=30")" || {
              echo "WARN: unable to inspect ${workflow}; skipping."
              continue
            }
            jq -c '.workflow_runs[]? | {id,status,head_sha,updated_at,run_number}' <<<"$response" |
            while IFS= read -r run; do
              [ -n "$run" ] || continue
              id="$(jq -r '.id // 0' <<<"$run")"
              status="$(jq -r '.status // ""' <<<"$run")"
              head="$(jq -r '.head_sha // ""' <<<"$run")"
              updated="$(jq -r '.updated_at // ""' <<<"$run")"
              updated_epoch="$(date -d "$updated" +%s 2>/dev/null || echo 0)"
              age=$((now - updated_epoch))

              [ "$id" -gt 0 ] || continue
              [ "$id" -ne "${GITHUB_RUN_ID}" ] || continue
              case "$status" in queued|pending|in_progress) ;; *) continue ;; esac

              if [ "$head" != "$main_sha" ] && [ "$age" -ge "$threshold" ]; then
                echo "CANCEL stale ${workflow} run=${id} run_number=$(jq -r '.run_number // 0' <<<"$run") age=${age}s head=${head}"
                cancel_response="$(gh api --method POST "/repos/${REPO}/actions/runs/${id}/cancel" 2>&1)" || cancel_rc=$?
                cancel_rc="${cancel_rc:-0}"
                if [ "${cancel_rc}" -eq 0 ]; then
                  echo "CANCEL requested successfully: ${workflow} run=${id}"
                elif grep -qiE '404|Not Found' <<<"${cancel_response}"; then
                  echo "WARN: stale run ${workflow} run=${id} disappeared before cancellation (race; treating as already handled)."
                else
                  echo "WARN: cancel request failed: ${workflow} run=${id} rc=${cancel_rc} response=${cancel_response}"
                fi
              fi
            done
          done


          dispatch_if_stale() {
            workflow="$1"
            threshold="$2"

            response="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=20" 2>/dev/null)" || {
              echo "WARN: unable to inspect ${workflow} for redundant freshness recovery."
              return 0
            }

            active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"$response")"
            latest="$(jq -r --arg main "$main_sha" '[.workflow_runs[]? | select(.status=="completed" and .conclusion!="skipped" and .head_sha==$main)] | sort_by(.updated_at) | last // empty | [.updated_at,.id] | @tsv' <<<"$response")"
            latest_updated="$(cut -f1 <<<"$latest")"
            latest_id="$(cut -f2 <<<"$latest")"

            if [ -z "$latest_updated" ]; then
              latest_epoch=0
            else
              latest_epoch="$(date -d "$latest_updated" +%s 2>/dev/null || echo 0)"
            fi
            now="$(date -u +%s)"
            age=$((now-latest_epoch))
            echo "Recovery ${workflow}: active=${active} latest_current_main_age=${age}s threshold=${threshold}s"

            if [ "$active" -eq 0 ] && { [ "$latest_epoch" -eq 0 ] || [ "$age" -ge "$threshold" ]; }; then
              echo "Redundant dispatch for stale ${workflow} (latest_current_main_run=${latest_id:-none})"
              if gh api --method POST "/repos/${REPO}/actions/workflows/${workflow}/dispatches" -f ref=main >/dev/null 2>&1; then
                echo "Redundant recovery dispatch succeeded: ${workflow}"
              else
                echo "WARN: redundant recovery dispatch failed: ${workflow}"
              fi
            fi
          }

          # Redundant recovery only; dedicated workflows remain the primary executor.
          dispatch_if_stale btc_continuous_supervisor.yml 300
          dispatch_if_stale btc_live_cycle.yml 300
          dispatch_if_stale btc_binance_ws_collector.yml 900
          echo "Stale-run janitor completed."
