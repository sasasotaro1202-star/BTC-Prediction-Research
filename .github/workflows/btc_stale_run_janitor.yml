name: BTC Stale Run Janitor

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_stale_run_janitor.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-stale-run-janitor
  cancel-in-progress: true

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel stale main-head runs
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          now="$(date -u +%s)"
          echo "Current main SHA: ${main_sha}"

          # Production-first backpressure: when the 5m Live Cycle is already
          # queued/pending/in_progress, queued research-only runs must not consume
          # scarce runner capacity ahead of production. Only queued/pending research
          # runs are cancelled; in-progress research is left intact and can finish.
          live_response="$(gh api "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/runs?branch=main&per_page=20")"
          production_active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"${live_response}")"
          production_queue_backpressure=0
          if [ "${production_active}" -gt 0 ]; then
            production_queue_backpressure=1
            echo "Production Live Cycle active (${production_active}); applying queued-research backpressure."
          fi

          queue_pressure_research=(
            btc_research.yml
            btc_exogenous_research.yml
            btc_recency_research.yml
            btc_interaction_research.yml
            btc_binary_target_research.yml
            btc_historical_research.yml
            btc_archive_refresh.yml
            btc_archive_primary_bridge.yml
            btc_microstructure_research.yml
            btc_hierarchical_research.yml
            btc_dual_memory_oos.yml
            btc_time_regime_research.yml
            btc_calibration_frozen_replay.yml
            btc_adaptive_calibration_replay.yml
            btc_multiscale_frozen_replay.yml
            btc_selective_research.yml
            btc_selective_prediction_oos.yml
            btc_uncertainty_layer_oos.yml
            btc_return_distribution_tail_oos.yml
            btc_frontier_branch_validation.yml
          )

          cancel_queued_research() {
            [ "${production_queue_backpressure}" -eq 1 ] || return 0
            local workflow="${1}"
            local response
            local cancel_rc=0
            local cancel_response
            response="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=30" 2>/dev/null)" || {
              echo "WARN: unable to inspect queued research ${workflow}; continue."
              return 0
            }
            while IFS=$'\t' read -r run_id status head_sha run_number; do
              [ -n "${run_id}" ] || continue
              case "${status}" in
                queued|pending) ;;
                *) continue ;;
              esac
              [ "${run_id}" -ne "${GITHUB_RUN_ID}" ] || continue
              echo "${workflow}: cancelling queued/pending research run ${run_id} run_number=${run_number} while Production is active"
              cancel_response="$(gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/cancel" 2>&1)" || cancel_rc=$?
              cancel_rc="${cancel_rc:-0}"
              if [ "${cancel_rc}" -eq 0 ]; then
                echo "${workflow}: queued research run ${run_id} cancelled for production backpressure"
              elif grep -qiE '404|Not Found' <<<"${cancel_response}"; then
                echo "WARN: queued research run ${workflow} run=${run_id} disappeared before cancellation."
              else
                echo "WARN: failed to cancel queued research ${workflow} run=${run_id} rc=${cancel_rc} response=${cancel_response}" >&2
              fi
              cancel_rc=0
            done < <(jq -r '.workflow_runs[]? | [.id,.status,.head_sha,.run_number] | @tsv' <<<"${response}")
          }

          # Collector generations are state-only cache infrastructure. Keep only the
          # newest active generation so legacy per-SHA concurrency cannot strand runners.
          collector_response="$(gh api "/repos/${REPO}/actions/workflows/btc_binance_ws_collector.yml/runs?per_page=30")"
          collector_runs="$(jq -c "[.workflow_runs[]? | select(.status==\"queued\" or .status==\"pending\" or .status==\"in_progress\") | {id,run_number,status,created_at}] | sort_by(.created_at) | reverse" <<<"${collector_response}")"
          collector_count="$(jq "length" <<<"${collector_runs}")"
          if [ "${collector_count}" -gt 1 ]; then
            echo "Collector active generations=${collector_count}; collapsing to newest active generation."
            jq -r ".[1:][]?.id" <<<"${collector_runs}" | while IFS= read -r collector_id; do
              [ -n "${collector_id}" ] || continue
              [ "${collector_id}" -ne "${GITHUB_RUN_ID}" ] || continue
              cancel_rc=0
              cancel_response="$(gh api --method POST "/repos/${REPO}/actions/runs/${collector_id}/cancel" 2>&1)" || cancel_rc=$?
              if [ "${cancel_rc}" -eq 0 ]; then
                echo "CANCEL duplicate Binance WS collector run=${collector_id}"
              elif grep -qiE "404|Not Found" <<<"${cancel_response}"; then
                echo "WARN: duplicate collector run=${collector_id} disappeared before cancellation."
              else
                echo "WARN: failed to cancel duplicate collector run=${collector_id} rc=${cancel_rc} response=${cancel_response}" >&2
              fi
            done
          fi

          # Keep janitor bounded: inspect only the production/research spine.
          # The 5-minute watchdog owns broader recovery; this job only handles clearly
          # stale main-branch runs that can block the spine.
          declare -A THRESHOLD=(
            [btc_continuous_supervisor.yml]=600
            [btc_live_cycle.yml]=1800
            [btc_binance_ws_collector.yml]=3900
            [btc_9h_research_marathon.yml]=36000
            [btc_rolling_challenger.yml]=28800
          )

          for workflow in "${!THRESHOLD[@]}"; do
            threshold="${THRESHOLD[$workflow]}"
            response="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=30")" || {
              echo "WARN: unable to inspect ${workflow}; skipping."
              continue
            }
            jq -c '.workflow_runs[]? | {id,status,head_sha,updated_at,run_number}' <<<"$response" |
            while IFS= read -r run; do
              [ -n "$run" ] || continue
              id="$(jq -r '.id // 0' <<<"$run")"
              status="$(jq -r '.status // ""' <<<"$run")"
              head="$(jq -r '.head_sha // ""' <<<"$run")"
              updated="$(jq -r '.updated_at // ""' <<<"$run")"
              updated_epoch="$(date -d "$updated" +%s 2>/dev/null || echo 0)"
              age=$((now - updated_epoch))

              [ "$id" -gt 0 ] || continue
              [ "$id" -ne "${GITHUB_RUN_ID}" ] || continue
              case "$status" in queued|pending|in_progress) ;; *) continue ;; esac

              if [ "$head" != "$main_sha" ] && [ "$age" -ge "$threshold" ]; then
                echo "CANCEL stale ${workflow} run=${id} run_number=$(jq -r '.run_number // 0' <<<"$run") age=${age}s head=${head}"
                cancel_response="$(gh api --method POST "/repos/${REPO}/actions/runs/${id}/cancel" 2>&1)" || cancel_rc=$?
                cancel_rc="${cancel_rc:-0}"
                if [ "${cancel_rc}" -eq 0 ]; then
                  echo "CANCEL requested successfully: ${workflow} run=${id}"
                elif grep -qiE '404|Not Found' <<<"${cancel_response}"; then
                  echo "WARN: stale run ${workflow} run=${id} disappeared before cancellation (race; treating as already handled)."
                else
                  echo "WARN: cancel request failed: ${workflow} run=${id} rc=${cancel_rc} response=${cancel_response}"
                fi
              fi
            done
          done


          # Recovery dispatch is centralized in the Continuous Supervisor, Workflow Watchdog,
          # and Production Sentinel. The janitor only cancels clearly stale/duplicate runs so
          # multiple dispatchers cannot create an avoidable recovery storm.

          echo "Stale-run janitor completed."
\t' read -r run_id status head_sha run_number; do
