              id="$(jq -r '.id // 0' <<<"$run")"
              status="$(jq -r '.status // ""' <<<"$run")"
              head="$(jq -r '.head_sha // ""' <<<"$run")"
              updated="$(jq -r '.updated_at // ""' <<<"$run")"
