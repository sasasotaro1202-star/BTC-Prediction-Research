name: BTC Stale Run Janitor

on:
  push:
    branches: [main]
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-stale-run-janitor
  cancel-in-progress: true

jobs:
  janitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel stale main-head runs
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          now="$(date -u +%s)"
          echo "Current main SHA: ${main_sha}"

          # Keep janitor bounded: inspect only the production/research spine.
          # The 5-minute watchdog owns broader recovery; this job only handles clearly
          # stale main-branch runs that can block the spine.
          declare -A THRESHOLD=(
            [btc_continuous_supervisor.yml]=21600
            [btc_live_cycle.yml]=1800
            [btc_binance_ws_collector.yml]=3900
            [btc_9h_research_marathon.yml]=36000
            [btc_rolling_challenger.yml]=28800
          )

          for workflow in "${!THRESHOLD[@]}"; do
            threshold="${THRESHOLD[$workflow]}"
            response="$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=30")" || {
              echo "WARN: unable to inspect ${workflow}; skipping."
              continue
            }
            jq -c '.workflow_runs[]? | {id,status,head_sha,updated_at,run_number}' <<<"$response" |
            while IFS= read -r run; do
              [ -n "$run" ] || continue
              id="$(jq -r '.id // 0' <<<"$run")"
              status="$(jq -r '.status // ""' <<<"$run")"
              head="$(jq -r '.head_sha // ""' <<<"$run")"
              updated="$(jq -r '.updated_at // ""' <<<"$run")"
              updated_epoch="$(date -d "$updated" +%s 2>/dev/null || echo 0)"
              age=$((now - updated_epoch))

              [ "$id" -gt 0 ] || continue
              [ "$id" -ne "${GITHUB_RUN_ID}" ] || continue
              case "$status" in queued|pending|in_progress) ;; *) continue ;; esac

              if [ "$head" != "$main_sha" ] && [ "$age" -ge "$threshold" ]; then
                echo "CANCEL stale ${workflow} run=${id} run_number=$(jq -r '.run_number // 0' <<<"$run") age=${age}s head=${head}"
                if gh api --method POST "/repos/${REPO}/actions/runs/${id}/cancel" >/dev/null 2>&1; then
                  echo "CANCEL requested successfully: ${workflow} run=${id}"
                else
                  echo "WARN: cancel request failed: ${workflow} run=${id}"
                fi
              fi
            done
          done

          echo "Stale-run janitor completed."
