            done < <(jq -r '.workflow_runs[]? | [.id,.status,.head_sha,.run_number] | @tsv' <<<"${response}")
          }

          for workflow in "${queue_pressure_research[@]}"; do
            cancel_queued_research "${workflow}"
          done

          # Collector generations are state-only cache infrastructure. Keep only the
