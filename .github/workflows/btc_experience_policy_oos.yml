name: BTC Experience Policy OOS Learning

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/experience_policy_oos.py'
      - 'src/experience_policy_unweighted_logistic_oos.py'
      - 'src/experience_policy_tail_calibrated_logistic_oos.py'
      - 'src/experience_policy_core_feature_logistic_oos.py'
      - 'src/experience_policy_stability_oos.py'
      - 'src/experience_policy_promotion_gate.py'
      - 'tests/test_experience_policy_core_feature_logistic_oos.py'
      - 'tests/test_experience_policy_tail_calibrated_logistic_oos.py'
      - 'tests/test_experience_policy_stability_oos.py'
      - 'tests/test_experience_policy_promotion_gate.py'
      - 'config/EXPERIENCE_POLICY_CORE_FEATURE_LOGISTIC_OOS.json'
      - 'config/EXPERIENCE_POLICY_TAIL_CALIBRATED_LOGISTIC_OOS.json'
      - 'config/EXPERIENCE_POLICY_STABILITY_OOS.json'
      - 'config/EXPERIENCE_POLICY_PROMOTION_GATE.json'
      - 'src/experience_ledger.py'
      - 'src/experience_case_adaptive_controller_oos.py'
      - 'tests/test_experience_case_adaptive_controller_oos.py'
      - 'src/experience_case_conditional_policy_oos.py'
      - 'tests/test_experience_case_conditional_policy_oos.py'
      - 'src/experience_failure_recurrence_oos.py'
      - 'tests/test_experience_failure_recurrence_oos.py'
      - 'tests/test_experience_policy_oos.py'
      - 'config/EXPERIENCE_POLICY_OOS.json'
      - 'config/EXPERIENCE_POLICY_UNWEIGHTED_LOGISTIC_OOS.json'
      - '.github/workflows/btc_experience_policy_oos.yml'

concurrency:
  group: btc-experience-policy-oos
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Fail closed if scheduled run is stale
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          test "${remote_sha}" = "${GITHUB_SHA}" || {
            echo "STALE_MAIN_RUN expected=${remote_sha} actual=${GITHUB_SHA}" >&2
            exit 1
          }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Restore settled prediction state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          from src.db import init_db
          restore_db(Path("data/predictions.db.gz"), Path("data/predictions.db"))
          init_db()
          PY

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Run experience ledger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/scripts" python src/experience_ledger.py
          test -s data/experience/experience_summary.json

      - name: Run prequential experience policy learning
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_policy_oos.py
          test -s data/historical_research/experience_policy_oos.json

      - name: Run unweighted experience logistic OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_policy_unweighted_logistic_oos.py
          test -s data/historical_research/experience_policy_unweighted_logistic_oos.json

      - name: Run core feature logistic OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_policy_core_feature_logistic_oos.py
          test -s data/historical_research/experience_policy_core_feature_logistic_oos.json

      - name: Validate core feature logistic evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_policy_core_feature_logistic_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("candidate") != "core_feature_unweighted_logistic":
              raise SystemExit("unexpected core-feature candidate")
          if obj.get("research_only") is not True or obj.get("production_changed") is not False:
              raise SystemExit("core-feature candidate must remain research-only")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("core-feature candidate cannot create promotion evidence")
          expected=set(obj.get("feature_policy", []))
          forbidden=set(obj.get("excluded_features", []))
          if expected & forbidden:
              raise SystemExit("feature policy overlaps exclusions")
          for h,item in obj.get("horizons",{}).items():
              if item.get("status") == "OK":
                  if item.get("model",{}).get("feature_profile") != "core_prediction_time":
                      raise SystemExit(f"{h}: unexpected feature profile")
                  if item.get("model",{}).get("trained_only_on_prior_settled_experiences") is not True:
                      raise SystemExit(f"{h}: prequential boundary missing")
          print("BTC core feature experience logistic OOS: VERIFIED")
          PY

      - name: Run temporal tail calibrated logistic OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_policy_tail_calibrated_logistic_oos.py
          test -s data/historical_research/experience_policy_tail_calibrated_logistic_oos.json

      - name: Validate temporal tail calibrated logistic evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_policy_tail_calibrated_logistic_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("candidate") != "temporal_tail_calibrated_unweighted_logistic":
              raise SystemExit("unexpected temporal calibration candidate")
          if obj.get("research_only") is not True:
              raise SystemExit("temporal calibrated candidate must remain research-only")
          if obj.get("production_changed") is not False:
              raise SystemExit("temporal calibrated candidate changed production state")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("temporal calibrated candidate cannot create promotion evidence")
          for h,item in obj.get("horizons",{}).items():
              if item.get("status") == "OK":
                  if item.get("model",{}).get("probability_calibration") != "temporal_tail_sigmoid":
                      raise SystemExit(f"{h}: unexpected calibration method")
                  if item.get("model",{}).get("trained_only_on_prior_settled_experiences") is not True:
                      raise SystemExit(f"{h}: prequential boundary missing")
          print("BTC temporal calibrated experience logistic OOS: VERIFIED")
          PY

      - name: Validate unweighted experience logistic evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_policy_unweighted_logistic_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("candidate") != "unweighted_logistic_regression":
              raise SystemExit("unexpected unweighted logistic candidate")
          if obj.get("research_only") is not True:
              raise SystemExit("unweighted logistic must remain research-only")
          if obj.get("production_changed") is not False:
              raise SystemExit("unweighted logistic changed production state")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("unweighted logistic cannot create promotion evidence")
          for h,item in obj.get("horizons",{}).items():
              if item.get("status") == "OK":
                  if item.get("model",{}).get("class_weight", "MISSING") is not None:
                      raise SystemExit(f"{h}: class_weight is not None")
                  if item.get("model",{}).get("trained_only_on_prior_settled_experiences") is not True:
                      raise SystemExit(f"{h}: prequential boundary missing")
          print("BTC unweighted experience logistic OOS: VERIFIED")
          PY

      - name: Run case-adaptive experience controller OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_case_adaptive_controller_oos.py
          test -s data/historical_research/experience_case_adaptive_controller_oos.json

      - name: Run failure recurrence OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_failure_recurrence_oos.py
          test -s data/historical_research/experience_failure_recurrence_oos.json

      - name: Verify failure recurrence safety and PIT boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_failure_recurrence_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("research_only") is not True or obj.get("production_changed") is not False:
              raise SystemExit("failure recurrence candidate must remain research-only")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("failure recurrence cannot create promotion evidence")
          for h,item in obj.get("horizons",{}).items():
              if item.get("status") == "OK" and int(item.get("pit_violation_count",0)) != 0:
                  raise SystemExit(f"{h}: PIT violation detected")
          print("BTC failure recurrence OOS boundary: VERIFIED")
          PY

      - name: Run case-conditional experience policy OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_case_conditional_policy_oos.py
          test -s data/historical_research/experience_case_conditional_policy_oos.json

      - name: Verify case-conditional policy safety and PIT boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_case_conditional_policy_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("research_only") is not True or obj.get("production_changed") is not False:
              raise SystemExit("case-conditional policy must remain research-only")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("case-conditional policy cannot create promotion evidence")
          for h,item in obj.get("horizons",{}).items():
              if item.get("status") == "OK":
                  if int(item.get("pit_violation_count",0)) != 0:
                      raise SystemExit(f"{h}: PIT violation detected")
                  delta=item.get("delta_selected_minus_baseline",{})
                  if not all(k in delta for k in ("accuracy","logloss","brier","ece")):
                      raise SystemExit(f"{h}: incomplete candidate metric set")
          print("BTC case-conditional policy boundary: VERIFIED")
          PY

      - name: Verify case-adaptive controller safety boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_case_adaptive_controller_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("research_only") is not True or obj.get("production_changed") is not False:
              raise SystemExit("case-adaptive controller must remain research-only")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("case-adaptive controller cannot create promotion evidence")
          for h,item in obj.get("horizons",{}).items():
              if item.get("status") == "OK" and int(item.get("pit_violation_count",0)) != 0:
                  raise SystemExit(f"{h}: PIT violation detected")
          print("BTC case-adaptive controller boundary: VERIFIED")
          PY

      - name: Run chronological stability OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_policy_stability_oos.py
          test -s data/historical_research/experience_policy_stability_oos.json

      - name: Run focused tests
        run: python -m pytest -q tests/test_experience_ledger.py tests/test_experience_case_adaptive_controller_oos.py tests/test_experience_case_conditional_policy_oos.py tests/test_experience_failure_recurrence_oos.py tests/test_experience_policy_oos.py tests/test_experience_policy_stability_oos.py tests/test_experience_policy_promotion_gate.py tests/test_experience_policy_tail_calibrated_logistic_oos.py tests/test_experience_policy_core_feature_logistic_oos.py

      - name: Validate experience stability evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_policy_stability_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("research_only") is not True or obj.get("production_changed") is not False:
              raise SystemExit("experience stability artifact must remain research-only")
          for h,item in obj.get("horizons",{}).items():
              if item.get("status") == "OK" and int(item.get("block_count",0)) < int(obj["config"]["min_blocks"]):
                  raise SystemExit(f"{h}: insufficient stability blocks")
          print("BTC experience stability OOS: VERIFIED")
          PY

      - name: Evaluate experience policy promotion gate
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_policy_promotion_gate.py
          test -s data/historical_research/experience_policy_promotion_gate.json

      - name: Verify promotion gate remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_policy_promotion_gate.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("research_only") is not True:
              raise SystemExit("experience promotion gate must remain research-only")
          if obj.get("production_changed") is not False:
              raise SystemExit("experience promotion gate changed production state")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("experience promotion gate cannot create production evidence")
          if obj.get("decision") not in {"HOLD","REJECTED","PROMOTION_CANDIDATE"}:
              raise SystemExit("invalid experience promotion decision")
          print(f"BTC experience promotion gate: {obj.get('decision')}")
          PY

      - name: Validate research-only and no-leakage contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/experience_policy_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if obj.get("research_only") is not True:
              raise SystemExit("experience policy must remain research-only")
          if obj.get("production_changed") is not False:
              raise SystemExit("experience policy changed production state")
          if obj.get("promotion_evidence_eligible") is not False:
              raise SystemExit("experience policy cannot bypass promotion gate")
          if "prior_settled_experiences" not in str(obj.get("learning_boundary","")):
              raise SystemExit("experience learning boundary missing")
          horizons=obj.get("horizons")
          if not isinstance(horizons,dict) or set(horizons) != {"5m","10m"}:
              raise SystemExit("experience policy horizons incomplete")
          for h,item in horizons.items():
              if item.get("status") == "OK":
                  if item.get("model",{}).get("trained_only_on_prior_settled_experiences") is not True:
                      raise SystemExit(f"{h}: prequential boundary missing")
          print("BTC experience policy OOS: VERIFIED")
          PY

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-experience-policy-oos-${{ github.run_id }}
          path: |
            data/experience/experience_summary.json
            data/historical_research/experience_policy_oos.json
            data/historical_research/experience_policy_stability_oos.json
            data/historical_research/experience_policy_unweighted_logistic_oos.json
            data/historical_research/experience_policy_tail_calibrated_logistic_oos.json
            data/historical_research/experience_policy_core_feature_logistic_oos.json
            data/historical_research/experience_policy_promotion_gate.json
            data/historical_research/experience_case_adaptive_controller_oos.json
            data/historical_research/experience_case_conditional_policy_oos.json
            data/historical_research/experience_failure_recurrence_oos.json
          if-no-files-found: error
          retention-days: 14
