name: BTC Unit Tests

on:
  # Direct pushes are validated only on main; PR branches use pull_request.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
  workflow_dispatch:


concurrency:
  # Use the source branch for both push and pull_request events, so one commit
  # cannot consume two identical full-suite runners at once.
  group: btc-unit-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Validate GitHub Actions YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |p| YAML.load_file(p, aliases: true); puts "YAML OK: #{p}" }'

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts
      - name: Validate current production artifact integrity and SHA provenance
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python src/production_artifact_audit.py | tee /tmp/production_artifact_audit.jsonl
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          audit_path = Path("data/historical_research/production_artifact_audit.json")
          if not audit_path.is_file():
              raise SystemExit("production artifact audit did not produce an evidence file")
          payload = json.loads(audit_path.read_text(encoding="utf-8"))
          provenance = payload.get("provenance") or {}
          expected = os.environ.get("GITHUB_SHA")
          if not expected:
              raise SystemExit("GITHUB_SHA missing in CI")
          if provenance.get("git_sha") != expected:
              raise SystemExit(
                  f"production artifact evidence SHA mismatch: "
                  f"expected={expected} actual={provenance.get('git_sha')}"
              )
          if provenance.get("workspace_sha") != expected:
              raise SystemExit(
                  f"production artifact workspace SHA mismatch: "
                  f"expected={expected} actual={provenance.get('workspace_sha')}"
              )
          artifacts = payload.get("artifacts") or []
          if {item.get("horizon") for item in artifacts} != {"5m", "10m"}:
              raise SystemExit("production artifact evidence missing a primary horizon")
          if any(item.get("runtime_model_reload_ok") is not True for item in artifacts):
              raise SystemExit("production artifact runtime reload contract failed")
          if any(item.get("runtime_classes") != ["DOWN", "FLAT", "UP"] for item in artifacts):
              raise SystemExit("production artifact class contract failed")
          if any(item.get("runtime_feature_count") != 15 for item in artifacts):
              raise SystemExit("production artifact feature-count contract failed")
          policy_files = provenance.get("policy_files") or {}
          required_policy_files = {
              "PROJECT_INSTRUCTIONS.md",
              "docs/PROJECT_SOURCE.md",
              "requirements.txt",
          }
          if set(policy_files) != required_policy_files:
              raise SystemExit("production artifact policy provenance is incomplete")
          if any(
              not isinstance(value, str) or len(value) != 64
              or any(ch not in "0123456789abcdef" for ch in value.lower())
              for value in policy_files.values()
          ):
              raise SystemExit("production artifact policy hash contract failed")
          print("production artifact integrity: VERIFIED")
          PY

      - name: Validate CI network retry helper
        run: bash -n scripts/ci_network_retry.sh
      - name: Run unit tests
        run: python -m pytest -q tests
