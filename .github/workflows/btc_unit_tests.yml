name: BTC Unit Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:


concurrency:
  # Use the source branch for both push and pull_request events, so one commit
  # cannot consume two identical full-suite runners at once.
  group: btc-unit-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Validate GitHub Actions YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |p| YAML.load_file(p, aliases: true); puts "YAML OK: #{p}" }'

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts
      - name: Run unit tests
        run: python -m pytest -q tests
