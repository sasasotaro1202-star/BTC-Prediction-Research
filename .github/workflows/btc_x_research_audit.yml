name: BTC X Research Audit

on:
  workflow_dispatch:

concurrency:
  group: btc-x-research-audit
  cancel-in-progress: true

concurrency:
  group: btc-aux-research-admission
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            sleep $((10 * attempt))
          done
          exit 1
      - name: Compile X research layer
        run: python -m compileall -q src tests
      - name: Run X contract tests
        run: python -m unittest tests.test_x_data_contract -v
      - name: Run X PIT audit when a dataset is supplied
        shell: bash
        run: |
          set -euo pipefail
          if [ -s data/x_research/posts.json ]; then
            python src/x_pit_audit.py
          else
            echo 'No X dataset supplied; contract tests passed and production remains untouched.'
          fi
