name: BTC Production Sentinel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - BTC Workflow Watchdog
      - BTC Unit Tests
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-production-sentinel
  cancel-in-progress: true

jobs:
  sentinel:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check production heartbeat
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          main_sha="$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"

          live_json="$(gh api "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/runs?branch=main&per_page=20")"
          active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"$live_json")"
          latest="$(jq -r '[.workflow_runs[]? | select(.status=="completed" and .conclusion=="success")] | sort_by(.updated_at) | last // empty | [.updated_at,.head_sha] | @tsv' <<<"$live_json")"

          updated="$(cut -f1 <<<"$latest")"
          head="$(cut -f2 <<<"$latest")"
          if [ -z "$updated" ]; then
            age=999999999
          else
            epoch="$(date -d "$updated" +%s)"
            age=$((now-epoch))
          fi

          echo "main_sha=$main_sha active_live=$active latest_live_head=${head:-none} age=${age}s"

          if [ "$active" -gt 0 ]; then
            echo "Live run already active; no dispatch."
            exit 0
          fi

          if [ "$age" -lt 300 ] && [ "$head" = "$main_sha" ]; then
            echo "Production heartbeat healthy."
            exit 0
          fi

          echo "Production heartbeat stale; dispatching one Live Cycle from current main."
          if ! gh api --method POST "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/dispatches" -f ref=main >/dev/null; then
            echo "ERROR: Live Cycle dispatch failed." >&2
            exit 1
          fi
          echo "Live Cycle recovery dispatch accepted."
