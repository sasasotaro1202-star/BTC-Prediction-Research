name: BTC Production Sentinel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_production_sentinel.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Only one sentinel generation should normally be active. A generation is
# intentionally short-lived and creates its successor before exiting.
concurrency:
  group: btc-production-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Enforce current-main execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"

      - name: Check and recover production heartbeat
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          retry_api() {
            local endpoint="$1"
            shift
            for attempt in 1 2 3; do
              if out="$(gh api "$endpoint" "$@" 2>/dev/null)"; then
                printf '%s\n' "$out"
                return 0
              fi
              echo "WARN: GitHub API request failed (attempt ${attempt}/3): ${endpoint}" >&2
              [ "$attempt" -lt 3 ] && sleep $((5 * attempt))
            done
            return 1
          }

          main_sha="$(retry_api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')" || {
            echo "ERROR: unable to read current main SHA after 3 attempts." >&2
            exit 1
          }

          live_json="$(retry_api "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/runs?branch=main&per_page=20")" || {
            echo "ERROR: unable to read Live workflow runs after 3 attempts." >&2
            exit 1
          }
          active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"$live_json")"

          # Recover only clearly stale live runs: an active run older than 12 minutes
          # and running an older main SHA. This avoids cancelling normal short cycles
          # while preventing an obsolete/hung generation from blocking current main.
          stale_ids="$(jq -r --arg main_sha "$main_sha" --argjson now "$now" '
            .workflow_runs[]?
            | select(.status=="queued" or .status=="pending" or .status=="in_progress")
            | select(.head_sha != $main_sha)
            | select((($now - ((.run_started_at // .created_at) | fromdateiso8601)) >= 720))
            | .id
          ' <<<"$live_json")"
          if [ -n "$stale_ids" ]; then
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              echo "Stale obsolete Live Cycle detected; cancelling run_id=$run_id."
              if gh run cancel "$run_id" --repo "$REPO"; then
                echo "Cancelled stale obsolete Live Cycle run_id=$run_id."
              else
                echo "ERROR: failed to cancel stale obsolete Live Cycle run_id=$run_id." >&2
                exit 1
              fi
            done <<<"$stale_ids"
            sleep 5
            live_json="$(retry_api "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/runs?branch=main&per_page=20")" || {
              echo "ERROR: unable to refresh Live workflow runs after stale-run cancellation." >&2
              exit 1
            }
            active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"$live_json")"
          fi

          latest="$(jq -r '[.workflow_runs[]? | select(.status=="completed" and .conclusion=="success")] | sort_by(.updated_at) | last // empty | [.updated_at,.head_sha] | @tsv' <<<"$live_json")"

          updated="$(cut -f1 <<<"$latest")"
          head="$(cut -f2 <<<"$latest")"
          if [ -z "$updated" ]; then
            age=999999999
          else
            epoch="$(date -d "$updated" +%s)"
            age=$((now-epoch))
          fi

          # A successful Live Cycle can still be a safe DEFERRED run when critical
          # market data was unavailable. Treating that run as a healthy heartbeat
          # creates a recovery blind spot: the next sentinel waits until the normal
          # heartbeat timeout even after the Binance cache has recovered. Check the
          # durable cycle status plus the dedicated kline cache before deciding.
          live_status_json=""
          if live_status_raw="$(retry_api "/repos/${REPO}/contents/data/live_cycle_status.json?ref=main")"; then
            live_status_b64="$(jq -r ".content // empty" <<<"$live_status_raw")"
            if [ -n "$live_status_b64" ]; then
              if decoded_status="$(printf "%s" "$live_status_b64" | base64 -d 2>/dev/null)"; then
                live_status_json="$decoded_status"
              else
                echo "WARN: live_cycle_status.json base64 decoding failed; deferred-cache recovery disabled for this generation." >&2
              fi
            fi
          else
            echo "WARN: live_cycle_status.json could not be read; deferred-cache recovery disabled for this generation." >&2
          fi
          cycle_mode=""
          if [ -n "$live_status_json" ]; then
            if cycle_mode="$(jq -r ".mode // empty" <<<"$live_status_json" 2>/dev/null)"; then
              :
            else
              cycle_mode=""
              echo "WARN: live_cycle_status.json JSON parsing failed; deferred-cache recovery disabled for this generation." >&2
            fi
          fi

          cache_fresh=0
          cache_event_ms=0
          if cache_raw="$(retry_api "/repos/${REPO}/contents/data/binance_ws_1m.json?ref=binance-ws-cache")"; then
            cache_b64="$(jq -r ".content // empty" <<<"$cache_raw")"
            cache_json=""
            if [ -n "$cache_b64" ]; then
              if decoded_cache="$(printf "%s" "$cache_b64" | base64 -d 2>/dev/null)"; then
                cache_json="$decoded_cache"
              else
                echo "WARN: dedicated Binance kline cache base64 decoding failed; deferred-cache recovery disabled for this generation." >&2
              fi
            fi
            cache_event_ms="$(jq -r ".rows[-1].event_time_ms // 0" <<<"$cache_json" 2>/dev/null || echo 0)"
            cache_retrieved_ms="$(jq -r ".rows[-1].retrieved_at_ms // 0" <<<"$cache_json" 2>/dev/null || echo 0)"
            if [[ "$cache_event_ms" =~ ^[0-9]+$ ]] && [[ "$cache_retrieved_ms" =~ ^[0-9]+$ ]] && [ "$cache_event_ms" -gt 0 ] && [ "$cache_retrieved_ms" -ge "$cache_event_ms" ]; then
              cache_age_ms=$((now*1000-cache_event_ms))
              if [ "$cache_age_ms" -ge 0 ] && [ "$cache_age_ms" -le 180000 ]; then
                cache_fresh=1
              fi
            fi
          else
            echo "WARN: dedicated Binance kline cache could not be read; deferred-cache recovery disabled for this generation." >&2
          fi

          deferred_cache_recovery=0
          deferred_completed_ms=0
          if [ "$cycle_mode" = "deferred" ] && [ -n "$live_status_json" ]; then
            deferred_completed_utc="$(jq -r ".completed_at_utc // empty" <<<"$live_status_json" 2>/dev/null || echo "")"
            if [ -n "$deferred_completed_utc" ]; then
              if deferred_completed_epoch="$(date -d "$deferred_completed_utc" +%s 2>/dev/null)"; then
                deferred_completed_ms=$((deferred_completed_epoch*1000))
              fi
            fi
          fi
          # Recover only when a verified fresh kline checkpoint arrived after the
          # deferred cycle completed. This prevents an unavailable secondary input
          # from causing an indefinite 5-minute dispatch/defer loop.
          if [ "$cycle_mode" = "deferred" ] && [ "$cache_fresh" -eq 1 ] && [ "$deferred_completed_ms" -gt 0 ] && [ "$cache_event_ms" -gt "$deferred_completed_ms" ]; then
            deferred_cache_recovery=1
          fi

          echo "main_sha=$main_sha active_live=$active latest_live_head=${head:-none} age=${age}s cycle_mode=${cycle_mode:-unknown} cache_fresh=$cache_fresh cache_event_ms=$cache_event_ms deferred_completed_ms=$deferred_completed_ms"

          if [ "$active" -eq 0 ] && { [ "$age" -ge 300 ] || [ "$head" != "$main_sha" ] || [ "$deferred_cache_recovery" -eq 1 ]; }; then
            if [ "$deferred_cache_recovery" -eq 1 ]; then
              echo "Deferred Live Cycle detected with a fresh Binance kline cache; dispatching immediate recovery from current main."
            else
              echo "Production heartbeat stale; dispatching one Live Cycle from current main."
            fi
            if gh api --method POST "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/dispatches" -f ref=main >/dev/null 2>&1; then
              echo "Live Cycle recovery dispatch accepted."
            else
              echo "ERROR: Live Cycle recovery dispatch failed." >&2
              exit 1
            fi
          else
            echo "Production heartbeat healthy, recovery conditions not met, or Live Cycle already active."
          fi

      - name: Spawn next sentinel generation
        shell: bash
        run: |
          set -euo pipefail
          echo "Sleeping briefly before spawning next sentinel generation."
          sleep 240
          if gh api --method POST "/repos/${REPO}/actions/workflows/btc_production_sentinel.yml/dispatches" -f ref=main >/dev/null; then
            echo "Next sentinel generation dispatch accepted."
          else
            echo "ERROR: next sentinel generation dispatch failed." >&2
            exit 1
          fi
