name: BTC Production Sentinel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_production_sentinel.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Only one sentinel generation should normally be active. A generation is
# intentionally short-lived and creates its successor before exiting.
concurrency:
  group: btc-production-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CI_GH_ATTEMPTS: '3'
      CI_GH_TIMEOUT_SECONDS: '30'
      CI_GH_BACKOFF_SECONDS: '5'
    steps:
      - uses: actions/checkout@v7
      - name: Enforce current-main execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"

      - name: Check and recover production heartbeat
        shell: bash
        run: |
          set -euo pipefail
          . scripts/ci_network_retry.sh
          now="$(date -u +%s)"

          main_sha="$(ci_gh_api_get "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha')" || {
            echo "ERROR: unable to read current main SHA after 3 attempts." >&2
            exit 1
          }

          live_json="$(ci_gh_api_get "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/runs?branch=main&per_page=20")" || {
            echo "ERROR: unable to read Live workflow runs after 3 attempts." >&2
            exit 1
          }
          active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"$live_json")"

          # Recover only clearly stale live runs: an active run older than 12 minutes
          # and running an older main SHA. This avoids cancelling normal short cycles
          # while preventing an obsolete/hung generation from blocking current main.
          stale_ids="$(jq -r --arg main_sha "$main_sha" --argjson now "$now" '
            .workflow_runs[]?
            | select(.status=="queued" or .status=="pending" or .status=="in_progress")
            | select(.head_sha != $main_sha)
            | select((($now - ((.run_started_at // .created_at) | fromdateiso8601)) >= 720))
            | .id
          ' <<<"$live_json")"
          if [ -n "$stale_ids" ]; then
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              echo "Stale obsolete Live Cycle detected; cancelling run_id=$run_id."
              cancel_ok=false
              for attempt in 1 2 3; do
                if ci_gh run cancel "$run_id" --repo "$REPO"; then
                  cancel_ok=true
                  break
                fi
                echo "WARN: stale Live Cycle cancellation failed (attempt $attempt/3): run_id=$run_id" >&2
                [ "$attempt" -lt 3 ] && sleep $((5 * attempt))
              done
              if [ "$cancel_ok" = true ]; then
                echo "Cancelled stale obsolete Live Cycle run_id=$run_id."
              else
                echo "ERROR: failed to cancel stale obsolete Live Cycle run_id=$run_id." >&2
                exit 1
              fi
            done <<<"$stale_ids"
            sleep 5
            live_json="$(ci_gh_api_get "/repos/${REPO}/actions/workflows/btc_live_cycle.yml/runs?branch=main&per_page=20")" || {
              echo "ERROR: unable to refresh Live workflow runs after stale-run cancellation." >&2
              exit 1
            }
            active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"$live_json")"
          fi

          latest="$(jq -r '[.workflow_runs[]? | select(.status=="completed" and .conclusion=="success")] | sort_by(.updated_at) | last // empty | [.updated_at,.head_sha] | @tsv' <<<"$live_json")"

          updated="$(cut -f1 <<<"$latest")"
          head="$(cut -f2 <<<"$latest")"
          if [ -z "$updated" ]; then
            age=999999999
          else
            epoch="$(date -d "$updated" +%s)"
            age=$((now-epoch))
          fi

          # A completed Live Cycle can safely enter DEFERRED when critical market data is unavailable.
          # Treat that as a recovery state rather than a healthy prediction heartbeat. Recovery
          # is allowed only when the dedicated Binance WS cache contains a verified fresh event
          # that arrived after the deferred cycle completed.
          cycle_mode=""
          deferred_completed_ms=0
          cache_fresh=0
          cache_event_ms=0
          live_status_json=""

          if live_status_raw="$(ci_gh_api_get "/repos/$REPO/contents/data/live_cycle_status.json?ref=main")"; then
            live_status_b64="$(jq -r ".content // empty" <<<"$live_status_raw")"
            if [ -n "$live_status_b64" ]; then
              if decoded_status="$(printf "%s" "$live_status_b64" | base64 -d 2>/dev/null)"; then
                live_status_json="$decoded_status"
              else
                echo "WARN: live_cycle_status.json base64 decoding failed; deferred-cache recovery disabled." >&2
              fi
            fi
          else
            echo "WARN: live_cycle_status.json could not be read; deferred-cache recovery disabled." >&2
          fi

          if [ -n "$live_status_json" ]; then
            if cycle_mode="$(jq -r ".mode // empty" <<<"$live_status_json" 2>/dev/null)"; then
              :
            else
              cycle_mode=""
              echo "WARN: live_cycle_status.json JSON parsing failed; deferred-cache recovery disabled." >&2
            fi
            if [ "$cycle_mode" = "deferred" ]; then
              deferred_completed_utc="$(jq -r ".completed_at_utc // empty" <<<"$live_status_json" 2>/dev/null)"
              if [ -n "$deferred_completed_utc" ]; then
                if deferred_completed_epoch="$(date -d "$deferred_completed_utc" +%s 2>/dev/null)"; then
                  deferred_completed_ms=$((deferred_completed_epoch*1000))
                fi
              fi
            fi
          fi

          if [ "$cycle_mode" = "deferred" ] && [ "$deferred_completed_ms" -gt 0 ]; then
            cache_raw=""
            if cache_raw="$(ci_gh_api_get "/repos/$REPO/contents/data/binance_ws_1m.json?ref=binance-ws-cache")"; then
              cache_b64="$(jq -r ".content // empty" <<<"$cache_raw")"
              cache_json=""
              if [ -n "$cache_b64" ]; then
                if decoded_cache="$(printf "%s" "$cache_b64" | base64 -d 2>/dev/null)"; then
                  cache_json="$decoded_cache"
                else
                  echo "WARN: Binance WS cache base64 decoding failed; deferred-cache recovery disabled." >&2
                fi
              fi
              if [ -n "$cache_json" ] && [ "$(jq -r ".schema_version // 0" <<<"$cache_json" 2>/dev/null)" = "1" ] && [ "$(jq -r ".source // empty" <<<"$cache_json" 2>/dev/null)" = "Binance USD-M Futures WebSocket" ] && [ "$(jq -r ".stream // empty" <<<"$cache_json" 2>/dev/null)" = "btcusdt@kline_1m" ]; then
                cache_event_ms="$(jq -r ".rows[-1].event_time_ms // 0" <<<"$cache_json" 2>/dev/null)"
                cache_retrieved_ms="$(jq -r ".rows[-1].retrieved_at_ms // 0" <<<"$cache_json" 2>/dev/null)"
                if [[ "$cache_event_ms" =~ ^[0-9]+$ ]] && [[ "$cache_retrieved_ms" =~ ^[0-9]+$ ]] && [ "$cache_event_ms" -gt 0 ] && [ "$cache_retrieved_ms" -ge "$cache_event_ms" ]; then
                  cache_age_ms=$((now*1000-cache_event_ms))
                  if [ "$cache_age_ms" -ge 0 ] && [ "$cache_age_ms" -le 180000 ] && [ "$cache_event_ms" -gt "$deferred_completed_ms" ]; then
                    cache_fresh=1
                  fi
                fi
              fi
            else
              echo "WARN: Binance WS cache could not be read; deferred-cache recovery disabled." >&2
            fi
          fi

          deferred_cache_recovery=0
          if [ "$cycle_mode" = "deferred" ] && [ "$deferred_completed_ms" -gt 0 ] && [ "$cache_fresh" -eq 1 ]; then
            deferred_cache_recovery=1
          fi

          echo "deferred_recovery cycle_mode=${cycle_mode:-unknown} cache_fresh=$cache_fresh cache_event_ms=$cache_event_ms deferred_completed_ms=$deferred_completed_ms"
          echo "main_sha=$main_sha active_live=$active latest_live_head=${head:-none} age=${age}s"

          if [ "$active" -eq 0 ] && { [ "$age" -ge 300 ] || [ "$head" != "$main_sha" ] || [ "$deferred_cache_recovery" -eq 1 ]; }; then
            if [ "$deferred_cache_recovery" -eq 1 ]; then
              echo "Deferred Live Cycle recovered by a fresh post-defer Binance kline event; dispatching from current main."
            else
              echo "Production heartbeat stale; dispatching one Live Cycle from current main."
            fi
            if ci_gh_api_get "/repos/$REPO/actions/workflows/btc_live_cycle.yml/dispatches" --method POST -f ref=main >/dev/null 2>&1; then
              echo "Live Cycle recovery dispatch accepted."
            else
              echo "ERROR: Live Cycle recovery dispatch failed." >&2
              exit 1
            fi
          else
            echo "Production heartbeat healthy, deferred recovery conditions not met, or Live Cycle already active."
          fi

      - name: Spawn next sentinel generation
        shell: bash
        run: |
          set -euo pipefail
          . scripts/ci_network_retry.sh
          echo "Sleeping briefly before spawning next sentinel generation."
          sleep 240
          if ci_gh_api_get "/repos/$REPO/actions/workflows/btc_production_sentinel.yml/dispatches" --method POST -f ref=main >/dev/null; then
            echo "Next sentinel generation dispatch accepted."
          else
            echo "ERROR: next sentinel generation dispatch failed." >&2
            exit 1
          fi
