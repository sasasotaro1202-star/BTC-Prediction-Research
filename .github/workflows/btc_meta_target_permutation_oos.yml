name: BTC Meta Target Permutation OOS

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'src/experience_meta_target_permutation_oos.py'
      - 'src/experience_case_adaptive_controller_oos.py'
      - 'src/experience_pit_scope.py'
      - 'tests/test_experience_meta_target_permutation_oos.py'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: btc-meta-target-permutation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore settled prediction state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          from src.db import init_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          init_db()
          PY
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build experience ledger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH='${{ github.workspace }}/src:${{ github.workspace }}/scripts' python src/experience_ledger.py
          test -s data/experience/experience_summary.json
      - name: Run target permutation audit
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_meta_target_permutation_oos.py
          test -s data/historical_research/experience_meta_target_permutation_oos.json
      - name: Verify adversarial audit safety contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/historical_research/experience_meta_target_permutation_oos.json').read_text(encoding='utf-8'))
          if obj.get('research_only') is not True or obj.get('production_changed') is not False:
              raise SystemExit('target permutation audit must remain research-only')
          if obj.get('promotion_evidence_eligible') is not False:
              raise SystemExit('target permutation audit cannot create promotion evidence')
          if obj.get('strict_pit_scope') is not True:
              raise SystemExit('target permutation audit must use strict PIT scope')
          for h,item in obj.get('horizons',{}).items():
              if item.get('status') in {'SEPARATED','SUSPICIOUS','NO_SEPARATION'}:
                  pit=item.get('pit') or {}
                  for key in ('train_created_strictly_before_validation','train_settled_strictly_before_validation','validation_outcomes_used_only_after_model_fitted'):
                      if pit.get(key) is not True:
                          raise SystemExit(f'{h}: PIT contract failure: {key}')
                  if int((item.get('null_summary') or {}).get('permutations',0)) < 3:
                      raise SystemExit(f'{h}: insufficient null permutations')
          print('BTC meta target-permutation adversarial boundary: VERIFIED')
          PY
      - name: Run adversarial regression tests
        run: python -m pytest -q tests/test_experience_meta_target_permutation_oos.py
      - name: Upload adversarial audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-meta-target-permutation-oos-${{ github.run_id }}
          path: |
            data/experience/experience_summary.json
            data/historical_research/experience_meta_target_permutation_oos.json
          retention-days: 14
