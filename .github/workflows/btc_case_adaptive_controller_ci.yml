name: BTC Case Adaptive Controller CI

on:
  pull_request:
    paths:
      - "src/experience_case_adaptive_controller_oos.py"
      - "tests/test_experience_case_adaptive_controller_oos.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run controller tests
        run: python -m pytest -q tests/test_experience_case_adaptive_controller_oos.py
