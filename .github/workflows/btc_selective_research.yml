name: BTC Nested Selective Research

on:
  schedule:
    - cron: '13 */4 * * *'
  pull_request:
    paths:
      - 'src/selective_nested_oos.py'
      - 'tests/test_selective_nested_oos.py'
      - 'tests/test_adaptive_ensemble_oos.py'
      - '.github/workflows/btc_selective_research.yml'
  workflow_dispatch:

concurrency:
  group: btc-selective-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selective:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install selective-lane dependencies
        run: |
          set -euo pipefail
          python -m pip install --retries 5 --timeout 60             "numpy>=2.0,<3"             "scikit-learn>=1.5,<2"             "joblib>=1.4,<2"
      - name: Restore prediction state
        run: |
          set -euo pipefail
          if [ -s data/predictions.db.gz ]; then
            python -c "from pathlib import Path; from src.state_archive import restore_db; restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db')); print('Restored predictions.db from compressed repository state.')"
          elif [ -s data/predictions.db ]; then
            echo 'Using existing uncompressed predictions.db'
          else
            echo 'prediction state archive/database is missing'
            exit 1
          fi
          test -s data/predictions.db
      - name: Compile and run nested selective OOS
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          python -m unittest -q tests/test_selective_nested_oos.py tests/test_adaptive_ensemble_oos.py
          python src/selective_nested_oos.py
          test -s data/historical_research/selective_nested_oos.json
      - name: Upload selective evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-selective-nested-oos
          path: data/historical_research/selective_nested_oos.json
          retention-days: 3

# Research lane normalization fix verified in code path.
