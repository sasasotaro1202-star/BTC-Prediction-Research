on:
  # Full integrity is intentionally hourly. BTC Live Cycle already performs
  # per-cycle production-critical validation; a per-live trigger every five
  # minutes would repeatedly cancel this longer audit and reduce coverage.
  schedule:
    - cron: '23 * * * *'
  # Run immediately after code/protocol changes as a read-only verification.
  # Routine data/state commits do not trigger this expensive integrity audit.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/btc_integrity.yml'
  workflow_dispatch:

concurrency:
  group: btc-integrity-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # Code pushes validate repository/model integrity without being blocked by an
  # intentionally stale prediction state. Manual integrity runs prove freshness.
  BTC_INTEGRITY_REQUIRE_FRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
  BTC_INTEGRITY_MAX_PREDICTION_AGE_SECONDS: '900'

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            echo "pip install attempt ${attempt} failed"
            sleep $((10 * attempt))
          done
          exit 1
      - name: Restore BTC state archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s data/predictions.db ]]; then
            echo "Using existing uncompressed prediction state"
            exit 0
          fi
          if [[ -s data/predictions.db.gz ]]; then
            python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          archive = Path('data/predictions.db.gz')
          target = Path('data/predictions.db')
          restore_db(archive, target)
          if not target.exists() or target.stat().st_size == 0:
              raise SystemExit('restored prediction database is missing or empty')
          print(f'Restored BTC state: {target.stat().st_size} bytes')
          PY
            exit 0
          fi
          echo 'No BTC prediction state found (predictions.db or predictions.db.gz)' >&2
          exit 1
      - name: Compile all BTC code
        run: python -m compileall -q src tests
      - name: Run all BTC tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run production integrity gate
        run: |
          mkdir -p data/historical_research
          python src/production_integrity.py > data/historical_research/production_integrity.json
      - name: Run strict research input audit
        run: python src/research_input_audit.py

      - name: Run research-only regime robustness diagnostics
        run: python src/robustness_oos.py
      - name: Validate research-only robustness artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/robustness_oos_report.json')
          if not p.exists(): raise SystemExit('robustness report missing')
          obj=json.loads(p.read_text())
          if obj.get('research_only') is not True: raise SystemExit('robustness report is not research-only')
          if obj.get('policy') != 'diagnostic_only_no_model_input_no_promotion_effect': raise SystemExit('robustness policy mismatch')
          if set(obj.get('horizons',{})) != {'5m','10m'}: raise SystemExit('5m/10m robustness results missing')
          print('research-only regime robustness artifact: OK')
          PY
      - name: Evaluate research-only context model router
        run: python src/context_router_oos.py
      - name: Validate research-only context router artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/context_router_oos.json')
          if not p.exists(): raise SystemExit('context router OOS report missing')
          obj=json.loads(p.read_text())
          if obj.get('research_only') is not True: raise SystemExit('context router is not research-only')
          if obj.get('production_changed') is not False: raise SystemExit('context router changed production state')
          if obj.get('policy') != 'diagnostic_only_no_model_input_no_promotion_effect': raise SystemExit('context router policy mismatch')
          if set(obj.get('horizons',{})) != {'5m','10m'}: raise SystemExit('context router 5m/10m results missing')
          for h, report in obj['horizons'].items():
              if report.get('status') == 'OK' and report.get('final_holdout_protected') is not True:
                  raise SystemExit(f'{h}: final holdout is not protected')
          print('research-only context router OOS artifact: OK')
          PY
      - name: Run strict PIT/OOS audit
        if: success()
        run: python src/pit_oos_audit.py

      - name: Validate strict PIT/OOS artifact
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/historical_research/pit_oos_audit.json')
          if not p.is_file():
              raise SystemExit('strict PIT/OOS artifact missing')
          obj = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(obj, dict):
              raise SystemExit('strict PIT/OOS artifact malformed')
          if not isinstance(obj.get('pit_verified'), bool):
              raise SystemExit('strict PIT/OOS artifact missing pit_verified')
          if int(obj.get('violation_count', 1)) < 0:
              raise SystemExit('strict PIT/OOS violation_count invalid')
          if int(obj.get('verified_primary_predictions', 0)) < 0:
              raise SystemExit('strict PIT/OOS verified_primary_predictions invalid')
          print(json.dumps({
              'status': obj.get('status'),
              'pit_verified': obj.get('pit_verified'),
              'verified_primary_predictions': obj.get('verified_primary_predictions'),
              'legacy_unverified_count': obj.get('legacy_unverified_count'),
              'violation_count': obj.get('violation_count'),
          }, sort_keys=True))
          PY

      - name: Evaluate final promotion safety gate
        run: |
          set -euo pipefail
          python src/promotion_gate.py

      - name: Validate final promotion safety gate evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/promotion_gate.json')
          if not p.is_file():
              raise SystemExit('promotion gate artifact missing')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('research_only') is not True:
              raise SystemExit('promotion gate must remain research-only')
          if obj.get('final_holdout_protected') is not True:
              raise SystemExit('promotion gate must protect final holdout')
          if obj.get('production_safety_gate') not in {'PASS','HOLD'}:
              raise SystemExit('unexpected production safety gate status')
          if obj.get('promotion_status') not in {'ELIGIBLE_PENDING_EXPLICIT_PROMOTION','HOLD'}:
              raise SystemExit('unexpected promotion status')
          if not isinstance(obj.get('promotion_allowed'), bool):
              raise SystemExit('promotion_allowed must be boolean')
          if obj.get('production_safety_gate') == 'HOLD' and obj.get('promotion_allowed') is not False:
              raise SystemExit('promotion must remain blocked when safety gate is HOLD')
          print('final promotion safety gate evidence: VERIFIED')
          print(json.dumps(obj, indent=2, sort_keys=True))

      - name: Upload final integrity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-final-integrity-evidence
          path: |
            data/historical_research/production_integrity.json
            data/historical_research/robustness_oos_report.json
            data/historical_research/context_router_oos.json
            data/historical_research/pit_oos_audit.json
            data/historical_research/promotion_gate.json
            data/historical_research/research_input_audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Validate Git diff
        run: git diff --check
