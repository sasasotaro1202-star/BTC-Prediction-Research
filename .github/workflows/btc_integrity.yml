name: BTC Integrity Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: btc-integrity-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  integrity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            sleep $((10 * attempt))
          done
          exit 1
      - name: Compile all BTC code
        run: python -m compileall -q src tests
      - name: Run all BTC tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run strict production integrity gate
        run: python src/production_integrity.py
      - name: Validate Git diff
        run: git diff --check
