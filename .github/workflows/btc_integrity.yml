name: BTC Integrity Gate

on:
  workflow_run:
    workflows: ["BTC Live Cycle"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: btc-integrity-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  BTC_EXPECTED_LIVE_RUN_ID: ${{ github.event.workflow_run.id || '0' }}
  BTC_EXPECTED_LIVE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # Code pushes validate repository/model integrity without being blocked by an
  # intentionally stale prediction state. Manual integrity runs prove freshness.
  BTC_INTEGRITY_REQUIRE_FRESH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
  BTC_INTEGRITY_MAX_PREDICTION_AGE_SECONDS: '900'

jobs:
  integrity:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            echo "pip install attempt ${attempt} failed"
            sleep $((10 * attempt))
          done
          exit 1
      - name: Restore BTC state archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s data/predictions.db ]]; then
            echo "Using existing uncompressed prediction state"
            exit 0
          fi
          if [[ -s data/predictions.db.gz ]]; then
            python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          archive = Path('data/predictions.db.gz')
          target = Path('data/predictions.db')
          restore_db(archive, target)
          if not target.exists() or target.stat().st_size == 0:
              raise SystemExit('restored prediction database is missing or empty')
          print(f'Restored BTC state: {target.stat().st_size} bytes')
          PY
            exit 0
          fi
          echo 'No BTC prediction state found (predictions.db or predictions.db.gz)' >&2
          exit 1
      - name: Compile all BTC code
        run: python -m compileall -q src tests
      - name: Run all BTC tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch immutable upstream BTC cycle artifact
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/btc_upstream_artifact
          mkdir -p /tmp/btc_upstream_artifact
          gh run download "${{ github.event.workflow_run.id }}"             --repo "${{ github.repository }}"             --name btc-predictions-db             --dir /tmp/btc_upstream_artifact

      - name: Validate upstream BTC live cycle outcome
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path('/tmp/btc_upstream_artifact/data/live_cycle_status.json')
          if not p.exists():
              matches = list(Path('/tmp/btc_upstream_artifact').rglob('live_cycle_status.json'))
              if matches:
                  p = matches[0]
              else:
                  raise SystemExit('BTC upstream cycle status artifact is missing')
          obj = json.loads(p.read_text(encoding='utf-8'))
          if obj.get('schema_version') != 1:
              raise SystemExit('BTC live cycle status schema mismatch')
          if obj.get('workflow_run_id') != int(os.environ['BTC_EXPECTED_LIVE_RUN_ID']):
              raise SystemExit('BTC live cycle status does not belong to the completed upstream live run')
          expected_sha = os.environ['BTC_EXPECTED_LIVE_SHA']
          if expected_sha and obj.get('head_sha') != expected_sha:
              raise SystemExit('BTC live cycle status head SHA does not match the completed upstream live run')
          if obj.get('mode') not in {'prediction_created', 'deferred'}:
              raise SystemExit('BTC live cycle status mode invalid')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('BTC_UPSTREAM_DEFERRED=' + ('1' if obj['mode'] == 'deferred' else '0') + '\n')
          print(json.dumps(obj, sort_keys=True))
          PY

      - name: Run production integrity gate
        if: github.event_name == 'workflow_dispatch' || env.BTC_UPSTREAM_DEFERRED != '1'
        run: |
          mkdir -p data/historical_research
          python src/production_integrity.py > data/historical_research/production_integrity.json

      - name: Confirm safe deferred BTC cycle
        if: github.event_name == 'workflow_run' && env.BTC_UPSTREAM_DEFERRED == '1'
        run: |
          echo "BTC upstream live cycle was explicitly deferred after fail-closed critical-data validation; no fresh prediction was expected or fabricated."
      - name: Run strict research input audit
        run: python src/research_input_audit.py

      - name: Run research-only regime robustness diagnostics
        run: python src/robustness_oos.py
      - name: Validate research-only robustness artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/robustness_oos_report.json')
          if not p.exists(): raise SystemExit('robustness report missing')
          obj=json.loads(p.read_text())
          if obj.get('research_only') is not True: raise SystemExit('robustness report is not research-only')
          if obj.get('policy') != 'diagnostic_only_no_model_input_no_promotion_effect': raise SystemExit('robustness policy mismatch')
          if set(obj.get('horizons',{})) != {'5m','10m'}: raise SystemExit('5m/10m robustness results missing')
          print('research-only regime robustness artifact: OK')
          PY
      - name: Evaluate research-only context model router
        run: python src/context_router_oos.py
      - name: Validate research-only context router artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/context_router_oos.json')
          if not p.exists(): raise SystemExit('context router OOS report missing')
          obj=json.loads(p.read_text())
          if obj.get('research_only') is not True: raise SystemExit('context router is not research-only')
          if obj.get('production_changed') is not False: raise SystemExit('context router changed production state')
          if obj.get('policy') != 'diagnostic_only_no_model_input_no_promotion_effect': raise SystemExit('context router policy mismatch')
          if set(obj.get('horizons',{})) != {'5m','10m'}: raise SystemExit('context router 5m/10m results missing')
          for h, report in obj['horizons'].items():
              if report.get('status') == 'OK' and report.get('final_holdout_protected') is not True:
                  raise SystemExit(f'{h}: final holdout is not protected')
          print('research-only context router OOS artifact: OK')
          PY
      - name: Evaluate final promotion safety gate
        if: success() && env.BTC_UPSTREAM_DEFERRED != '1'
        run: |
          python src/promotion_gate.py

      - name: Record safe deferred promotion gate
        if: env.BTC_UPSTREAM_DEFERRED == '1'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/historical_research')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'production_integrity.json').write_text(json.dumps({
              'status': 'SKIPPED_DEFERRED',
              'reason': 'upstream live cycle was explicitly deferred by fail-closed input validation'
          }, indent=2))
          (root / 'promotion_gate.json').write_text(json.dumps({
              'schema_version': 1,
              'research_only': True,
              'final_holdout_protected': True,
              'production_safety_gate': 'HOLD',
              'promotion_allowed': False,
              'promotion_status': 'HOLD',
              'reason': 'upstream_live_cycle_deferred',
              'policy': 'no_production_change_without_explicit_all_horizon_candidate_acceptance_and_safety_evidence',
          }, indent=2, sort_keys=True))
          PY

      - name: Upload final integrity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-final-integrity-evidence
          path: |
            data/historical_research/production_integrity.json
            data/historical_research/robustness_oos_report.json
            data/historical_research/context_router_oos.json
            data/historical_research/promotion_gate.json
            data/historical_research/research_input_audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Validate Git diff
        run: git diff --check
