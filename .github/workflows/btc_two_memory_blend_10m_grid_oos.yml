name: BTC Two-Memory EWMA ETA Grid 10m OOS

on:
  pull_request:
    paths:
      - 'src/two_memory_blend_10m_grid_oos.py'
      - 'tests/test_two_memory_blend_10m_grid_oos.py'
      - 'src/bootstrap_train.py'
      - 'src/binance_history.py'
      - 'src/feature_schema.py'
      - 'src/label_policy.py'
      - 'models/10m.joblib'
      - 'models/10m.json'
      - '.github/workflows/btc_two_memory_blend_10m_grid_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-two-memory-grid-10m-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_two_memory_blend_10m_grid_oos.py
      - name: Run nested chronological OOS
        run: |
          set -euo pipefail
          python src/two_memory_blend_10m_grid_oos.py
          test -s data/historical_research/two_memory_blend_10m_grid_oos.json
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/two_memory_blend_10m_grid_oos.json')
          o=json.loads(p.read_text(encoding='utf-8'))
          assert o['research_only'] is True
          assert o['production_changed'] is False
          assert o['promotion_evidence_eligible'] is False
          h=o['horizons']['10m']
          assert h['final_blind']['protected'] is True
          assert h['final_blind']['used_for_selection'] is False
          assert h['eta_selection']['selected_from'] == 'development_oos_only'
          print('two-memory eta-grid evidence contract verified')
          PY
      - name: Upload evidence
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-two-memory-eta-grid-10m-oos
          path: data/historical_research/two_memory_blend_10m_grid_oos.json
          if-no-files-found: error
          retention-days: 7
