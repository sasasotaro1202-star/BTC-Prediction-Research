name: BTC Rolling Window Grid 10m OOS

on:
  pull_request:
    paths:
      - 'src/rolling_window_grid_10m_oos.py'
      - 'tests/test_rolling_window_grid_10m_oos.py'
      - 'src/bootstrap_train.py'
      - 'src/binance_history.py'
      - 'src/feature_schema.py'
      - 'src/label_policy.py'
      - 'models/10m.joblib'
      - 'models/10m.json'
      - '.github/workflows/btc_rolling_window_grid_10m_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-rolling-window-grid-10m-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_rolling_window_grid_10m_oos.py
      - name: Run chronological window-grid OOS
        run: |
          set -euo pipefail
          python src/rolling_window_grid_10m_oos.py
          test -s data/historical_research/rolling_window_grid_10m_oos.json
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('data/historical_research/rolling_window_grid_10m_oos.json').read_text())
          h=o['horizons']['10m']
          assert o['research_only'] is True
          assert o['production_changed'] is False
          assert o['promotion_evidence_eligible'] is False
          assert h['window_selection']['selected_from']=='development_oos_only'
          assert h['final_blind']['protected'] is True
          assert h['final_blind']['used_for_selection'] is False
          print('rolling window-grid evidence verified')
          PY
      - name: Upload evidence
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-rolling-window-grid-10m-oos
          path: data/historical_research/rolling_window_grid_10m_oos.json
          if-no-files-found: error
          retention-days: 7
