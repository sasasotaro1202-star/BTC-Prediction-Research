name: BTC Binary Target Research

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/label_policy.py'
      - 'src/binary_target_research.py'
      - 'tests/test_binary_target_research.py'
      - '.github/workflows/btc_binary_target_research.yml'

concurrency:
  group: btc-binary-target-research
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: src

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # The research modules intentionally support both package imports
      # (src.foo) and direct sibling imports (foo). Make the sibling-import
      # contract explicit in CI so transitive dependencies such as db and
      # http_resilience resolve exactly as they do in the repository runtime.
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install free research dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Compile and test binary target
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest -q tests/test_binary_target_research.py

      - name: Require repository prediction state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz

      - name: Restore repository prediction state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          print('Restored prediction state for binary target research.')
          PY
          test -s data/predictions.db

      - name: Run binary UP DOWN chronological OOS
        run: |
          set -euo pipefail
          python src/binary_target_research.py
          test -s data/historical_research/binary_target_oos.json

      - name: Validate research-only and target contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/binary_target_oos.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('research_only') is not True:
              raise SystemExit('binary target must remain research-only')
          if obj.get('production_changed') is not False:
              raise SystemExit('binary target changed production state')
          if obj.get('target_version') != 'binary_sign_v1':
              raise SystemExit('unexpected binary target version')
          if obj.get('analysis_git_sha') != __import__('os').environ.get('GITHUB_SHA'):
              raise SystemExit('binary evidence must bind to the workflow analysis commit SHA')
          if set(obj.get('horizons', {})) != {'5m', '10m'}:
              raise SystemExit('binary target horizon set incomplete')
          for h, result in obj['horizons'].items():
              if result.get('status') == 'OK':
                  if result.get('classes') != ['DOWN', 'UP']:
                      raise SystemExit(f'{h}: class contract mismatch')
                  if result.get('holdout_protected') is not True:
                      raise SystemExit(f'{h}: holdout not protected')
                  if result.get('promotion', {}).get('eligible') is not False:
                      raise SystemExit(f'{h}: binary target cannot auto-promote')
                  if result.get('best_development_candidate') == 'frequency_baseline':
                      raise SystemExit(f'{h}: baseline cannot be selected as a trainable candidate')
                  summary = result.get('oos_summary', {})
                  if 'frequency_baseline' not in summary:
                      raise SystemExit(f'{h}: frequency baseline missing from OOS evidence')
                  diagnostics = result.get('wfo_diagnostics', {})
                  if diagnostics.get('blocks', 0) <= 0:
                      raise SystemExit(f'{h}: WFO diagnostics missing')
                  for name in ('logreg', 'rf', 'extra_trees'):
                      item = diagnostics.get('models', {}).get(name, {})
                      if item.get('status') != 'OK':
                          raise SystemExit(f'{h}: WFO diagnostics incomplete for {name}')
                      if not (0.0 <= float(item.get('logloss_non_degraded_fraction', -1.0)) <= 1.0):
                          raise SystemExit(f'{h}: invalid logloss stability fraction for {name}')
                      newest = item.get('newest_block', {})
                      worst = item.get('worst_logloss_block', {})
                      if not newest or not worst:
                          raise SystemExit(f'{h}: newest/worst fold evidence missing for {name}')
                  live = result.get('live_primary', {})
                  if live.get('production_changed') not in (False, None):
                      raise SystemExit(f'{h}: live binary research mutated production state')
                  if live.get('status') == 'OK' and live.get('classes') != ['DOWN', 'UP']:
                      raise SystemExit(f'{h}: live binary class contract mismatch')
          print('binary UP/DOWN target contract: VERIFIED')
          PY

      - name: Commit research evidence only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/historical_research/binary_target_oos.json
          if git diff --cached --quiet; then
            echo 'No binary target evidence changes.'
            exit 0
          fi
          git commit -m 'Record BTC binary UP DOWN target research evidence'
          git fetch --prune origin main
          if ! git merge --no-edit --strategy-option=ours origin/main; then
            git merge --abort
            git reset --hard origin/main
            git add data/historical_research/binary_target_oos.json
            git commit -m 'Record BTC binary UP DOWN target research evidence'
          fi
          git push origin HEAD:main
