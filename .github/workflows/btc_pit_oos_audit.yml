name: BTC PIT OOS Audit

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/predictions.db.gz'
      - 'data/historical_research/**'
      - 'src/pit_oos_audit.py'
      - 'src/db.py'
      - '.github/workflows/btc_pit_oos_audit.yml'

concurrency:
  group: btc-pit-oos-audit
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Restore repository prediction state
        shell: bash
        run: |
          set -euo pipefail
          if [ -s data/predictions.db.gz ]; then
            python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          print('Restored prediction state for PIT/OOS audit.')
          PY
          fi
      - name: Run PIT and OOS integrity audit
        run: python src/pit_oos_audit.py
      - name: Upload PIT/OOS audit report
        uses: actions/upload-artifact@v6
        with:
          name: btc-pit-oos-audit
          path: data/historical_research/pit_oos_audit.json
          retention-days: 14
