name: BTC Ops Preflight

# Lightweight continuous contract check for the GitHub-side BTC runtime.
# It is deliberately read-only: no prediction state or production artifact is mutated.
on:
  schedule:
    - cron: '19,49 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_ops_preflight.yml'
      - '.github/workflows/btc_watchdog.yml'
      - '.github/workflows/btc_live_cycle.yml'
      - '.github/workflows/btc_continuous_supervisor.yml'
      - '.github/workflows/btc_external_method_research.yml'
      - '.github/workflows/btc_external_method_shadow.yml'
      - 'src/autonomous_research_router.py'
      - 'src/external_method_shadow.py'
      - 'src/external_method_research.py'
      - '.github/workflows/btc_binance_ws_collector.yml'
      - '.github/workflows/btc_research_pr_automerge.yml'
      - '.github/workflows/btc_recency_challenger.yml'
      - 'src/**'
      - 'models/*.json'
      - 'PROJECT_INSTRUCTIONS.md'
      - 'docs/PROJECT_SOURCE.md'
  workflow_dispatch:

concurrency:
  group: btc-ops-preflight
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Validate BTC runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate every workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |p| YAML.load_file(p, aliases: true); puts "YAML OK: #{p}" }'

      - name: Validate watchdog inventory and continuous schedules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path(".github/workflows")
          watchdog = (root / "btc_watchdog.yml").read_text(encoding="utf-8")

          block_match = re.search(r"workflows=\(\n(.*?)\n\s*\)", watchdog, re.S)
          if not block_match:
              raise SystemExit("watchdog recovery inventory block missing")

          names = re.findall(r"^\s+(btc_[a-z0-9_]+\.yml)\s*$", block_match.group(1), re.M)
          if not names:
              raise SystemExit("watchdog recovery inventory empty")

          missing = [name for name in names if not (root / name).is_file()]
          if missing:
              raise SystemExit("watchdog references missing workflow(s): " + ", ".join(missing))

          required = {
              "btc_live_cycle.yml",
              "btc_binance_ws_collector.yml",
              "btc_9h_research_marathon.yml",
              "btc_24h_watchdog.yml",
              "btc_unit_tests.yml",
          }
          absent = sorted(required - set(names))
          if absent:
              raise SystemExit("watchdog coverage missing required workflow(s): " + ", ".join(absent))

          schedule_contracts = {
              "btc_watchdog.yml": "cron: '4-59/5 * * * *'",
              "btc_live_cycle.yml": "cron: '2-59/5 * * * *'",
              "btc_binance_ws_collector.yml": "cron: '3,33 * * * *'",
              "btc_ops_preflight.yml": "cron: '19,49 * * * *'",
              "btc_continuous_supervisor.yml": "cron: '*/5 * * * *'",
          }
          for filename, marker in schedule_contracts.items():
              text = (root / filename).read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"{filename}: required schedule contract missing: {marker}")

          if "actions: write" not in watchdog:
              raise SystemExit("watchdog must retain Actions write permission for recovery")
          if '            if [ "$workflow" != "btc_live_cycle.yml" ]; then' not in watchdog:
              raise SystemExit("watchdog self-change trigger must permit only production-critical Live recovery")
          print("watchdog self-change Live recovery scope: VERIFIED")

          if "      - uses: actions/checkout@v7" not in watchdog:
              raise SystemExit("watchdog must checkout repository before using versioned recovery helpers")
          if "  push:" not in watchdog or "      - '.github/workflows/btc_watchdog.yml'" not in watchdog:
              raise SystemExit("watchdog self-change push trigger missing")
          if "scripts/ci_failure_streak.sh" not in watchdog:
              raise SystemExit("watchdog recovery helper dependency missing")
          print("watchdog repository checkout + helper dependency: VERIFIED")
          print(f"watchdog inventory verified: {len(names)} recovery workflows")

          supervisor = (root / "btc_continuous_supervisor.yml").read_text(encoding="utf-8")
          required_supervisor_calls = {
              "dispatch_if_stale btc_live_cycle.yml 300",
              "dispatch_if_stale btc_binance_ws_collector.yml 900",
              "dispatch_if_stale btc_rolling_challenger.yml 21600",
              "dispatch_if_stale btc_9h_research_marathon.yml 28800",
              "dispatch_if_stale btc_24h_watchdog.yml 900",
          }
          missing_supervisor = sorted(required_supervisor_calls - set(
              line.strip() for line in supervisor.splitlines()
          ))
          if missing_supervisor:
              raise SystemExit("continuous supervisor coverage missing: " + ", ".join(missing_supervisor))
          if "timeout-minutes: 8" not in supervisor:
              raise SystemExit("continuous supervisor timeout contract missing")
          supervisor_dispatch_contracts = {
              'ci_gh workflow enable "${workflow}" --repo "${REPO}"',
              'dispatch_target_sha="$(ci_gh_api_get "/repos/${REPO}/git/ref/heads/main"',
              'Dispatch creation verified: ${workflow} sha=${dispatch_target_sha}',
              'no matching workflow_dispatch run was created within the verification window',
              'select(.event=="workflow_dispatch")',
          }
          missing_dispatch_contracts = sorted(
              marker for marker in supervisor_dispatch_contracts if marker not in supervisor
          )
          if missing_dispatch_contracts:
              raise SystemExit(
                  "continuous supervisor dispatch verification contract missing: "
                  + ", ".join(missing_dispatch_contracts)
              )
          if "return 10" in supervisor or "return 20" in supervisor:
              raise SystemExit("continuous supervisor must not leak dispatch state through helper exit codes")
          print("continuous supervisor dispatch enablement + creation verification: VERIFIED")


          watchdog_24h = (root / "btc_24h_watchdog.yml").read_text(encoding="utf-8")
          required_24h_dispatch_contracts = {
              'ci_gh workflow enable btc_24h_autonomous_research.yml --repo "$REPO"',
              "24H marathon workflow enable check completed.",
              "BTC 24H marathon dispatch verified:",
          }
          missing_24h = sorted(
              marker for marker in required_24h_dispatch_contracts if marker not in watchdog_24h
          )
          if missing_24h:
              raise SystemExit(
                  "24H watchdog recovery enablement/verification contract missing: "
                  + ", ".join(missing_24h)
              )
          print("24H watchdog target enablement + dispatch verification: VERIFIED")
          if "production_active=0" not in supervisor:
              raise SystemExit("continuous supervisor production-capacity guard missing")
          if 'production_response="$(ci_gh_api_get' not in supervisor:
              raise SystemExit("continuous supervisor production-state inspection missing")
          if 'suppressing avoidable research stale-dispatches' not in supervisor:
              raise SystemExit("continuous supervisor production-first suppression path missing")
          if "cancel-in-progress: true" not in supervisor:
              raise SystemExit("continuous supervisor concurrency contract missing")
          if "gh workflow run btc_continuous_supervisor.yml" in supervisor:
              raise SystemExit("stateless supervisor must not self-dispatch")
          required_event_wakeups = {
              "BTC Live Cycle",
              "BTC Binance WS Collector",
              "BTC PIT OOS Audit",
              "BTC Archive Refresh Research",
              "BTC Research Readiness Audit",
              "BTC Adaptive Calibration Replay Research",
              "BTC Experience Policy OOS Learning",
              "BTC Recency Challenger",
              "BTC Selective Prediction OOS",
              "BTC Rich Production Challenger",
              "BTC Ultimate Final V13 — Maximum Future-Generalization E2E",
              "BTC Autonomous Data Frontier",
              "BTC Uncertainty Layer OOS",
              "BTC Ops Preflight",
              "BTC 24H Autonomous Research",
              "BTC 24H Research Watchdog",
          }
          for workflow_name in required_event_wakeups:
              if f'- "{workflow_name}"' not in supervisor:
                  raise SystemExit(
                      "continuous supervisor event-driven recovery missing: "
                      + workflow_name
                  )
          if "types: [completed]" not in supervisor:
              raise SystemExit("continuous supervisor workflow_run completion trigger missing")
          if "\"trigger_event\": \"${GITHUB_EVENT_NAME}\"" not in supervisor:
              raise SystemExit("continuous supervisor trigger observability missing")
          watchdog = (root / "btc_watchdog.yml").read_text(encoding="utf-8")
          if "recover_if_stale btc_binance_ws_collector.yml 3000 3300 300" not in watchdog:
              raise SystemExit("watchdog collector active grace must cover the full capture window")
          if "recover_if_stale btc_continuous_supervisor.yml 900 1800 900" not in watchdog:
              raise SystemExit("watchdog supervisor recovery threshold is not 15-minute bounded")
          print("continuous supervisor event-driven + bounded watchdog recovery coverage: VERIFIED")

          automerge = (root / "btc_research_pr_automerge.yml").read_text(encoding="utf-8")
          required_automerge_contracts = {
              "pull_request_target:",
              "contents: write",
              "pull-requests: write",
              "checks: read",
              "<!-- btc-automerge:research-only -->",
              'if [ "$head_repo" != "$REPO" ]; then',
              "data/*|models/*|registry/*",
              ".github/workflows/*",
              "-f sha=\"$head_sha\"",
              "-f merge_method=squash",
              "actions/upload-artifact@v6",
          }
          missing_automerge = sorted(
              marker for marker in required_automerge_contracts if marker not in automerge
          )
          if missing_automerge:
              raise SystemExit(
                  "research PR auto-merge safety contract missing: "
                  + ", ".join(missing_automerge)
              )
          if "actions/checkout@" in automerge:
              raise SystemExit(
                  "research PR auto-merge workflow must not checkout or execute untrusted PR code"
              )
          print("research PR auto-merge safety contract: VERIFIED")
          PY

      - name: Install BTC runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check --retries 8 --timeout 90 -r requirements.txt; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Reject fail-open shell suppression in workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          forbidden = "|" + "| true"
          offenders = []
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              if forbidden in text:
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(
                  "forbidden fail-open shell suppression found in: " + ", ".join(offenders)
              )
          print("No forbidden fail-open shell suppression found.")
          PY

      - name: Compile BTC source, test modules, and recovery helper
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          test -f scripts/ci_failure_streak.sh
          bash -n scripts/ci_failure_streak.sh

      - name: Validate autonomous research router output
        shell: bash
        run: |
          set -euo pipefail
          python src/autonomous_research_router.py > /tmp/autonomous_route.json
          python - <<'PY'
          import json
          from pathlib import Path

          obj = json.loads(Path("/tmp/autonomous_route.json").read_text(encoding="utf-8"))
          allowed = {
              "btc_research_readiness.yml",
              "btc_autonomous_data_frontier.yml",
              "btc_adaptive_calibration_replay.yml",
              "btc_experience_policy_oos.yml",
              "btc_recency_challenger.yml",
              "btc_selective_prediction_oos.yml",
              "btc_return_distribution_tail_oos.yml",
              "btc_uncertainty_layer_oos.yml",
              "btc_rich_production_challenger.yml",
              "btc_external_method_research.yml",
              "btc_external_method_shadow.yml",
              "btc_ultimate_final_v13_e2e.yml",
          }
          if obj.get("workflow") not in allowed:
              raise SystemExit("router produced workflow outside allowlist")
          if obj.get("production_impact") is not False:
              raise SystemExit("router production_impact must be false")
          candidates = obj.get("candidates")
          if not isinstance(candidates, list) or not (1 <= len(candidates) <= len(allowed)):
              raise SystemExit("router candidates missing or out of bounds")
          expected_thresholds = {
              "btc_research_readiness.yml": 3600,
              "btc_autonomous_data_frontier.yml": 900,
              "btc_adaptive_calibration_replay.yml": 28800,
              "btc_experience_policy_oos.yml": 21600,
              "btc_recency_challenger.yml": 86400,
              "btc_selective_prediction_oos.yml": 43200,
              "btc_uncertainty_layer_oos.yml": 21600,
              "btc_return_distribution_tail_oos.yml": 21600,
              "btc_rich_production_challenger.yml": 86400,
              "btc_external_method_research.yml": 900,
              "btc_external_method_shadow.yml": 900,
              "btc_ultimate_final_v13_e2e.yml": 86400,
          }
          seen = set()
          previous_priority = None
          for candidate in candidates:
              workflow = candidate.get("workflow")
              if workflow not in allowed or workflow in seen:
                  raise SystemExit("router candidate outside allowlist or duplicated")
              seen.add(workflow)
              if candidate.get("production_impact") is not False:
                  raise SystemExit("router candidate production_impact must be false")
              if candidate.get("threshold_seconds") != expected_thresholds[workflow]:
                  raise SystemExit("router candidate threshold mismatch")
              priority = candidate.get("priority")
              if not isinstance(priority, (int, float)):
                  raise SystemExit("router candidate priority missing")
              if previous_priority is not None and priority > previous_priority:
                  raise SystemExit("router candidate priority order invalid")
              previous_priority = priority
              if not isinstance(candidate.get("reason"), str) or not candidate["reason"]:
                  raise SystemExit("router candidate reason missing")
              if not isinstance(candidate.get("evidence_state"), str) or not candidate["evidence_state"]:
                  raise SystemExit("router candidate evidence_state missing")
              if not isinstance(candidate.get("signals"), list) or not all(isinstance(x, str) and x for x in candidate["signals"]):
                  raise SystemExit("router candidate signals invalid")
          if candidates[0].get("workflow") != obj.get("workflow"):
              raise SystemExit("router first candidate mismatch")
          if not isinstance(obj.get("signals"), list) or not all(isinstance(x, str) and x for x in obj["signals"]):
              raise SystemExit("router signals invalid")
          threshold = obj.get("threshold_seconds")
          if not isinstance(threshold, (int, float)) or not (0 < threshold <= 604800):
              raise SystemExit("router threshold is outside safe bounds")
          if not isinstance(obj.get("reason"), str) or not obj["reason"]:
              raise SystemExit("router reason missing")
          if not isinstance(obj.get("priority"), (int, float)):
              raise SystemExit("router priority missing or invalid")
          if not isinstance(obj.get("evidence_state"), str) or not obj["evidence_state"]:
              raise SystemExit("router evidence_state missing")
          if not isinstance(obj.get("signals"), list):
              raise SystemExit("router signals missing or invalid")
          print("autonomous research router contract: VERIFIED")
          PY

      - name: Smoke-test rolling challenger factory registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from src.rolling_challenger_oos import factories
          registry = factories()
          expected = {
              "logreg_c0.1",
              "extra_trees_500",
              "rf_replay",
              "rf_balanced",
              "extra_trees_balanced",
              "hgb",
              "gaussian_nb",
              "adaptive_soft_ensemble",
          }
          if set(registry) != expected:
              raise SystemExit(f"rolling challenger factory registry drift: {sorted(registry)}")
          for name, factory in registry.items():
              factory()
              print(f"rolling challenger factory OK: {name}")
          PY

      - name: Verify production registry, metadata, and artifact bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          from src.feature_schema import FEATURES
          from src.state_archive import restore_db

          root = Path(".")
          db_gz = root / "data" / "predictions.db.gz"
          if not db_gz.is_file() or db_gz.stat().st_size <= 0:
              raise SystemExit("production prediction DB archive missing")

          db_path = Path("/tmp/predictions.db")
          try:
              restore_db(db_gz, db_path)
          except Exception as exc:
              raise SystemExit(f"production prediction DB archive invalid: {exc}") from exc
          with sqlite3.connect(db_path) as con:
              integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok":
                  raise SystemExit(f"production prediction DB integrity check failed: {integrity}")
              rows = con.execute(
                  "SELECT horizon, production_version FROM model_registry ORDER BY horizon"
              ).fetchall()
          registry = dict(rows)
          if set(registry) != {"5m", "10m"} or any(not str(v).strip() for v in registry.values()):
              raise SystemExit(f"production registry incomplete: {registry}")

          model_dir = root / "models"
          for horizon in ("5m", "10m"):
              meta_path = model_dir / f"{horizon}.json"
              artifact_path = model_dir / f"{horizon}.joblib"
              if not meta_path.is_file() or not artifact_path.is_file() or artifact_path.stat().st_size <= 0:
                  raise SystemExit(f"{horizon}: production artifact bundle incomplete")
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              if meta.get("candidate") is True:
                  raise SystemExit(f"{horizon}: candidate artifact exposed as production")
              if meta.get("model_version") != registry[horizon]:
                  raise SystemExit(
                      f"{horizon}: registry/metadata mismatch: "
                      f"{registry[horizon]!r} != {meta.get('model_version')!r}"
                  )
              if meta.get("artifact") != artifact_path.name:
                  raise SystemExit(f"{horizon}: artifact name mismatch")
              if meta.get("classes") != ["DOWN", "FLAT", "UP"]:
                  raise SystemExit(f"{horizon}: invalid class contract")
              if meta.get("features") != list(FEATURES):
                  raise SystemExit(f"{horizon}: feature schema drift")
          print("production registry + metadata + artifact bindings: VERIFIED")
          PY
