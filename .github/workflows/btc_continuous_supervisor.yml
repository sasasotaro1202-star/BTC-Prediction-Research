name: BTC Continuous Supervisor

on:
  # Short, stateless heartbeat jobs are more recoverable than a multi-hour runner.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: btc-continuous-supervisor
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI_GH_ATTEMPTS: '2'
      CI_GH_TIMEOUT_SECONDS: '12'
      CI_GH_BACKOFF_SECONDS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Verify supervisor prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . scripts/ci_network_retry.sh
          test "${GITHUB_REF_NAME}" = "main"
          ci_gh_api_get "/repos/${REPO}" --jq '.default_branch' | grep -qx main

      - name: Dispatch only stale production/research workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          . scripts/ci_network_retry.sh
          degraded=0

          dispatch_if_stale() {
            workflow="$1"
            threshold="$2"

            response="$(ci_gh_api_get "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=50" 2>/dev/null)" || {
              echo "ERROR: cannot inspect ${workflow}" >&2
              degraded=1
              return 0
            }

            active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"$response" 2>/dev/null)" || {
              echo "ERROR: cannot parse active state for ${workflow}" >&2
              degraded=1
              return 0
            }

            latest="$(jq -r '[.workflow_runs[]? | select(.status=="completed" and .conclusion!="skipped")] | sort_by(.updated_at) | last // empty | [.updated_at,.head_sha] | @tsv' <<<"$response" 2>/dev/null)" || {
              echo "ERROR: cannot parse latest state for ${workflow}" >&2
              degraded=1
              return 0
            }

            latest_updated="$(cut -f1 <<<"$latest")"
            if [ -z "${latest_updated}" ]; then
              latest_epoch=0
            else
              latest_epoch="$(date -d "${latest_updated}" +%s 2>/dev/null)" || {
                echo "ERROR: invalid latest timestamp for ${workflow}: ${latest_updated}" >&2
                degraded=1
                return 0
              }
            fi

            now="$(date +%s)"
            age=$((now-latest_epoch))
            echo "${workflow}: active=${active} latest_age=${age}s threshold=${threshold}s"

            if [ "${active}" -eq 0 ] && { [ "${latest_epoch}" -eq 0 ] || [ "${age}" -ge "${threshold}" ]; }; then
              echo "Dispatching stale ${workflow}"
              # Use explicit REST workflow_dispatch first. This is the path proven
              # by the independent Watchdog and avoids gh CLI discovery variance.
              if ci_gh api --method POST "/repos/${REPO}/actions/workflows/${workflow}/dispatches" -f ref=main >/dev/null 2>&1; then
                echo "Dispatch succeeded via workflow_dispatch API: ${workflow}"
              elif ci_gh workflow run "${workflow}" --ref main >/dev/null 2>&1; then
                echo "Dispatch succeeded via ci_gh workflow run: ${workflow}"
              else
                echo "ERROR: dispatch failed through both REST and gh CLI: ${workflow}" >&2
                degraded=1
              fi
            fi
          }

          # Production freshness is the fastest recovery path.
          dispatch_if_stale btc_live_cycle.yml 300
          dispatch_if_stale btc_binance_ws_collector.yml 900

          # Research remains bounded by its own active-run guard.
          dispatch_if_stale btc_rolling_challenger.yml 21600
          dispatch_if_stale btc_9h_research_marathon.yml 28800

          # High-value case-adaptation research must also recover when its own
          # schedule/trigger is delayed. These lanes are research-only and have
          # independent concurrency guards, so stale dispatch does not alter production.
          dispatch_if_stale btc_uncertainty_layer_oos.yml 21600
          dispatch_if_stale btc_multiscale_frozen_replay.yml 21600
          dispatch_if_stale btc_time_regime_research.yml 28800
          dispatch_if_stale btc_adaptive_calibration_replay.yml 28800
          dispatch_if_stale btc_selective_prediction_oos.yml 43200

          cat > supervisor_status.json <<EOF
          {
            "schema_version": 2,
            "workflow_run_id": ${GITHUB_RUN_ID},
            "head_sha": "${GITHUB_SHA}",
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "degraded": ${degraded},
            "design": "stateless_5m_scheduler_no_self_dispatch_no_multi_hour_runner"
          }
          EOF
          cat supervisor_status.json

          if [ "${degraded}" -ne 0 ]; then
            echo "::warning::BTC supervisor heartbeat completed with degraded inspection/dispatch state; Watchdog remains the independent recovery path."
          fi

      - name: Upload supervisor status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-continuous-supervisor-status-${{ github.run_id }}
          path: supervisor_status.json
          if-no-files-found: error
          retention-days: 3
