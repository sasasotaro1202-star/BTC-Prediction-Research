name: BTC Continuous Supervisor

on:
  # Short, stateless heartbeat jobs are more recoverable than a multi-hour runner.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # Event-driven recovery removes the 5-minute schedule as a single point of
  # failure. Completed production/data/research lanes immediately wake the
  # router; concurrency collapses duplicate wakeups into one supervisor run.
  workflow_run:
    workflows:
      - "BTC Live Cycle"
      - "BTC Binance WS Collector"
      - "BTC PIT OOS Audit"
      - "BTC Archive Refresh Research"
      - "BTC Research Readiness Audit"
      - "BTC Adaptive Calibration Replay Research"
      - "BTC Experience Policy OOS Learning"
      - "BTC Recency Challenger"
      - "BTC Selective Prediction OOS"
      - "BTC Rich Production Challenger"
      - "BTC Ultimate Final V13 — Maximum Future-Generalization E2E"
      - "BTC Autonomous Data Frontier"
      - "BTC Uncertainty Layer OOS"
      - "BTC Return Distribution Tail OOS Research"
      - "BTC Ops Preflight"
      - "BTC 24H Autonomous Research"
      - "BTC 24H Research Watchdog"
      - "BTC External Method Research"
      - "BTC External Method Shadow"
      - "BTC Recency Challenger"
    types: [completed]

concurrency:
  group: btc-continuous-supervisor
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Verify supervisor prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CI_GH_ATTEMPTS: '2'
          CI_GH_TIMEOUT_SECONDS: '12'
          CI_GH_BACKOFF_SECONDS: '1'
        run: |
          set -euo pipefail
          . scripts/ci_network_retry.sh
          test "${GITHUB_REF_NAME}" = "main"
          ci_gh_api_get "/repos/${REPO}" --jq '.default_branch' | grep -qx main

      - name: Dispatch only stale production/research workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          . scripts/ci_network_retry.sh
          degraded=0
          route_workflow=''
          route_threshold=''
          route_reason='router_unavailable'
          route_priority=0
          route_evidence_state='UNKNOWN'
          route_signals='[]'

          # Select at most one additional research lane from current published evidence.
          # This router is deterministic, research-only, fail-closed, and allowlisted.
          set +e
          route_json="$(python src/autonomous_research_router.py 2>/tmp/btc_router.err)"
          route_status=$?
          set -e
          printf '%s\n' "$route_json" > autonomous_route.json
          if [ "$route_status" -eq 0 ] && jq -e '
              .production_impact == false
              and (
                .workflow == "btc_research_readiness.yml"
                or .workflow == "btc_autonomous_data_frontier.yml"
                or .workflow == "btc_adaptive_calibration_replay.yml"
                or .workflow == "btc_experience_policy_oos.yml"
                or .workflow == "btc_recency_challenger.yml"
                or .workflow == "btc_selective_prediction_oos.yml"
                or .workflow == "btc_uncertainty_layer_oos.yml"
                or .workflow == "btc_return_distribution_tail_oos.yml"
                or .workflow == "btc_rich_production_challenger.yml"
                or .workflow == "btc_external_method_research.yml"
                or .workflow == "btc_external_method_shadow.yml"
                or .workflow == "btc_ultimate_final_v13_e2e.yml"
              )
              and (.threshold_seconds | type == "number")
              and (.threshold_seconds > 0)
              and (.threshold_seconds <= 604800)
              and (.priority | type == "number")
              and (.reason | type == "string" and length > 0)
              and (.evidence_state | type == "string" and length > 0)
              and (.signals | type == "array")
              and (.candidates | type == "array" and length >= 1 and length <= 12)
              and all(.candidates[];
                .production_impact == false
                and (
                  .workflow == "btc_research_readiness.yml"
                  or .workflow == "btc_autonomous_data_frontier.yml"
                  or .workflow == "btc_adaptive_calibration_replay.yml"
                  or .workflow == "btc_experience_policy_oos.yml"
                  or .workflow == "btc_recency_challenger.yml"
                  or .workflow == "btc_selective_prediction_oos.yml"
                or .workflow == "btc_uncertainty_layer_oos.yml"
                or .workflow == "btc_return_distribution_tail_oos.yml"
                  or .workflow == "btc_rich_production_challenger.yml"
                  or .workflow == "btc_external_method_research.yml"
                  or .workflow == "btc_external_method_shadow.yml"
                  or .workflow == "btc_ultimate_final_v13_e2e.yml"
                )
                and (.threshold_seconds | type == "number")
                and (.threshold_seconds > 0)
                and (.threshold_seconds <= 604800)
                and (.reason | type == "string" and length > 0)
                and (.evidence_state | type == "string" and length > 0)
                and (.signals | type == "array")
              )
            ' autonomous_route.json >/dev/null 2>&1; then
            route_workflow="$(jq -r '.workflow // empty' autonomous_route.json)"
            route_threshold="$(jq -r '.threshold_seconds // empty' autonomous_route.json)"
            route_reason="$(jq -r '.reason // "unspecified"' autonomous_route.json)"
            route_priority="$(jq -r '.priority // 0' autonomous_route.json)"
            route_evidence_state="$(jq -r '.evidence_state // "UNKNOWN"' autonomous_route.json)"
            route_signals="$(jq -c '.signals // []' autonomous_route.json)"
          else
            echo 'ERROR: autonomous research router failed; fail-closed to readiness audit.' >&2
            if [ -f /tmp/btc_router.err ]; then
              cat /tmp/btc_router.err >&2
            fi
            degraded=1
            route_workflow='btc_research_readiness.yml'
            route_threshold=3600
            route_reason='router_failed_fail_closed'
            route_priority=100
            route_evidence_state='ROUTER_FAILURE'
            route_signals='["router_failed_fail_closed"]'
            cat > autonomous_route.json <<EOF
          {
            "workflow": "btc_research_readiness.yml",
            "threshold_seconds": 3600,
            "reason": "router_failed_fail_closed",
            "production_impact": false,
            "priority": 100,
            "evidence_state": "ROUTER_FAILURE",
            "signals": ["router_failed_fail_closed"],
            "candidates": [
              {
                "workflow": "btc_research_readiness.yml",
                "threshold_seconds": 3600,
                "reason": "router_failed_fail_closed",
                "production_impact": false,
                "priority": 100,
                "evidence_state": "ROUTER_FAILURE",
                "signals": ["router_failed_fail_closed"]
              }
            ]
          }
          EOF
          fi

          dispatch_if_stale() {
            workflow="${1}"
            threshold="${2}"
            route_mode="${3:-0}"
            # Internal dispatch state must never become the Actions step exit code.
            route_dispatch_outcome=0

            response="$(ci_gh_api_get "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=50" 2>/dev/null)" || {
              echo "ERROR: cannot inspect ${workflow}" >&2
              degraded=1
              if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=2; fi
              return 0
            }

            active="$(jq '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length' <<<"${response}" 2>/dev/null)" || {
              echo "ERROR: cannot parse active state for ${workflow}" >&2
              degraded=1
              if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=2; fi
              return 0
            }

            latest="$(jq -r '[.workflow_runs[]? | select(.status=="completed" and .conclusion!="skipped")] | sort_by(.updated_at) | last // empty | [.updated_at,.head_sha,.conclusion] | @tsv' <<<"${response}" 2>/dev/null)" || {
              echo "ERROR: cannot parse latest state for ${workflow}" >&2
              degraded=1
              if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=2; fi
              return 0
            }

             . scripts/ci_failure_streak.sh
             failure_streak="$(printf "%s" "${response}" | ci_failure_streak_from_stdin)" || failure_streak=0
            if ! [[ "${failure_streak}" =~ ^[0-9]+$ ]]; then failure_streak=0; fi
            failure_cooldown=300
            if [ "${failure_streak}" -gt 1 ]; then
              backoff_power=$((failure_streak - 1))
              [ "${backoff_power}" -gt 4 ] && backoff_power=4
              failure_cooldown=$((300 * (2 ** backoff_power)))
              [ "${failure_cooldown}" -gt 4800 ] && failure_cooldown=4800
            fi
            latest_updated="$(cut -f1 <<<"${latest}")"
            latest_conclusion="$(cut -f3 <<<"${latest}")"
            if [ -z "${latest_updated}" ]; then
              latest_epoch=0
            else
              latest_epoch="$(date -d "${latest_updated}" +%s 2>/dev/null)" || {
                echo "ERROR: invalid latest timestamp for ${workflow}: ${latest_updated}" >&2
                degraded=1
                if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=2; fi
                return 0
              }
            fi

            now="$(date +%s)"
            age=$((now-latest_epoch))
            failure_retry_due=false
            case "${latest_conclusion}" in
              failure|cancelled|timed_out|action_required|stale)
                # A failed/cancelled generation must not be considered fresh merely
                # because it completed recently. Wait 5 minutes to avoid a dispatch
                # storm, then recover on current main.
                if [ "${age}" -ge "${failure_cooldown}" ]; then failure_retry_due=true; fi
                ;;
            esac
            echo "${workflow}: active=${active} latest_age=${age}s latest_conclusion=${latest_conclusion:-none} failure_streak=${failure_streak} failure_cooldown=${failure_cooldown}s threshold=${threshold}s failure_retry_due=${failure_retry_due}"

            if [ "${active}" -eq 0 ] && { [ "${latest_epoch}" -eq 0 ] || [ "${age}" -ge "${threshold}" ] || [ "${failure_retry_due}" = true ]; }; then
              echo "Dispatching stale ${workflow}"
              dispatch_started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              dispatch_target_sha="$(ci_gh_api_get "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)" || dispatch_target_sha=''
              if [ -z "${dispatch_target_sha}" ]; then
                echo "ERROR: cannot resolve current main SHA before dispatch: ${workflow}" >&2
                degraded=1
                if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=2; fi
                return 0
              fi

              # A workflow can lose its schedule/dispatch capability when it is
              # disabled. Re-enable intended autonomous lanes before dispatching,
              # while still allowing the dispatch attempt to fail closed if the
              # enable request itself is unavailable.
              if ci_gh workflow enable "${workflow}" --repo "${REPO}" >/dev/null 2>&1; then
                echo "Workflow enable check completed: ${workflow}"
              else
                echo "WARN: workflow enable check failed; dispatch will still be attempted: ${workflow}" >&2
              fi

              dispatch_sent=false
              if ci_gh_api_get "/repos/${REPO}/actions/workflows/${workflow}/dispatches" --method POST -f ref=main >/dev/null 2>&1; then
                echo "Dispatch request accepted via workflow_dispatch API: ${workflow}"
                dispatch_sent=true
              elif ci_gh workflow run "${workflow}" --ref main >/dev/null 2>&1; then
                echo "Dispatch request accepted via gh workflow run: ${workflow}"
                dispatch_sent=true
              else
                echo "ERROR: dispatch failed through both REST and gh CLI: ${workflow}" >&2
                degraded=1
                if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=2; fi
              fi

              # An accepted dispatch request is not sufficient evidence that a
              # workflow run was actually created. Verify creation on current main
              # with a short bounded poll; the independent Watchdog remains the
              # fallback when this verification cannot be completed.
              if [ "${dispatch_sent}" = true ]; then
                dispatch_verified=false
                for check in 1 2 3 4; do
                  sleep 5
                  verify_response="$(ci_gh_api_get "/repos/${REPO}/actions/workflows/${workflow}/runs?branch=main&per_page=30" 2>/dev/null)" || verify_response=''
                  if [ -n "${verify_response}" ] && jq -e \
                      --arg sha "${dispatch_target_sha}" \
                      --arg started "${dispatch_started_at}" \
                      '[.workflow_runs[]? | select(.head_branch=="main") | select(.head_sha==$sha) | select(.event=="workflow_dispatch") | select(.created_at >= $started)] | length > 0' \
                      <<<"${verify_response}" >/dev/null 2>&1; then
                    dispatch_verified=true
                    echo "Dispatch creation verified: ${workflow} sha=${dispatch_target_sha}"
                    break
                  fi
                done
                if [ "${dispatch_verified}" = true ]; then
                  if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=1; fi
                else
                  echo "ERROR: dispatch request accepted but no matching workflow_dispatch run was created within the verification window: ${workflow}" >&2
                  degraded=1
                  if [ "${route_mode}" -eq 1 ]; then route_dispatch_outcome=2; fi
                fi
              fi
            fi
            return 0
          }

          # Production freshness is the fastest recovery path.
          dispatch_if_stale btc_live_cycle.yml 300
          dispatch_if_stale btc_binance_ws_collector.yml 900
          # PIT OOS Audit is a production-safety prerequisite, not optional research.
          # Keep it recoverable even while the Live Cycle is active so the router's
          # one-hour freshness gate does not become a permanent backpressure loop.
          dispatch_if_stale btc_pit_oos_audit.yml 900
          # The 24H marathon remains exclusively owned by its dedicated watchdog.
          # The Supervisor only keeps that watchdog heartbeat alive, so a lost
          # watchdog schedule cannot strand the long-running research chain.
          dispatch_if_stale btc_24h_watchdog.yml 900
          # Never add avoidable research load while the production/data spine is
          # already queued or running. The next heartbeat/event will retry research.
          production_active=0
          production_response="$(ci_gh_api_get "/repos/sasasotaro1202-star/BTC-Prediction-Research/actions/workflows/btc_live_cycle.yml/runs?branch=main&per_page=20" 2>/dev/null)" || production_response=''
          if [ -n "${production_response}" ] && jq -e '[.workflow_runs[]? | select(.status=="queued" or .status=="pending" or .status=="in_progress")] | length > 0' <<<"${production_response}" >/dev/null 2>&1; then
            production_active=1
          fi
          if [ "${production_active}" -eq 0 ]; then
            # Research remains bounded by its own active-run guard.
            dispatch_if_stale btc_rolling_challenger.yml 21600
            dispatch_if_stale btc_9h_research_marathon.yml 28800
            # 24H recovery is owned by its dedicated watchdog so its circuit breaker
            # remains authoritative and the general supervisor cannot bypass it.

            # High-value case-adaptation research must also recover when its own
            # schedule/trigger is delayed. These lanes are research-only and have
            # independent concurrency guards, so stale dispatch does not alter production.
            dispatch_if_stale btc_uncertainty_layer_oos.yml 21600
            dispatch_if_stale btc_return_distribution_tail_oos.yml 21600
            dispatch_if_stale btc_multiscale_frozen_replay.yml 21600
            dispatch_if_stale btc_time_regime_research.yml 28800
            dispatch_if_stale btc_selective_prediction_oos.yml 43200
          else
            echo "Production spine active; suppressing avoidable research stale-dispatches this heartbeat."
          fi


          # Run at most one evidence-driven research lane after the independent stale checks.
          # Production-first backpressure: an active/queued Live Cycle suppresses routed research.
          # The selected candidate remains observable and is reconsidered on a later heartbeat.
          route_dispatched=0
          route_deferred_by_production=0
          # The status artifact is emitted on both sides of the production
          # backpressure branch, so initialize this field before branching.
          route_candidate_count=0
          if [ "${production_active}" -eq 0 ]; then
            # Try ordered candidates so a fresh high-priority lane does not starve other research.
            route_dispatched=0
            route_candidate_count="$(jq '.candidates | length' autonomous_route.json 2>/dev/null)" || route_candidate_count=0
            if [ -n "${route_workflow}" ] && [ "${route_candidate_count}" -gt 0 ] 2>/dev/null; then
              for ((i=0; i<route_candidate_count; i++)); do
                candidate_workflow="$(jq -r ".candidates[${i}].workflow // empty" autonomous_route.json)"
                candidate_threshold="$(jq -r ".candidates[${i}].threshold_seconds // empty" autonomous_route.json)"
                candidate_reason="$(jq -r ".candidates[${i}].reason // \"unspecified\"" autonomous_route.json)"
                [ -n "${candidate_workflow}" ] || continue
                [ -n "${candidate_threshold}" ] || continue
                echo "Evaluating routed research candidate ${i}: ${candidate_workflow} (${candidate_reason})"
                route_dispatch_outcome=0
                set +e
                dispatch_if_stale "${candidate_workflow}" "${candidate_threshold}" 1
                candidate_rc=$?
                set -e
                if [ "${candidate_rc}" -ne 0 ]; then
                  echo "ERROR: unexpected supervisor dispatch return code ${candidate_rc}: ${candidate_workflow}" >&2
                  echo "The dispatch helper uses outcome state and must return 0." >&2
                  degraded=1
                  continue
                fi
                if [ "${route_dispatch_outcome}" -eq 1 ]; then
                  route_workflow="${candidate_workflow}"
                  route_threshold="${candidate_threshold}"
                  route_reason="${candidate_reason}"
                  route_priority="$(jq -r ".candidates[${i}].priority // 0" autonomous_route.json)"
                  route_evidence_state="$(jq -r ".candidates[${i}].evidence_state // \"UNKNOWN\"" autonomous_route.json)"
                  route_signals="$(jq -c ".candidates[${i}].signals // []" autonomous_route.json)"
                  route_dispatched=1
                  echo "Dispatched routed research candidate: ${route_workflow} (${route_reason})"
                  break
                elif [ "${route_dispatch_outcome}" -eq 2 ]; then
                  echo "ERROR: routed candidate inspection/dispatch failed: ${candidate_workflow}" >&2
                fi
              done
            fi
            if [ "${route_dispatched}" -eq 0 ]; then
              echo "No routed research candidate was dispatched this heartbeat; non-stale lanes remain eligible for a later heartbeat."
            fi
          else
            route_deferred_by_production=1
            echo "Production spine active; deferring evidence-driven routed research until a later heartbeat."
          fi

          cat > supervisor_status.json <<EOF
          {
            "schema_version": 3,
            "workflow_run_id": ${GITHUB_RUN_ID},
            "head_sha": "${GITHUB_SHA}",
            "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "degraded": ${degraded},
            "route_first_workflow": "$(jq -r '.candidates[0].workflow // ""' autonomous_route.json)",
            "route_workflow": "${route_workflow}",
            "route_threshold_seconds": ${route_threshold},
            "route_priority": ${route_priority},
            "route_reason": "${route_reason}",
            "route_evidence_state": "${route_evidence_state}",
            "route_signals": ${route_signals},
            "route_dispatched": ${route_dispatched},
            "route_candidate_count": ${route_candidate_count},
            "route_deferred_by_production": ${route_deferred_by_production},
            "trigger_event": "${GITHUB_EVENT_NAME}",
            "design": "stateless_5m_plus_event_driven_supervisor_ordered_evidence_router_no_self_dispatch_no_multi_hour_runner"
          }
          EOF

          if [ "${degraded}" -ne 0 ]; then
            echo "::warning::BTC supervisor heartbeat completed with degraded inspection/dispatch state; Watchdog remains the independent recovery path."
          fi

      - name: Upload supervisor status
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-continuous-supervisor-status-${{ github.run_id }}
          path: |
            supervisor_status.json
            autonomous_route.json
          if-no-files-found: error
          retention-days: 3
