name: BTC 24H Research Watchdog

# Lightweight recovery controller inspired by the soccer/baseball/stock
# automation watchdogs in the related research projects.
#
# It never edits production artifacts. It only cancels stale 24H marathon
# queue entries and dispatches a fresh main-branch marathon when continuity
# has been lost.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-24h-research-watchdog
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reconcile BTC 24H marathon
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CI_GH_ATTEMPTS: '2'
          CI_GH_TIMEOUT_SECONDS: '12'
          CI_GH_BACKOFF_SECONDS: '1'
        shell: bash
        run: |
          set -euo pipefail
          . scripts/ci_network_retry.sh
          MAIN_SHA="$(ci_gh_api_get "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          echo "BTC 24H watchdog main SHA: $MAIN_SHA"
          ci_gh_api_get "repos/$REPO/actions/workflows/btc_24h_autonomous_research.yml/runs?per_page=50" > /tmp/btc24_runs.json

          python - "$MAIN_SHA" <<'PY' > /tmp/btc24_decision
          import json, sys
          from datetime import datetime, timezone

          main_sha = sys.argv[1]
          runs = json.load(open("/tmp/btc24_runs.json", encoding="utf-8")).get("workflow_runs", [])
          now = datetime.now(timezone.utc)
          active_statuses = {"queued", "pending", "in_progress", "waiting", "requested"}

          active = [r for r in runs if r.get("status") in active_statuses]

          stale_active = []
          for r in active:
              status = r.get("status")
              raw = r.get("run_started_at") if status == "in_progress" else r.get("updated_at") or r.get("created_at")
              if not raw:
                  continue
              dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              age_minutes = (now - dt).total_seconds() / 60.0
              if status in {"queued", "pending"} and age_minutes >= 30:
                  stale_active.append((r, age_minutes, "queue"))
              elif status == "in_progress" and age_minutes >= 1500:
                  stale_active.append((r, age_minutes, "active"))

          if stale_active:
              for r, age, kind in stale_active:
                  print(f"STALE|{r['id']}|{kind}|{age:.1f}|sha={r.get('head_sha')}")
              print("ACTION=RECOVER_STALE")
              raise SystemExit(0)

          if active:
              current = [r for r in active if r.get("head_sha") == main_sha]
              old = [r for r in active if r.get("head_sha") != main_sha]
              print(f"ACTIVE|current_main={len(current)}|other_sha={len(old)}")
              print("ACTION=WAIT")
              raise SystemExit(0)

          completed = [
              r for r in runs
              if r.get("status") == "completed" and r.get("head_sha") == main_sha
          ]
          if not completed:
              print(f"NO_COMPLETED_RUN_FOR_CURRENT_MAIN|sha={main_sha}")
              print("ACTION=DISPATCH")
              raise SystemExit(0)

          latest = max(completed, key=lambda r: r.get("updated_at") or r.get("created_at") or "")
          raw = latest.get("updated_at") or latest.get("created_at")
          age_hours = (now - datetime.fromisoformat(raw.replace("Z", "+00:00"))).total_seconds() / 3600.0
          conclusion = latest.get("conclusion")

          recent_failures = []
          for r in completed:
              raw_r = r.get("updated_at") or r.get("created_at")
              if not raw_r:
                  continue
              age_r = (now - datetime.fromisoformat(raw_r.replace("Z", "+00:00"))).total_seconds() / 3600.0
              if age_r <= 6 and r.get("conclusion") in {"failure", "cancelled", "timed_out"}:
                  recent_failures.append(r)

          # Circuit breaker: related projects hold after repeated recent failures
          # instead of creating an unbounded failure/re-dispatch loop.
          if len(recent_failures) >= 3 and age_hours < 6:
              print(f"FAILURE_CIRCUIT_BREAKER|recent_failures={len(recent_failures)}|age_hours={age_hours:.2f}")
              print("ACTION=HOLD")
          elif conclusion not in {"success", "failure", "cancelled", "timed_out"}:
              print(f"UNKNOWN_COMPLETION_STATE|conclusion={conclusion!r}")
              print("ACTION=HOLD")
          elif conclusion in {"failure", "cancelled", "timed_out"} and age_hours >= (10 / 60):
              print(f"LAST_NON_SUCCESS|conclusion={conclusion}|age_hours={age_hours:.2f}")
              print("ACTION=DISPATCH")
          elif age_hours >= (10 / 60):
              print(f"CONTINUOUS_CHAIN|last_conclusion={conclusion}|age_hours={age_hours:.2f}")
              print("ACTION=DISPATCH")
          else:
              print(f"RECENT_COMPLETION|last_conclusion={conclusion}|age_hours={age_hours:.2f}")
              print("ACTION=WAIT")
          PY

          cat /tmp/btc24_decision
          action="$(awk -F= '/^ACTION=/{print $2}' /tmp/btc24_decision | tail -1)"

          if [ "$action" = "WAIT" ] || [ "$action" = "HOLD" ]; then
            exit 0
          fi

          if [ "$action" = "RECOVER_STALE" ]; then
            while IFS='|' read -r tag run_id kind age; do
              [ "$tag" = "STALE" ] || continue
              echo "Cancelling stale BTC 24H run: id=$run_id kind=$kind age_minutes=$age"
              ci_gh run cancel "$run_id" --repo "$REPO"
            done < /tmp/btc24_decision
          fi

          dispatch_started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          for attempt in 1 2 3 4; do
            if ! ci_gh workflow run btc_24h_autonomous_research.yml --repo "$REPO" --ref main; then
              echo "dispatch attempt $attempt failed; retrying" >&2
              sleep $((attempt * 5))
              continue
            fi

            echo "BTC 24H dispatch command accepted; verifying run creation..."
            for check in 1 2 3 4 5 6; do
              sleep 5
              created="$(ci_gh_api_get "repos/$REPO/actions/workflows/btc_24h_autonomous_research.yml/runs?per_page=20"                 --jq '[.workflow_runs[] | select(.head_sha == "'$MAIN_SHA'") | select(.created_at >= "'$dispatch_started_at'")] | sort_by(.created_at) | reverse | .[0] // empty')"
              if [ -n "$created" ]; then
                run_id="$(printf '%s' "$created" | jq -r '.id')"
                run_status="$(printf '%s' "$created" | jq -r '.status')"
                echo "BTC 24H marathon dispatch verified: run_id=$run_id status=$run_status sha=$MAIN_SHA"
                exit 0
              fi
            done
            echo "dispatch verification failed for attempt $attempt; retrying" >&2
            sleep $((attempt * 5))
          done

          echo "BTC 24H watchdog could not verify a newly created current-main marathon run" >&2
          exit 1
