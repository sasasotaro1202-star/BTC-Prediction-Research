name: BTC Historical Situation Meta OOS

on:
  pull_request:
    paths:
      - 'src/historical_situation_meta_oos.py'
      - 'tests/test_historical_situation_meta_oos.py'
      - 'src/situation.py'
      - 'src/model_compare.py'
      - 'requirements.txt'
      - '.github/workflows/btc_historical_situation_meta_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-historical-situation-meta-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  situation_meta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: \${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_historical_situation_meta_oos.py
      - name: Run frozen chronological OOS
        run: |
          set -euo pipefail
          python src/historical_situation_meta_oos.py
          test -s data/historical_research/historical_situation_meta_oos.json
      - name: Verify evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/historical_situation_meta_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          assert obj.get("schema_version")==1
          assert obj.get("research_only") is True
          assert obj.get("production_changed") is False
          assert obj.get("production_promotion_allowed") is False
          for h in ("5m","10m"):
              assert h in obj["horizons"]
          print("historical situation meta evidence contract verified")
          PY
      - name: Upload OOS evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-historical-situation-meta-\${{ github.run_id }}
          path: data/historical_research/historical_situation_meta_oos.json
          if-no-files-found: warn
          retention-days: 7
