name: BTC Historical Research

# Historical research is intentionally periodic/manual. Running the expensive
# 6-hour job on every code push wastes compute and can overlap production
# state updates. Integrity tests validate code changes; the full research run
# remains auditable through its nightly schedule or explicit dispatch.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_historical_research.yml'
      - 'src/historical_research.py'
      - 'src/historical_research_runner.py'
      - 'scripts/historical_research_spot_fallback.py'
      - 'tests/test_historical_research.py'
      - 'src/feature_pattern_exhaustive.py'
      - 'tests/test_feature_pattern_exhaustive.py'
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: btc-historical-research
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  research:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore historical archive cache
        uses: actions/cache@v6
        with:
          path: /tmp/btc_prediction_archive_cache
          key: btc-archive-${{ runner.os }}-${{ hashFiles('src/historical_research_runner.py', 'scripts/historical_research_spot_fallback.py') }}
          restore-keys: |
            btc-archive-${{ runner.os }}-${{ hashFiles('src/historical_research_runner.py', 'scripts/historical_research_spot_fallback.py') }}-
            btc-archive-${{ runner.os }}-
      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            sleep $((15 * attempt))
          done
          exit 1
      - name: Compile all research code
        run: python -m compileall -q src scripts
      - name: Preflight Binance public archive
        run: python scripts/binance_archive_smoke.py
      - name: Run historical walk-forward research with retry
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "=== historical research attempt ${attempt}/3 ==="
            set +e
            python scripts/historical_research_spot_fallback.py
            status=$?
            set -e
            if [ "${status}" -eq 0 ]; then exit 0; fi
            echo "research attempt ${attempt} failed with status ${status}"
            if [ "${attempt}" -lt 3 ]; then sleep $((30 * attempt)); fi
          done
          exit 1
      - name: Validate research artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/report.json')
          if not p.exists(): raise SystemExit('report.json was not produced')
          r=json.loads(p.read_text())
          assert r.get('protocol_version') == 'historical-v8-feature-frontier'
          assert r.get('feature_count') == 92
          assert r.get('base_feature_count') == 41
          assert r.get('frontier_feature_count') == 51
          assert r.get('ablation_artifact') == 'feature_frontier_oos.json'
          a=Path('data/historical_research/feature_frontier_oos.json')
          assert a.exists(), 'feature frontier ablation artifact missing'
          aj=json.loads(a.read_text())
          assert aj.get('research_only') is True and aj.get('production_changed') is False
          assert set(aj.get('horizons', {})) >= {'5m','10m'}
          assert all(hz.get('sample_alignment', {}).get('timestamps_identical') is True and hz.get('sample_alignment', {}).get('labels_identical') is True for hz in [r.get('horizons', {}).get('5m', {}), r.get('horizons', {}).get('10m', {})])
          assert set(r.get('horizons', {})) >= {'5m','10m'}
          for h in ('5m','10m'):
              hz=r['horizons'][h]
              assert hz['samples'] > 0
              assert 'baseline' in hz and 'models' in hz and 'ensemble' in hz
          print('research artifact validation: OK')
          PY
      - name: Run exhaustive feature-family pattern screen
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_feature_pattern_exhaustive.py
          python src/feature_pattern_exhaustive.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/feature_pattern_exhaustive.json')
          o=json.loads(p.read_text(encoding='utf-8'))
          if o.get('research_only') is not True or o.get('production_changed') is not False:
              raise SystemExit('feature pattern screen must remain research-only')
          if o.get('status') != 'COMPLETE' or o.get('pattern_count_expected') != 511:
              raise SystemExit(f"exhaustive feature pattern screen incomplete: {o.get('status')}")
          for h in ('5m','10m'):
              hz=o.get('horizons',{}).get(h,{})
              if hz.get('status') != 'COMPLETE' or hz.get('patterns_completed') != 511:
                  raise SystemExit(f"{h}: exhaustive feature pattern screen incomplete: {hz.get('patterns_completed')}/255")
              if len(hz.get('all_patterns',[])) != 511:
                  raise SystemExit(f"{h}: all pattern records were not materialized")
          print('exhaustive feature-family pattern screen: COMPLETE')
          PY

      - name: Reject raw archive files in Git workspace
        run: |
          if find data/historical_research -type f \( -name '*.zip' -o -name '*.CHECKSUM' -o -name '*.sha256' \) -print -quit | grep -q .; then exit 1; fi
      - name: Commit historical research results with conflict-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Keep large reproducibility caches and the derived aligned panel in
          # Actions artifacts/cache rather than the Git repository. This avoids
          # repository bloat and reduces state-writer conflict surface.
          git rm -r --cached --ignore-unmatch data/historical_research/cache data/historical_research/aligned_panel.csv
          git add data/historical_research/report.json data/historical_research/feature_frontier_oos.json data/historical_research/feature_pattern_exhaustive.json data/historical_research/oos_*.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update BTC historical research results'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push attempt ${attempt} rejected; rebuilding research state on origin/main"
            cp data/historical_research/report.json /tmp/btc_local_historical_report.json
            find data/historical_research -maxdepth 1 -type f -name 'oos_*.csv' -print0 | tar --null -T - -cf /tmp/btc_local_historical_oos.tar
            git rebase --abort 2>/dev/null || true
            . scripts/ci_network_retry.sh
            ci_git_fetch --prune origin main
            git reset --hard origin/main
            # Restore only files owned by this workflow. Never replace the
            # complete historical_research directory, because parallel
            # research lanes may have newer evidence.
            cp /tmp/btc_local_historical_report.json data/historical_research/report.json
            if [ -s /tmp/btc_local_historical_oos.tar ]; then
              tar -xf /tmp/btc_local_historical_oos.tar -C data/historical_research
            fi
            git rm -r --cached --ignore-unmatch data/historical_research/cache data/historical_research/aligned_panel.csv
            git add data/historical_research/report.json data/historical_research/feature_pattern_exhaustive.json data/historical_research/oos_*.csv
            git diff --cached --quiet || git commit -m 'Merge BTC historical research state safely'
            sleep $((5 * attempt))
          done
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: btc-historical-research
          path: |
            data/historical_research/report.json
            data/historical_research/research_health.json
            data/historical_research/production_artifact_audit.json
            data/historical_research/venue_drift.json
            data/historical_research/feature_frontier_oos.json
            data/historical_research/feature_pattern_exhaustive.json
          if-no-files-found: error
          retention-days: 3