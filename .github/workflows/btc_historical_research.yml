name: BTC Historical Research

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: btc-historical-research
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install research dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            sleep $((10 * attempt))
          done
          exit 1
      - name: Compile research code
        run: python -m compileall -q src tests
      - name: Run deterministic BTC guard tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          count = suite.countTestCases()
          print(f'Discovered BTC guard tests: {count}')
          if count == 0:
              raise SystemExit('No BTC guard tests were discovered; refusing to continue.')
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run existing BTC historical research engine
        run: python src/historical_research.py
      - name: Validate historical research report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/summary.json')
          if not p.exists():
              raise SystemExit('historical research summary missing')
          obj=json.loads(p.read_text())
          if not isinstance(obj, dict):
              raise SystemExit('historical research summary malformed')
          print('Historical research report validation: OK')
          PY
      - name: Upload historical research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btc-historical-research
          path: data/historical_research/**
          retention-days: 30
      - name: Commit historical research state with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/historical_research
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update BTC historical research'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --prune origin main
            git rebase origin/main
            sleep $((5 * attempt))
          done
          exit 1
