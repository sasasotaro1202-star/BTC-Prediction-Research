name: BTC Historical Research

on:
  schedule:
    - cron: '17 1 * * *'
  push:
    paths:
      - 'src/historical_research.py'
      - 'src/historical_research_runner.py'
      - '.github/workflows/btc_historical_research.yml'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: btc-historical-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all research code
        run: python -m compileall -q src
      - name: Run historical walk-forward research
        run: python src/historical_research_runner.py
      - name: Validate research artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/report.json')
          if not p.exists():
              raise SystemExit('report.json was not produced')
          r=json.loads(p.read_text())
          assert r.get('protocol_version') == 'historical-v6-microstructure-incremental-cache'
          assert set(r.get('horizons', {})) >= {'5m','10m'}
          for h in ('5m','10m'):
              hz=r['horizons'][h]
              assert hz['samples'] > 0
              assert 'baseline' in hz and 'models' in hz and 'ensemble' in hz
          print('research artifact validation: OK')
          PY
      - name: Commit historical research results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/historical_research
          if git diff --cached --quiet; then
            echo 'No historical research changes to commit.'
          else
            git commit -m 'Update BTC historical research results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: btc-historical-research
          path: data/historical_research
