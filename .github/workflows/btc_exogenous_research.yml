name: BTC Exogenous Research

# Research-only news ingestion. It must never write production prediction
# state or production model artifacts.
on:
  push:
    paths:
      - 'src/exogenous_information.py'
      - 'src/exogenous_feature_join.py'
      - 'tests/test_exogenous_information.py'
      - 'tests/test_exogenous_feature_join.py'
      - 'scripts/gdelt_exogenous_research.py'
      - 'tests/test_gdelt_exogenous_research.py'
      - 'scripts/exogenous_oos_ablation.py'
      - '.github/workflows/btc_exogenous_research.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: btc-exogenous-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit test exogenous collector
        run: python -m pytest -q tests/test_exogenous_information.py tests/test_exogenous_feature_join.py tests/test_gdelt_exogenous_research.py
      - name: Collect recent GDELT research events
        run: python scripts/gdelt_exogenous_research.py --hours 1
      - name: Run research-only exogenous OOS ablation
        run: python scripts/exogenous_oos_ablation.py
      - name: Validate research-only manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/exogenous/gdelt_events.manifest.json')
          if not p.exists(): raise SystemExit('GDELT manifest missing')
          m=json.loads(p.read_text())
          if m.get('schema_version') != 1: raise SystemExit('manifest schema mismatch')
          if m.get('source') != 'GDELT_GKG': raise SystemExit('manifest source mismatch')
          if m.get('research_only') is not True: raise SystemExit('not research-only')
          if m.get('production_changed') is not False: raise SystemExit('production mutation flag is not false')
          if m.get('final_holdout_protected') is not True: raise SystemExit('holdout protection flag missing')
          if int(m.get('slices_attempted',0)) <= 0: raise SystemExit('no slices attempted')
          if m.get('complete') is not True: raise SystemExit('GDELT collection incomplete; refusing partial research input')
          print('GDELT exogenous research manifest: OK')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: btc-exogenous-research
          path: data/exogenous
          retention-days: 14
