name: BTC Time Context Correction OOS

on:
  pull_request:
    paths:
      - 'src/time_context_correction_oos.py'
      - 'tests/test_time_context_correction_oos.py'
      - '.github/workflows/btc_time_context_correction_oos.yml'
      - 'src/model_compare.py'
      - 'src/bootstrap_train.py'
      - 'models/5m.joblib'
      - 'models/10m.joblib'
      - 'models/5m.json'
      - 'models/10m.json'
  workflow_dispatch:

concurrency:
  group: btc-time-context-correction
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_time_context_correction_oos.py
      - name: Run chronological OOS
        run: |
          set -euo pipefail
          python src/time_context_correction_oos.py
          test -s data/historical_research/time_context_correction_oos.json
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('data/historical_research/time_context_correction_oos.json').read_text())
          assert o['research_only'] is True
          assert o['production_changed'] is False
          assert o['promotion_evidence_eligible'] is False
          for h,v in o['horizons'].items():
              assert v['final_holdout']['protected'] is True
              assert v['final_holdout']['used_for_selection'] is False
          print('time-context evidence contract verified')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: btc-time-context-correction-oos
          path: data/historical_research/time_context_correction_oos.json
          if-no-files-found: error
          retention-days: 7
