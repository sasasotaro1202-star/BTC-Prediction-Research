name: BTC High Disagreement Soft OOS

on:
  pull_request:
    paths:
      - 'src/high_disagreement_soft_oos.py'
      - 'tests/test_high_disagreement_soft_oos.py'
      - 'src/model_compare.py'
      - '.github/workflows/btc_high_disagreement_soft_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-high-disagreement-soft-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_high_disagreement_soft_oos.py
      - name: Run chronological OOS
        run: |
          set -euo pipefail
          python src/high_disagreement_soft_oos.py
          test -s data/historical_research/high_disagreement_soft_oos.json
      - name: Validate research evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/high_disagreement_soft_oos.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          assert obj.get("schema_version") == 1
          assert obj.get("research_only") is True
          assert obj.get("production_changed") is False
          assert all(obj["horizons"][h].get("promotion_allowed", False) is False for h in ("5m","10m"))
          print("high-disagreement soft OOS evidence contract verified")
          PY
      - name: Upload evidence
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-high-disagreement-soft-\${{ github.run_id }}
          path: data/historical_research/high_disagreement_soft_oos.json
          if-no-files-found: error
          retention-days: 7
