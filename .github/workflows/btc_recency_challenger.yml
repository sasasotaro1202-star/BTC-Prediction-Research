name: BTC Recency Challenger

on:
  push:
    branches: [main]
    paths:
      - 'src/recency_challenger.py'
      - '.github/workflows/btc_recency_challenger.yml'
      - 'tests/test_recency_challenger.py'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: btc-recency-challenger
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Validate main lineage before expensive research
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
          changed_files="$(gh api "repos/${{ github.repository }}/compare/${GITHUB_SHA}...${remote_sha}" --jq '.files[]?.filename')"
          state_only=true
          while IFS= read -r changed; do
            [ -n "$changed" ] || continue
            case "$changed" in
              data/*|models/*.json|models/*.joblib) ;;
              *)
                state_only=false
                echo "UNSAFE_MAIN_DRIFT_FILE=$changed" >&2
                ;;
            esac
          done <<< "$changed_files"
          if [ "$remote_sha" != "${GITHUB_SHA}" ] && [ "$state_only" != true ]; then
            echo "UNSAFE_MAIN_RUN expected=${remote_sha} actual=${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "MAIN_LINEAGE_OK run=${GITHUB_SHA} main=${remote_sha} state_only_drift=${state_only}"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            sleep $((15 * attempt))
          done
          exit 1

      - name: Compile challenger
        run: python -m compileall -q src tests

      - name: Run challenger
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "=== recency challenger attempt ${attempt}/3 ==="
            if python -m src.recency_challenger; then exit 0; fi
            [ "${attempt}" -lt 3 ] && sleep $((30 * attempt))
          done
          exit 1

      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/historical_research/recency_challenger.json")
          if not p.is_file(): raise SystemExit("recency report missing")
          o = json.loads(p.read_text(encoding="utf-8"))
          assert o["schema_version"] == 1
          assert o["research_only"] is True
          assert o["production_changed"] is False
          assert o["promotion_evidence_eligible"] is False
          assert o["promotion_allowed"] is False
          assert o["pit_status"] == "UNVERIFIABLE_HISTORICAL_AVAILABILITY"
          assert o["validation_selection_policy"] == "equal_rank_accuracy_logloss_brier"
          for h, r in o["horizons"].items():
              assert r["selected_model"]
              assert r["accuracy_first_selected_model"]
          assert o["analysis_git_sha"] and o["analysis_git_sha"] != "LOCAL_UNPINNED"
          assert set(o["horizons"]) == {"5m", "10m"}
          for h, r in o["horizons"].items():
              assert r["frozen_holdout_n"] == 5000
              assert r["frozen_holdout"]["recency_candidate"]["n"] == 5000
              assert r["frozen_holdout"]["current_champion"]["n"] == 5000
              assert "frequency_baseline" in r["frozen_holdout"]
          print("recency challenger artifact validation: OK")
          PY

      - name: Upload recency artifact
        uses: actions/upload-artifact@v6
        with:
          name: btc-recency-challenger
          path: data/historical_research/recency_challenger.json
          retention-days: 14
