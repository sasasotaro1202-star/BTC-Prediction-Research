name: BTC Prequential Reliability Routing OOS

on:
  pull_request:
    paths:
      - 'src/prequential_reliability_routing_oos.py'
      - 'tests/test_prequential_reliability_routing_oos.py'
      - 'src/model_compare.py'
      - '.github/workflows/btc_prequential_reliability_routing_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-prequential-routing-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_prequential_reliability_routing_oos.py

      - name: Run chronological prequential OOS
        run: |
          set -euo pipefail
          python src/prequential_reliability_routing_oos.py
          test -s data/historical_research/prequential_reliability_routing_oos.json

      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/historical_research/prequential_reliability_routing_oos.json")
          o = json.loads(path.read_text(encoding="utf-8"))
          assert o.get("schema_version") == 1
          assert o.get("research_only") is True
          assert o.get("production_changed") is False
          assert o.get("horizons")
          for horizon, result in o["horizons"].items():
              assert horizon in {"5m", "10m"}
              assert result.get("research_only") is True
              assert result.get("production_changed") is False
              assert result.get("promotion_evidence_eligible") is False
              assert result.get("final_holdout_protected") is True
          print("prequential routing OOS evidence contract verified")
          PY

      - name: Upload evidence
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-prequential-routing-\${{ github.run_id }}
          path: data/historical_research/prequential_reliability_routing_oos.json
          if-no-files-found: error
          retention-days: 7
