name: BTC Archive-to-Primary Bridge OOS

on:
  push:
    branches: [main]
    paths:
      - 'src/archive_primary_bridge_oos.py'
      - 'tests/test_archive_primary_bridge_oos.py'
      - '.github/workflows/btc_archive_primary_bridge.yml'
  schedule:
    - cron: '43 */8 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/archive_primary_bridge_oos.py'
      - 'tests/test_archive_primary_bridge_oos.py'
      - '.github/workflows/btc_archive_primary_bridge.yml'

concurrency:
  group: btc-archive-primary-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python -c "from pathlib import Path; from src.state_archive import restore_db; restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))"
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          python -m unittest -q tests/test_archive_primary_bridge_oos.py
      - name: Run archive-to-primary bridge
        run: |
          set -euo pipefail
          python src/archive_primary_bridge_oos.py
          test -s data/historical_research/archive_primary_bridge_oos.json
      - name: Validate bridge evidence state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/historical_research/archive_primary_bridge_oos.json').read_text())
          if obj.get('research_only') is not True or obj.get('production_changed') is not False:
              raise SystemExit('bridge lane must remain research-only')
          for h,item in obj.get('horizons',{}).items():
              if item.get('status') == 'DEFERRED' and not item.get('reason'):
                  raise SystemExit(f'{h}: DEFERRED without reason')
              if item.get('status') == 'OK':
                  if item.get('external_strict_primary_test') is not True:
                      raise SystemExit(f'{h}: external strict-primary flag missing')
                  if item.get('final_holdout_protected') is not True:
                      raise SystemExit(f'{h}: final holdout protection missing')
          print('archive-to-primary bridge evidence: VERIFIED')
          PY
      - name: Upload bridge evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-archive-primary-bridge
          path: data/historical_research/archive_primary_bridge_oos.json
          retention-days: 7
