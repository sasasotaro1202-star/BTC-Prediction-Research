name: BTC Risk Conditional Rescue OOS

on:
  schedule:
    - cron: '42 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/risk_conditional_rescue_oos.py'
      - 'tests/test_risk_conditional_rescue_oos.py'
      - '.github/workflows/btc_risk_conditional_rescue_oos.yml'

concurrency:
  group: btc-risk-conditional-rescue
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_risk_conditional_rescue_oos.py
      - name: Run chronological rescue OOS
        run: |
          set -euo pipefail
          python src/risk_conditional_rescue_oos.py
          test -s data/historical_research/risk_conditional_rescue_oos.json
      - name: Validate research contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('data/historical_research/risk_conditional_rescue_oos.json').read_text())
          assert o['research_only'] is True
          assert o['production_changed'] is False
          assert o['promotion_evidence_eligible'] is False
          for h,v in o['horizons'].items():
              assert v['final_holdout']['protected'] is True
          print('risk conditional rescue contract: VERIFIED')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: btc-risk-conditional-rescue
          path: data/historical_research/risk_conditional_rescue_oos.json
          if-no-files-found: error
          retention-days: 7
