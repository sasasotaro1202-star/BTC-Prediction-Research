name: BTC Ultimate Final V13 — Maximum Future-Generalization E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/v13_e2e_trigger'

concurrency:
  group: btc-ultimate-final-v13-e2e
  # V13 is a current-head verification lane; stale queued SHAs have no promotion value.
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Refuse stale verification SHA
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA:-}" || { echo "GITHUB_SHA missing; refusing verification" >&2; exit 1; }
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main_sha" || { echo "Unable to resolve current main SHA; refusing verification" >&2; exit 1; }
          if [ "$current_main_sha" != "$GITHUB_SHA" ]; then
            echo "STALE V13 VERIFICATION: workflow_sha=$GITHUB_SHA current_main=$current_main_sha" >&2
            exit 1
          fi
          echo "V13 verification SHA is current: $GITHUB_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install free dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Record V13 run start
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/historical_research/btc_ultimate_final_v13_run.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          payload={
              "schema_version":1,
              "experiment":"btc_ultimate_final_v13_e2e",
              "status":"RUNNING",
              "run_id":os.environ.get("GITHUB_RUN_ID",""),
              "commit":os.environ.get("GITHUB_SHA",""),
              "started_at_utc":datetime.now(timezone.utc).isoformat(),
          }
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/historical_research/btc_ultimate_final_v13_run.json
          git commit -m 'Record V13 E2E run start'
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main && git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
            git reset --hard origin/main
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/historical_research/btc_ultimate_final_v13_run.json')
          payload={
              "schema_version":1,
              "experiment":"btc_ultimate_final_v13_e2e",
              "status":"RUNNING",
              "run_id":os.environ.get("GITHUB_RUN_ID",""),
              "commit":os.environ.get("GITHUB_SHA",""),
              "started_at_utc":datetime.now(timezone.utc).isoformat(),
          }
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
            git add data/historical_research/btc_ultimate_final_v13_run.json
            if ! git diff --cached --quiet; then git commit -m 'Record V13 E2E run start'; fi
            sleep $((2 * attempt))
          done
          exit 1


      - name: Preflight compile and full tests
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python -m compileall -q src scripts tests
          PYTHONPATH=src:. python -m pytest -q tests

      - name: Restore prediction database
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          PYTHONPATH=src:. python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          PY
          test -s data/predictions.db
      - name: Run V13 core — V6 future-generalization controller
        run: |
          set -euo pipefail
          rm -f data/historical_research/maximum_future_generalization_v6_registry.json
          PYTHONPATH=src:. python src/maximum_future_generalization_v6.py
          test -s data/historical_research/maximum_future_generalization_v6_registry.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/maximum_future_generalization_v6_registry.json')
          obj=json.loads(p.read_text())
          if obj.get('research_only') is not True or obj.get('production_changed') is not False:
              raise SystemExit('V13 core production-safety contract failed')
          horizons=obj.get('horizons',{})
          if set(horizons) != {'5m','10m'}:
              raise SystemExit(f'incomplete V13 horizons: {sorted(horizons)}')
          for h in ('5m','10m'):
              r=horizons[h]
              if r.get('status') != 'OK':
                  raise SystemExit(f'{h}: core OOS status={r.get("status")} reason={r.get("reason","")}')
          print('V13 core: BOTH horizons OK')
          PY

      - name: Run V13 prediction policy controller
        run: |
          set -euo pipefail
          rm -f data/historical_research/prediction_policy_oos.json
          PYTHONPATH=src:. python src/prediction_policy_oos.py
          test -s data/historical_research/prediction_policy_oos.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/historical_research/prediction_policy_oos.json').read_text())
          if obj.get('research_only') is not True or obj.get('production_changed') is not False:
              raise SystemExit('V13 policy production-safety contract failed')
          if obj.get('status') != 'IMPLEMENTED_EXECUTED_RESEARCH_ONLY':
              raise SystemExit(f'unexpected V13 policy status: {obj.get("status")}')
          print('V13 policy controller: EXECUTED / research-only')
          PY

      - name: Run PIT and leakage audits independently
        id: safety_audits
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:. python src/pit_oos_audit.py
          pit_status=$?
          PYTHONPATH=src:. python src/research_input_audit.py
          leakage_status=$?
          set -e
          python - <<PY
          import json
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "pit_exit_code": int(${pit_status}),
              "leakage_exit_code": int(${leakage_status}),
              "fail_closed": True,
          }
          p=Path("data/historical_research/v13_safety_audit_exit_codes.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(payload, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          print(json.dumps(payload, sort_keys=True))
          PY
          # Preserve every audit result; the explicit final safety gate below
          # converts any non-zero audit code into the workflow failure state.
          exit 0

      - name: Production artifact integrity audit
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python src/production_artifact_audit.py
          test -s data/historical_research/production_artifact_audit.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/historical_research/production_artifact_audit.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          provenance = payload.get("provenance") or {}
          expected = os.environ.get("GITHUB_SHA")
          if not expected:
              raise SystemExit("GITHUB_SHA missing during production artifact audit")
          if provenance.get("git_sha") != expected:
              raise SystemExit(
                  f"production artifact audit SHA mismatch: expected={expected} "
                  f"actual={provenance.get('git_sha')}"
              )
          if provenance.get("checkout_sha") != expected:
              raise SystemExit(
                  f"production artifact checkout SHA mismatch: expected={expected} "
                  f"actual={provenance.get('checkout_sha')}"
              )
          workspace_sha = provenance.get("workspace_sha")
          if not isinstance(workspace_sha, str) or len(workspace_sha) != 40:
              raise SystemExit("production artifact workspace SHA is invalid")
          if provenance.get("workspace_derived_from_checkout_sha") is not True and workspace_sha != expected:
              raise SystemExit("production artifact workspace lineage is unverified")
          artifacts = payload.get("artifacts") or []
          if {item.get("horizon") for item in artifacts} != {"5m", "10m"}:
              raise SystemExit("production artifact audit missing primary horizon")
          if any(item.get("runtime_model_reload_ok") is not True for item in artifacts):
              raise SystemExit("production artifact runtime reload contract failed")
          if any(item.get("runtime_classes") != ["DOWN", "FLAT", "UP"] for item in artifacts):
              raise SystemExit("production artifact class contract failed")
          if any(item.get("runtime_feature_count") != 15 for item in artifacts):
              raise SystemExit("production artifact feature contract failed")
          policy_files = provenance.get("policy_files") or {}
          required_policy_files = {
              "PROJECT_INSTRUCTIONS.md",
              "docs/PROJECT_SOURCE.md",
              "requirements.txt",
          }
          if set(policy_files) != required_policy_files:
              raise SystemExit("production artifact policy provenance is incomplete")
          if any(
              not isinstance(value, str) or len(value) != 64
              or any(ch not in "0123456789abcdef" for ch in value.lower())
              for value in policy_files.values()
          ):
              raise SystemExit("production artifact policy hash contract failed")
          print("production artifact provenance/runtime contract: VERIFIED")
          PY

      - name: Validate artifacts, promotion HOLD, and evidence state
        if: always()
        run: |
          set -euo pipefail
          test -s data/historical_research/maximum_future_generalization_v6_registry.json
          test -s data/historical_research/prediction_policy_oos.json
          python -m json.tool data/historical_research/maximum_future_generalization_v6_registry.json >/dev/null
          python -m json.tool data/historical_research/prediction_policy_oos.json >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path('data/historical_research')
          obj=json.loads((root/'maximum_future_generalization_v6_registry.json').read_text())
          for h in ('5m','10m'):
              r=obj.get('horizons',{}).get(h,{})
              if r.get('status') != 'OK':
                  raise SystemExit(f'{h}: missing completed core evidence')
              if r.get('production_changed') is not False:
                  raise SystemExit(f'{h}: production mutation')
              if r.get('promotion',{}).get('decision') != 'HOLD':
                  raise SystemExit(f'{h}: unsafe promotion decision {r.get("promotion",{}).get("decision")}')
              p=r.get('prediction_policy_oos',{})
              if p.get('frozen_holdout_used_for_selection') is not False:
                  raise SystemExit(f'{h}: frozen holdout contamination')
          print('V13 artifact/promotion contract: VERIFIED / HOLD / production unchanged')
          PY

      - name: Final fail-closed V13 safety gate
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path('data/historical_research')
          failures=[]
          reg_path=root/'maximum_future_generalization_v6_registry.json'
          policy_path=root/'prediction_policy_oos.json'
          codes_path=root/'v13_safety_audit_exit_codes.json'
          artifact_path=root/'production_artifact_audit.json'
          if not reg_path.is_file():
              failures.append('missing_v13_core_registry')
          else:
              obj=json.loads(reg_path.read_text())
              if obj.get('production_changed') is not False:
                  failures.append('production_changed')
              horizons=obj.get('horizons',{})
              for h in ('5m','10m'):
                  r=horizons.get(h,{})
                  if r.get('status') != 'OK':
                      failures.append(f'{h}:core_status={r.get("status")}')
                  if r.get('promotion',{}).get('decision') != 'HOLD':
                      failures.append(f'{h}:promotion_not_hold')
                  if r.get('prediction_policy_oos',{}).get('frozen_holdout_used_for_selection') is not False:
                      failures.append(f'{h}:holdout_selection_contamination')
          if not artifact_path.is_file():
              failures.append('missing_production_artifact_audit')
          else:
              artifact=json.loads(artifact_path.read_text())
              provenance=artifact.get('provenance') or {}
              expected_sha=os.environ.get('GITHUB_SHA')
              if not expected_sha:
                  failures.append('missing_github_sha')
              else:
                  if provenance.get('git_sha') != expected_sha:
                      failures.append('production_artifact_git_sha_mismatch')
                  if provenance.get('checkout_sha') != expected_sha:
                      failures.append('production_artifact_checkout_sha_mismatch')
                  workspace_sha = provenance.get('workspace_sha')
                  if not isinstance(workspace_sha, str) or len(workspace_sha) != 40:
                      failures.append('production_artifact_workspace_sha_invalid')
                  if (
                      provenance.get('workspace_derived_from_checkout_sha') is not True
                      and workspace_sha != expected_sha
                  ):
                      failures.append('production_artifact_workspace_lineage_unverified')
              artifacts=artifact.get('artifacts') or []
              if {item.get('horizon') for item in artifacts} != {'5m','10m'}:
                  failures.append('production_artifact_horizons_incomplete')
              if any(item.get('runtime_model_reload_ok') is not True for item in artifacts):
                  failures.append('production_artifact_runtime_reload_failed')
              if any(item.get('runtime_classes') != ['DOWN','FLAT','UP'] for item in artifacts):
                  failures.append('production_artifact_class_contract_failed')
              if any(item.get('runtime_feature_count') != 15 for item in artifacts):
                  failures.append('production_artifact_feature_contract_failed')
              policy_files = provenance.get('policy_files') or {}
              required_policy_files = {
                  'PROJECT_INSTRUCTIONS.md',
                  'docs/PROJECT_SOURCE.md',
                  'requirements.txt',
              }
              if set(policy_files) != required_policy_files:
                  failures.append('production_artifact_policy_provenance_incomplete')
              if any(
                  not isinstance(value, str) or len(value) != 64
                  or any(ch not in '0123456789abcdef' for ch in value.lower())
                  for value in policy_files.values()
              ):
                  failures.append('production_artifact_policy_hash_contract_failed')
          if not policy_path.is_file():
              failures.append('missing_v13_policy_output')
          else:
              pobj=json.loads(policy_path.read_text())
              if pobj.get('status') != 'IMPLEMENTED_EXECUTED_RESEARCH_ONLY':
                  failures.append('policy_not_executed')
          if not codes_path.is_file():
              failures.append('missing_safety_audit_exit_codes')
          else:
              codes=json.loads(codes_path.read_text())
              if int(codes.get('pit_exit_code',1)) != 0:
                  failures.append(f'pit_audit_exit={codes.get("pit_exit_code")}')
              if int(codes.get('leakage_exit_code',1)) != 0:
                  failures.append(f'leakage_audit_exit={codes.get("leakage_exit_code")}')
          if failures:
              print('V13 FINAL SAFETY GATE: FAIL')
              print(json.dumps(failures, indent=2))
              raise SystemExit(1)
          print('V13 FINAL SAFETY GATE: PASS / research-only / production unchanged')
          PY

      - name: Generate V13 E2E report
        if: always()
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/historical_research')
          reg=json.loads((root/'maximum_future_generalization_v6_registry.json').read_text()) if (root/'maximum_future_generalization_v6_registry.json').exists() else {}
          policy=json.loads((root/'prediction_policy_oos.json').read_text()) if (root/'prediction_policy_oos.json').exists() else {}
          lines=['# BTC Ultimate Final V13 E2E','',f"Generated: {reg.get('generated_at_utc','UNAVAILABLE')}","Production changed: false",""]
          for h in ('5m','10m'):
              r=reg.get('horizons',{}).get(h,{})
              lines += [f'## {h}', f"Core status: {r.get('status')}", f"Core reason: {r.get('reason','') or 'OK'}"]
              if r.get('status')=='OK':
                  d=r.get('deltas_vs_soft',{})
                  lines += [
                      f"Accuracy Δ: {d.get('accuracy')}",
                      f"LogLoss Δ: {d.get('logloss')}",
                      f"Brier Δ: {d.get('brier')}",
                      f"ECE Δ: {d.get('ece')}",
                      f"Predictability: {r.get('predictability',{})}",
                      f"Future failure: {r.get('failure_monitoring',{}).get('latest_failure_risk')}",
                      f"Time-to-failure: {r.get('failure_monitoring',{}).get('latest_failure_risk',{}).get('expected_time_to_failure_blocks')}",
                      f"Regime transition: {r.get('regime_transition',{})}",
                      f"Retrieval: {r.get('retrieval',{})}",
                      f"Uncertainty: {r.get('uncertainty',{})}",
                      f"Robustness: {r.get('robustness',{})}",
                      f"Promotion: {r.get('promotion',{})}",
                      ''
                  ]
          codes=(json.loads((root/'v13_safety_audit_exit_codes.json').read_text()) if (root/'v13_safety_audit_exit_codes.json').exists() else {})
          lines += ['## V13 Policy', f"Status: {policy.get('status')}", f"OOS policy value status: {policy.get('oos_policy_value_status')}", f"PIT audit exit: {codes.get('pit_exit_code','UNAVAILABLE')}", f"Leakage audit exit: {codes.get('leakage_exit_code','UNAVAILABLE')}"]
          (root/'btc_ultimate_final_v13_e2e_report.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          test -s data/historical_research/btc_ultimate_final_v13_e2e_report.md

      - name: Upload V13 E2E evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-ultimate-final-v13-e2e
          path: |
            data/historical_research/maximum_future_generalization_v6_registry.json
            data/historical_research/maximum_future_generalization_*.json
            data/historical_research/prediction_policy_oos.json
            data/historical_research/production_artifact_audit.json
            data/historical_research/pit_oos_audit.json
            data/historical_research/research_input_audit.json
            data/historical_research/btc_ultimate_final_v13_e2e_report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Record V13 run completion
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/historical_research/btc_ultimate_final_v13_run.json')
          payload=json.loads(p.read_text(encoding='utf-8')) if p.is_file() else {}
          payload.update({
              "status":os.environ.get("JOB_STATUS","unknown").upper(),
              "completed_at_utc":datetime.now(timezone.utc).isoformat(),
              "run_id":os.environ.get("GITHUB_RUN_ID",""),
              "commit":os.environ.get("GITHUB_SHA","")
          })
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/historical_research/btc_ultimate_final_v13_run.json
          if [ -s data/historical_research/production_artifact_audit.json ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('data/historical_research/production_artifact_audit.json')
          try:
              payload = json.loads(path.read_text(encoding='utf-8'))
          except (OSError, ValueError, TypeError):
              payload = {}
          provenance = payload.get('provenance') or {}
          expected = os.environ.get('GITHUB_SHA')
          artifacts = payload.get('artifacts') or []
          persistable = (
              bool(expected)
              and provenance.get('git_sha') == expected
              and provenance.get('checkout_sha') == expected
              and isinstance(provenance.get('workspace_sha'), str)
              and len(provenance.get('workspace_sha')) == 40
              and (
                  provenance.get('workspace_derived_from_checkout_sha') is True
                  or provenance.get('workspace_sha') == expected
              )
              and {item.get('horizon') for item in artifacts} == {'5m', '10m'}
              and all(item.get('runtime_model_reload_ok') is True for item in artifacts)
              and all(item.get('runtime_classes') == ['DOWN', 'FLAT', 'UP'] for item in artifacts)
              and all(item.get('runtime_feature_count') == 15 for item in artifacts)
              and set((provenance.get('policy_files') or {})) == {
                  'PROJECT_INSTRUCTIONS.md',
                  'docs/PROJECT_SOURCE.md',
                  'requirements.txt',
              }
              and all(
                  isinstance(value, str) and len(value) == 64
                  and all(ch in '0123456789abcdef' for ch in value.lower())
                  for value in (provenance.get('policy_files') or {}).values()
              )
          )
          archive_dir = Path('data/historical_research/production_artifact_audit_by_sha')
          archive_path = archive_dir / f'{expected}.json' if expected else None
          if persistable and archive_path is not None:
              archive_dir.mkdir(parents=True, exist_ok=True)
              payload['archive'] = {
                  'schema_version': 1,
                  'audited_commit': expected,
                  'path': str(archive_path),
                  'binding': 'checkout_sha',
              }
              archive_path.write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + '\n',
                  encoding='utf-8',
              )
              print(f'Persisting immutable production artifact audit for audited SHA {expected}.')
              Path('/tmp/persist_production_artifact_audit').write_text(
                  str(archive_path), encoding='utf-8'
              )
          else:
              print('Skipping production artifact audit persistence because evidence is not fully bound to the audited workflow SHA.')
              Path('/tmp/persist_production_artifact_audit').write_text(
                  '', encoding='utf-8'
              )
          PY
            archive_path="$(cat /tmp/persist_production_artifact_audit)"
            if [ -n "$archive_path" ]; then
              git add "$archive_path"
            fi
          fi
          if ! git diff --cached --quiet; then git commit -m 'Record V13 E2E run completion'; fi
          # Research outputs are intentionally left as uncommitted working-tree
          # evidence. Stash them before rebasing the immutable run ledger so
          # concurrent research commits cannot make rebase fail with unstaged
          # changes.
          git stash push --include-untracked --message 'v13-runtime-artifacts' >/dev/null
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main && git rebase origin/main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort; fi
            git reset --hard origin/main
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/historical_research/btc_ultimate_final_v13_run.json')
          payload={
              "schema_version":1,
              "experiment":"btc_ultimate_final_v13_e2e",
              "status":os.environ.get("JOB_STATUS","unknown").upper(),
              "run_id":os.environ.get("GITHUB_RUN_ID",""),
              "commit":os.environ.get("GITHUB_SHA",""),
              "completed_at_utc":datetime.now(timezone.utc).isoformat(),
          }
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
            git add data/historical_research/btc_ultimate_final_v13_run.json
            if ! git diff --cached --quiet; then git commit -m 'Record V13 E2E run completion'; fi
            sleep $((2 * attempt))
          done
          if [ "$pushed" -ne 1 ]; then exit 1; fi
