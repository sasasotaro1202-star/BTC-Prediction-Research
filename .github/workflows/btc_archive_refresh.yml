name: BTC Archive Refresh Research

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/archive_refresh_oos.py'
      - 'src/binance_history.py'
      - 'src/bootstrap_train.py'
      - 'src/label_policy.py'
      - 'tests/test_archive_refresh_oos.py'
      - 'requirements.txt'

concurrency:
  group: btc-archive-refresh
  cancel-in-progress: true

concurrency:
  group: btc-aux-research-admission
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest tests.test_archive_refresh_oos -v
      - name: Run fresh archive Champion comparison
        run: |
          set -euo pipefail
          python src/archive_refresh_oos.py
          test -s data/historical_research/archive_refresh_oos.json
      - name: Validate research-only evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/historical_research/archive_refresh_oos.json")
          obj=json.loads(p.read_text())
          if obj.get("research_only") is not True or obj.get("production_changed") is not False:
              raise SystemExit("archive refresh must remain research-only")
          for h in ("5m","10m"):
              hz=obj.get("horizons",{}).get(h,{})
              if hz.get("final_holdout_protected") is not True:
                  raise SystemExit(f"{h}: final holdout not protected")
          print("archive refresh evidence: VERIFIED")
          PY
      - name: Upload archive refresh evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-archive-refresh
          path: data/historical_research/archive_refresh_oos.json
          retention-days: 7
