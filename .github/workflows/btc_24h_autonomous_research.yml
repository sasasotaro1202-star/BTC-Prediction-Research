name: BTC 24H Autonomous Research

# Research-only 24H marathon modeled after the project's other long-running
# prediction systems: sequential restartable stages, checkpoint artifacts,
# non-cancelling concurrency, and a separate reliability watchdog.
#
# Each job stays below the GitHub-hosted runner's 6-hour limit.
# The full workflow envelope is below 24 hours.
#
# A daily schedule is intentional: if a previous run is still active, the next
# run queues. The watchdog prevents missed/failed/stuck runs from creating gaps.

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-24h-autonomous-research-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  stage1_maximum:
    name: "24H Stage 1 - Maximum Future Generalization"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore prediction state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path("data/predictions.db.gz"), Path("data/predictions.db"))
          PY
      - name: Snapshot production boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from src.prediction_state_guard import prediction_table_fingerprint
          with sqlite3.connect("data/predictions.db") as con:
              registry={h:(con.execute("SELECT production_version FROM model_registry WHERE horizon=?",(h,)).fetchone() or [None])[0] for h in ("5m","10m")}
          Path("/tmp/btc24_before.json").write_text(json.dumps({"registry":registry,"prediction_fingerprint":prediction_table_fingerprint(Path("data/predictions.db"))},sort_keys=True),encoding="utf-8")
          PY
      - name: Compile research code
        run: python -m compileall -q src scripts tests
      - name: Remove stale stage 1 evidence
        run: |
          set -euo pipefail
          rm -f data/historical_research/maximum_future_generalization_v6_registry.json
      - name: Run maximum future-generalization research
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60 330m python src/maximum_future_generalization_v6.py
          test -s data/historical_research/maximum_future_generalization_v6_registry.json
      - name: Verify research-only boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from src.prediction_state_guard import prediction_table_fingerprint
          obj=json.loads(Path("data/historical_research/maximum_future_generalization_v6_registry.json").read_text())
          if obj.get("research_only") is not True or obj.get("production_changed") is True:
              raise SystemExit("stage 1 research safety contract failed")
          before=json.loads(Path("/tmp/btc24_before.json").read_text())
          with sqlite3.connect("data/predictions.db") as con:
              after={h:(con.execute("SELECT production_version FROM model_registry WHERE horizon=?",(h,)).fetchone() or [None])[0] for h in ("5m","10m")}
          if before["prediction_fingerprint"] != prediction_table_fingerprint(Path("data/predictions.db")) or before["registry"] != after:
              raise SystemExit("production state mutated during stage 1")
          print("stage 1 production boundary: VERIFIED")
          PY
      - name: Preserve stage 1 boundary snapshot
        if: always()
        run: |
          set -euo pipefail
          cp /tmp/btc24_before.json data/historical_research/24h_stage1_before.json
      - name: Write success-only stage 1 checkpoint
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "stage": "stage1_maximum",
              "status": "SUCCESS",
              "research_only": True,
              "production_changed": False,
              "run_id": int(os.environ["RUN_ID"]),
              "sha": os.environ["SHA"],
          }
          Path("data/historical_research/stage1_success_checkpoint.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload stage 1 checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-24h-stage-1-${{ github.run_id }}
          path: |
            data/historical_research/maximum_future_generalization_v6_registry.json
            data/historical_research/24h_stage1_before.json
            data/historical_research/stage1_success_checkpoint.json
          if-no-files-found: warn
          retention-days: 14

  stage2_historical:
    name: "24H Stage 2 - Historical Walk-Forward"
    needs: stage1_maximum
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path("data/predictions.db.gz"), Path("data/predictions.db"))
          PY
      - name: Compile research code
        run: python -m compileall -q src scripts tests
      - name: Remove stale stage 2 evidence
        run: |
          set -euo pipefail
          rm -f data/historical_research/report.json
      - name: Run historical walk-forward research
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60 340m python scripts/historical_research_spot_fallback.py
          test -s data/historical_research/report.json
      - name: Verify historical evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/historical_research/report.json").read_text())
          for h in ("5m","10m"):
              if int(r.get("horizons",{}).get(h,{}).get("samples",0)) <= 0:
                  raise SystemExit(f"historical evidence incomplete: {h}")
          print("stage 2 historical evidence: VERIFIED")
          PY
      - name: Write success-only stage 2 checkpoint
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "stage": "stage2_historical",
              "status": "SUCCESS",
              "research_only": True,
              "production_changed": False,
              "run_id": int(os.environ["RUN_ID"]),
              "sha": os.environ["SHA"],
          }
          Path("data/historical_research/stage2_success_checkpoint.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload stage 2 checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-24h-stage-2-${{ github.run_id }}
          path: |
            data/historical_research/report.json
            data/historical_research/stage2_success_checkpoint.json
          if-no-files-found: warn
          retention-days: 14

  stage3_challenger:
    name: "24H Stage 3 - Rolling Challenger + Adaptive Ensemble"
    needs: stage2_historical
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path("data/predictions.db.gz"), Path("data/predictions.db"))
          PY
      - name: Compile research code
        run: python -m compileall -q src scripts tests
      - name: Remove stale stage 3 evidence
        run: |
          set -euo pipefail
          rm -f data/historical_research/rolling_challenger_oos.json
          rm -f data/historical_research/adaptive_ensemble_oos.json
      - name: Run rolling challenger
        env:
          ROLLING_MAX_ROWS: '3000'
          ROLLING_TEST_BLOCK: '100'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60 220m python src/rolling_challenger_oos.py
          test -s data/historical_research/rolling_challenger_oos.json
      - name: Run adaptive ensemble
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60 100m python src/adaptive_ensemble_oos.py
          test -s data/historical_research/adaptive_ensemble_oos.json
      - name: Verify research-only outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("rolling_challenger_oos.json","adaptive_ensemble_oos.json"):
              obj=json.loads((Path("data/historical_research")/name).read_text())
              if obj.get("research_only") is not True or obj.get("production_changed") is True:
                  raise SystemExit(f"research safety contract failed: {name}")
          print("stage 3 research boundary: VERIFIED")
          PY
      - name: Write success-only stage 3 checkpoint
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "stage": "stage3_challenger",
              "status": "SUCCESS",
              "research_only": True,
              "production_changed": False,
              "run_id": int(os.environ["RUN_ID"]),
              "sha": os.environ["SHA"],
          }
          Path("data/historical_research/stage3_success_checkpoint.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload stage 3 checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-24h-stage-3-${{ github.run_id }}
          path: |
            data/historical_research/rolling_challenger_oos.json
            data/historical_research/adaptive_ensemble_oos.json
            data/historical_research/stage3_success_checkpoint.json
          if-no-files-found: warn
          retention-days: 14

  stage4_robustness:
    name: "24H Stage 4 - Calibration + Uncertainty + Microstructure"
    needs: stage3_challenger
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path("data/predictions.db.gz"), Path("data/predictions.db"))
          PY
      - name: Compile research code
        run: python -m compileall -q src scripts tests
      - name: Remove stale stage 4 evidence
        run: |
          set -euo pipefail
          rm -f data/historical_research/calibration_frozen_replay_oos.json
          rm -f data/historical_research/uncertainty_layer_oos.json
          rm -f data/historical_research/microstructure_oos.json
      - name: Run frozen calibration replay
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60 110m python src/calibration_frozen_replay_oos.py
          test -s data/historical_research/calibration_frozen_replay_oos.json
      - name: Run uncertainty layer
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60 100m python src/uncertainty_layer_oos.py
          test -s data/historical_research/uncertainty_layer_oos.json
      - name: Run microstructure OOS
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60 120m python src/microstructure_oos.py
          test -s data/historical_research/microstructure_oos.json
      - name: Verify research-only outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("calibration_frozen_replay_oos.json","uncertainty_layer_oos.json","microstructure_oos.json"):
              obj=json.loads((Path("data/historical_research")/name).read_text())
              if obj.get("research_only") is not True or obj.get("production_changed") is True:
                  raise SystemExit(f"research safety contract failed: {name}")
          print("stage 4 research boundary: VERIFIED")
          PY
      - name: Write success-only stage 4 checkpoint
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "stage": "stage4_robustness",
              "status": "SUCCESS",
              "research_only": True,
              "production_changed": False,
              "run_id": int(os.environ["RUN_ID"]),
              "sha": os.environ["SHA"],
          }
          Path("data/historical_research/stage4_success_checkpoint.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Download all stage checkpoints
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: btc-24h-stage-*-${{ github.run_id }}
          path: data/historical_research/24h_checkpoints
          merge-multiple: true
      - name: Write final 24H checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              "schema_version":1,
              "research_only":True,
              "production_changed":False,
              "github_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "github_sha":os.environ["GITHUB_SHA"],
              "stage_results":{
                  "stage1":"${{ needs.stage1_maximum.result }}",
                  "stage2":"${{ needs.stage2_historical.result }}",
                  "stage3":"${{ needs.stage3_challenger.result }}",
                  "stage4":"finalization-reached",
              },
          }
          p=Path("data/historical_research/24h_final_checkpoint.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,sort_keys=True))
          PY
      - name: Upload final checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-24h-final-${{ github.run_id }}
          path: |
            data/historical_research/calibration_frozen_replay_oos.json
            data/historical_research/uncertainty_layer_oos.json
            data/historical_research/microstructure_oos.json
            data/historical_research/24h_final_checkpoint.json
            data/historical_research/stage4_success_checkpoint.json
            data/historical_research/24h_checkpoints/**
          if-no-files-found: warn
          retention-days: 14
      # Stage results are enforced centrally by the finalize job after all
      # evidence/checkpoints are collected. This stage must not self-reference
      # needs.stage4_robustness.result while its own job is still running.
  finalize:
    name: "24H Final Evidence Reconciliation"
    needs: [stage1_maximum, stage2_historical, stage3_challenger, stage4_robustness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download available stage evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: btc-24h-stage-*
          path: data/historical_research/24h_reconcile/stages
          merge-multiple: true
      - name: Download final stage evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: btc-24h-final-*
          path: data/historical_research/24h_reconcile/final
          merge-multiple: true
      - name: Reconcile immutable 24H evidence
        if: always()
        env:
          S1: ${{ needs.stage1_maximum.result }}
          S2: ${{ needs.stage2_historical.result }}
          S3: ${{ needs.stage3_challenger.result }}
          S4: ${{ needs.stage4_robustness.result }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path("data/historical_research/24h_reconcile")
          files = sorted(p.as_posix() for p in root.rglob("*.json")) if root.exists() else []
          stages = {
              "stage1_maximum": os.environ["S1"],
              "stage2_historical": os.environ["S2"],
              "stage3_challenger": os.environ["S3"],
              "stage4_robustness": os.environ["S4"],
          }

          required_names = {
              "maximum_future_generalization_v6_registry.json",
              "report.json",
              "rolling_challenger_oos.json",
              "adaptive_ensemble_oos.json",
              "calibration_frozen_replay_oos.json",
              "uncertainty_layer_oos.json",
              "microstructure_oos.json",
              "24h_final_checkpoint.json",
              "24h_stage1_before.json",
              "stage1_success_checkpoint.json",
              "stage2_success_checkpoint.json",
              "stage3_success_checkpoint.json",
              "stage4_success_checkpoint.json",
          }
          present_names = {Path(f).name for f in files}
          missing = sorted(required_names - present_names)

          checkpoint_integrity_failures = []
          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          current_sha = os.environ["GITHUB_SHA"]
          checkpoint_expectations = {
              "stage1_success_checkpoint.json": "stage1_maximum",
              "stage2_success_checkpoint.json": "stage2_historical",
              "stage3_success_checkpoint.json": "stage3_challenger",
              "stage4_success_checkpoint.json": "stage4_robustness",
          }
          for checkpoint_name, expected_stage in checkpoint_expectations.items():
              checkpoint = root / checkpoint_name
              if not checkpoint.exists():
                  continue
              try:
                  obj = json.loads(checkpoint.read_text(encoding="utf-8"))
              except Exception as exc:
                  checkpoint_integrity_failures.append(f"{checkpoint.name}:invalid_json:{exc}")
                  continue
              if (
                  obj.get("schema_version") != 1
                  or obj.get("status") != "SUCCESS"
                  or obj.get("research_only") is not True
                  or obj.get("production_changed") is not False
                  or obj.get("stage") != expected_stage
                  or int(obj.get("run_id", -1)) != current_run_id
                  or obj.get("sha") != current_sha
              ):
                  checkpoint_integrity_failures.append(f"{checkpoint.name}:metadata_mismatch")

          safety_failures = []
          json_files = list(root.rglob("*.json")) if root.exists() else []
          for path in json_files:
              try:
                  obj = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if obj.get("production_changed") is True:
                  safety_failures.append(str(path))

          status = "COMPLETED" if (
              all(v == "success" for v in stages.values())
              and not missing
              and not checkpoint_integrity_failures
              and not safety_failures
          ) else "PARTIAL_OR_BLOCKED"
          payload = {
              "schema_version": 1,
              "status": status,
              "research_only": True,
              "production_changed": False,
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_sha": os.environ["GITHUB_SHA"],
              "stage_results": stages,
              "required_evidence_missing": missing,
              "checkpoint_integrity_failures": checkpoint_integrity_failures,
              "safety_claim_failures": safety_failures,
              "evidence_file_count": len(files),
          }
          out = root / "24h_run_status.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          if checkpoint_integrity_failures:
              raise SystemExit("success checkpoint metadata is not bound to this run")
          if safety_failures:
              raise SystemExit("research evidence reported production_changed=true")
          PY
      - name: Upload reconciled evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-24h-reconciled-${{ github.run_id }}
          path: data/historical_research/24h_reconcile/**
          if-no-files-found: error
          retention-days: 14
      - name: Enforce complete marathon evidence
        if: always()
        env:
          S1: ${{ needs.stage1_maximum.result }}
          S2: ${{ needs.stage2_historical.result }}
          S3: ${{ needs.stage3_challenger.result }}
          S4: ${{ needs.stage4_robustness.result }}
        run: |
          set -euo pipefail
          test "$S1" = success
          test "$S2" = success
          test "$S3" = success
          test "$S4" = success
