name: BTC Microstructure Research

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btc_microstructure_research.yml'
      - 'src/microstructure_features.py'
      - 'src/microstructure_oos.py'
      - 'tests/test_microstructure_features.py'
      - 'tests/test_microstructure_oos.py'

concurrency:
  group: btc-microstructure-research
  # Research is disposable: a newer protocol/code revision supersedes stale
  # evidence rather than allowing overlapping long runs.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  microstructure:
    name: Strict-PIT microstructure OOS
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          if [ -s data/predictions.db.gz ]; then
            python -c "from pathlib import Path; from src.state_archive import restore_db; restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))"
          else
            echo 'No canonical prediction state; research lane will remain DEFERRED.'
          fi
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          python -m pytest -q tests/test_microstructure_oos.py tests/test_microstructure_features.py
      - name: Run microstructure OOS
        run: |
          set -euo pipefail
          python src/microstructure_oos.py
          test -s data/historical_research/microstructure_oos.json
      - name: Validate research-only evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/microstructure_oos.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('research_only') is not True:
              raise SystemExit('microstructure research_only contract violated')
          if obj.get('production_changed') is not False:
              raise SystemExit('microstructure lane reports production mutation')
          if obj.get('final_holdout_protected') is not True:
              raise SystemExit('microstructure holdout protection missing')
          for h, result in obj.get('horizons', {}).items():
              for variant in ('binance_micro', 'market_flow_v2', 'cross_venue'):
                  item=result.get(variant,{})
                  if item.get('status') not in {'OK','DEFERRED'}:
                      raise SystemExit(f'{h}/{variant}: invalid status')
                  if item.get('status') == 'OK' and item.get('promotion_evidence_eligible') is not True:
                      raise SystemExit(f'{h}/{variant}: expected strict-primary promotion evidence flag')
          print('microstructure research evidence: VERIFIED')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: btc-microstructure-research
          path: data/historical_research/microstructure_oos.json
          retention-days: 14
