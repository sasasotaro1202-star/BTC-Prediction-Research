name: BTC Interaction Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

jobs:
  interaction-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run guard tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run interaction walk-forward research
        run: python src/interaction_oos.py
      - name: Validate research report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/interaction_oos_report.json')
          if not p.exists(): raise SystemExit('interaction report missing')
          obj=json.loads(p.read_text())
          if obj.get('research_only') is not True: raise SystemExit('research-only flag missing')
          if set(obj.get('horizons',{})) != {'5m','10m'}: raise SystemExit('5m/10m research results missing')
          print('BTC interaction research report validation: OK')
          PY
      - name: Commit research report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/historical_research/interaction_oos_report.json
          if git diff --cached --quiet; then
            echo 'No interaction research report changes.'
            exit 0
          fi
          git commit -m 'Update BTC interaction OOS research'
          git push origin HEAD:main
