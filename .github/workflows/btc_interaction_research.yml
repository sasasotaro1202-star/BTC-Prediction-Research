name: BTC Interaction Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/interaction_features.py'
      - 'src/interaction_oos.py'
      - 'src/selective_prediction.py'
      - 'tests/test_interaction_features.py'
      - 'tests/test_selective_prediction.py'
      - '.github/workflows/btc_interaction_research.yml'
      - 'src/bootstrap_train.py'
      - 'requirements.txt'
  schedule:
    - cron: '17 12 * * *'

# Research is intentionally read-only. Results are retained as workflow
# artifacts instead of being pushed to main, preventing state-writer races
# with the 5-minute production cycle.
permissions:
  contents: read

concurrency:
  group: btc-interaction-research
  cancel-in-progress: false

jobs:
  interaction-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run guard tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run interaction walk-forward research
        run: python src/interaction_oos.py
      - name: Record execution provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/historical_research/interaction_execution.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              'workflow':'BTC Interaction Research',
              'run_id':os.environ.get('GITHUB_RUN_ID'),
              'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'sha':os.environ.get('GITHUB_SHA'),
              'ref':os.environ.get('GITHUB_REF'),
              'event':os.environ.get('GITHUB_EVENT_NAME'),
          }, indent=2), encoding='utf-8')
          PY
      - name: Validate research report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/interaction_oos_report.json')
          if not p.exists(): raise SystemExit('interaction report missing')
          obj=json.loads(p.read_text())
          if obj.get('research_only') is not True: raise SystemExit('research-only flag missing')
          if set(obj.get('horizons',{})) != {'5m','10m'}: raise SystemExit('5m/10m research results missing')
          print('BTC interaction research report validation: OK')
          PY
      - name: Upload research evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-interaction-oos-${{ github.run_id }}
          path: |
            data/historical_research/interaction_oos_report.json
            data/historical_research/interaction_execution.json
          if-no-files-found: error
          retention-days: 30
