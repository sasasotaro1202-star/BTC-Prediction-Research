name: BTC Situation Benefit Gate 5m OOS

on:
  pull_request:
    paths:
      - 'src/historical_situation_meta_oos.py'
      - 'src/situation_benefit_gate_5m_oos.py'
      - 'tests/test_situation_benefit_gate_5m_oos.py'
      - 'src/situation.py'
      - 'src/model_compare.py'
      - 'requirements.txt'
      - '.github/workflows/btc_situation_benefit_gate_5m_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-situation-benefit-gate-5m-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_situation_benefit_gate_5m_oos.py
      - name: Run chronological gated OOS
        run: |
          set -euo pipefail
          python src/situation_benefit_gate_5m_oos.py
          test -s data/historical_research/situation_benefit_gate_5m_oos.json
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('data/historical_research/situation_benefit_gate_5m_oos.json').read_text())
          h=o['horizons']['5m']
          assert o['research_only'] is True
          assert o['production_changed'] is False
          assert o['promotion_evidence_eligible'] is False
          assert h['strict_pit'] is False
          assert h['final_holdout']['protected'] is True
          assert h['final_holdout']['used_for_selection'] is False
          assert h['gate']['strictly_prior_labels'] is True
          print('situation benefit gate evidence verified')
          PY
      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-situation-benefit-gate-5m-oos
          path: data/historical_research/situation_benefit_gate_5m_oos.json
          if-no-files-found: error
          retention-days: 7
