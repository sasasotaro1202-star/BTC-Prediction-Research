name: BTC Uncertainty Router OOS

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/btc_uncertainty_router_oos.yml'
  schedule:
    - cron: '37 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-uncertainty-router
  cancel-in-progress: true

jobs:
  uncertainty_router:
    name: Prequential uncertainty/disagreement router
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore prediction state
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          PY
          test -s data/predictions.db
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile research code
        run: python -m compileall -q src tests scripts
      - name: Run uncertainty router OOS
        run: |
          set -euo pipefail
          python src/uncertainty_router_oos.py
          test -s data/historical_research/uncertainty_router_oos.json
      - name: Validate research-only artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/historical_research/uncertainty_router_oos.json')
          obj = json.loads(path.read_text(encoding='utf-8'))
          assert obj.get('research_only') is True
          assert obj.get('production_changed') is False
          for horizon, payload in obj.get('horizons', {}).items():
              assert payload.get('final_holdout_used_for_selection') is False
              assert payload.get('strict_point_in_time_archive_replay') is False
              print(f'VERIFIED {horizon}: status={payload.get("status")}')
          PY
      - name: Upload uncertainty router evidence
        if: \${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: btc-uncertainty-router-\${{ github.run_id }}
          path: data/historical_research/uncertainty_router_oos.json
          if-no-files-found: error
          retention-days: 7
