name: BTC Live Cycle

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # Code/config changes should be exercised immediately. Research-state commits
  # from the live job are excluded so the job cannot self-trigger.
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'models/**'

concurrency:
  group: btc-live-cycle-main
  # Do not cancel a healthy 5-minute cycle if a new scheduled/push run arrives.
  # A cancellation can leave the production state half-written and appear as an
  # Action failure even when the underlying pipeline is healthy.
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install research dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            echo "pip install attempt ${attempt} failed"
            sleep $((10 * attempt))
          done
          exit 1
      - name: Compile research code
        run: python -m compileall -q src tests
      - name: Run deterministic BTC guard tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          count = suite.countTestCases()
          print(f'Discovered BTC guard tests: {count}')
          if count == 0:
              raise SystemExit('No BTC guard tests were discovered; refusing to continue.')
          PY
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure BTC production models exist without retraining every 5 minutes
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for horizon in 5m 10m; do
            if [ ! -s "models/${horizon}.joblib" ] || [ ! -s "models/${horizon}.json" ]; then missing=1; fi
          done
          if [ "${missing}" -eq 0 ]; then
            echo 'Existing BTC production models found; skipping historical bootstrap.'
            exit 0
          fi
          python src/bootstrap_train.py
      - name: Settle due BTC predictions
        run: python src/settle.py
      - name: Recalculate BTC calibration metrics
        run: python src/calibration.py
      - name: Recalibrate BTC live structural blend on chronological holdout
        run: python src/blend_calibration.py
      - name: Run BTC model comparison and adoption gate
        run: python src/model_compare.py
      - name: Generate next BTC prediction
        run: python src/predict.py
      - name: Run non-fatal BTC research health audit
        run: python src/research_health.py
      - name: Validate BTC prediction state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('data/predictions.db')
          if not p.exists() or p.stat().st_size == 0: raise SystemExit('predictions.db missing')
          with sqlite3.connect(p) as con:
              n=con.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]
              if n <= 0: raise SystemExit('predictions table is empty')
              for cols in [('p_up_5m','p_down_5m','p_flat_5m'),('p_up_10m','p_down_10m','p_flat_10m')]:
                  a,b,c=cols
                  bad=con.execute(f'SELECT COUNT(*) FROM predictions WHERE abs(({a}+{b}+{c})-1.0)>0.00001 OR {a}<0 OR {b}<0 OR {c}<0').fetchone()[0]
                  if bad: raise SystemExit(f'probability integrity failure {cols}: {bad}')
              latest=con.execute('SELECT created_at_utc,base_price,model_version,scenario_json FROM predictions ORDER BY prediction_id DESC LIMIT 1').fetchone()
              if not latest: raise SystemExit('latest prediction missing')
              created=datetime.fromisoformat(latest[0].replace('Z','+00:00'))
              age=(datetime.now(timezone.utc)-created).total_seconds()
              if age > 900: raise SystemExit(f'latest prediction is stale: {age:.0f}s')
              if age < -60: raise SystemExit(f'latest prediction timestamp is in the future: {age:.0f}s')
              scenario=json.loads(latest[3]) if latest[3] else {}
              degraded=(latest[2] == 'DEGRADED_NO_FRESH_DATA')
              if not degraded and latest[1] <= 0: raise SystemExit('latest BTC base price is invalid')
              if degraded and latest[1] != 0: raise SystemExit('degraded BTC prediction must not claim a market base price')
              if not degraded and not scenario.get('data_quality'):
                  raise SystemExit('live BTC prediction is missing data-quality metadata')
          for horizon in ('5m','10m'):
              mj=Path(f'models/{horizon}.json'); mf=Path(f'models/{horizon}.joblib')
              if mj.exists():
                  obj=json.loads(mj.read_text())
                  if obj.get('horizon') != horizon: raise SystemExit(f'{horizon} horizon mismatch')
                  if obj.get('artifact') != f'{horizon}.joblib': raise SystemExit(f'{horizon} artifact mismatch')
                  if obj.get('classes') and obj['classes'] != ['DOWN','FLAT','UP']: raise SystemExit(f'{horizon} class order mismatch')
                  if obj.get('features') and len(obj['features']) != 15: raise SystemExit(f'{horizon} feature count mismatch')
              if mj.exists() and not mf.exists(): raise SystemExit(f'{horizon} model artifact missing')
              cp=Path(f'models/{horizon}.calibration.json')
              if cp.exists():
                  obj=json.loads(cp.read_text()); t=float(obj.get('temperature',1.0)); n=int(obj.get('n_settled',0))
                  if not 0.5 <= t <= 3.0: raise SystemExit(f'{horizon} calibration temperature invalid: {t}')
                  if n < 0: raise SystemExit(f'{horizon} calibration count invalid: {n}')
              bp=Path(f'models/{horizon}.blend.json')
              if bp.exists():
                  obj=json.loads(bp.read_text()); w=float(obj.get('base_weight',0.20)); n=int(obj.get('n',0))
                  if not 0.0 <= w <= 0.45: raise SystemExit(f'{horizon} blend weight invalid: {w}')
                  if n < 0: raise SystemExit(f'{horizon} blend count invalid: {n}')
          health=Path('data/historical_research/research_health.json')
          if not health.exists(): raise SystemExit('research health audit output missing')
          health_obj=json.loads(health.read_text())
          if not isinstance(health_obj.get('ok'), bool): raise SystemExit('research health audit malformed')
          print('BTC prediction database, models, calibration, blend, and research-health validation: OK')
          PY
      - name: Upload BTC research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btc-predictions-db
          path: |
            data/predictions.db
            data/historical_research/**
            models/**
          retention-days: 14
      - name: Check repository diff before commit
        run: git diff --check
      - name: Commit BTC research state with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/predictions.db data/historical_research 2>/dev/null || true
          if [ -d models ]; then git add models; fi
          if git diff --cached --quiet; then echo 'No BTC research-state changes to commit.'; exit 0; fi
          git commit -m 'Update BTC research state'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "git push attempt ${attempt} failed; rebasing on origin/main"
            git fetch --prune origin main
            git rebase origin/main
            sleep $((5 * attempt))
          done
          exit 1
