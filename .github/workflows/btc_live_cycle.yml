name: BTC Live Cycle
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/btc_live_cycle.yml'
      - 'src/**'
      - 'requirements.txt'
      - 'data/**'
concurrency:
  group: btc-live-cycle
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Settle due predictions
        run: python src/settle.py
      - name: Generate next prediction
        run: python src/predict.py
      - name: Recalculate calibration metrics
        run: python src/calibration.py
      - name: Upload SQLite log
        uses: actions/upload-artifact@v4
        with:
          name: btc-predictions-db
          path: data/predictions.db
      - name: Commit research state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/predictions.db
          if git diff --cached --quiet; then
            echo 'No research-state changes to commit.'
          else
            git commit -m 'Update BTC prediction log'
            git push
          fi
