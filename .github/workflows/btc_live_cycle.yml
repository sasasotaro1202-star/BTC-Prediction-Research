name: BTC Live Cycle

# Production execution is schedule/manual only. Code pushes must not trigger
# a second state-writing live run and race the 5-minute scheduler.
on:
  schedule:
    # Offset the 5-minute cadence by one minute to reduce hourly-load contention
    # and reactivate the schedule if GitHub had disabled its previous schedule.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: btc-state-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Load latest Binance WebSocket cache from dedicated state branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          rm -f data/binance_ws_1m.json
          cache_loaded=false
          if git fetch --no-tags --depth=1 origin binance-ws-cache; then
            if git show origin/binance-ws-cache:data/binance_ws_1m.json > data/binance_ws_1m.json; then
              if python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/binance_ws_1m.json').read_text(encoding='utf-8'))
          if obj.get('schema_version') != 1 or obj.get('source') != 'Binance USD-M Futures WebSocket':
              raise SystemExit('invalid Binance WebSocket cache provenance')
          rows=obj.get('rows')
          if not isinstance(rows,list) or not rows:
              raise SystemExit('Binance WebSocket cache rows malformed_or_empty')
          required={'open_time_ms','open','high','low','close','volume','taker_buy_base','event_time_ms','retrieved_at_ms'}
          for row in rows:
              if not isinstance(row,dict) or not required.issubset(row):
                  raise SystemExit('Binance WebSocket cache row schema invalid')
          print(f'Loaded Binance WebSocket cache rows={len(rows)}')
          PY
              then
                cache_loaded=true
              else
                echo 'WARN: Binance WebSocket cache failed validation; ignoring optional cache.'
                rm -f data/binance_ws_1m.json
              fi
            else
              echo 'WARN: Binance WebSocket cache file unavailable; continuing without optional cache.'
            fi
          else
            echo 'WARN: Binance WebSocket cache branch unavailable; continuing without optional cache.'
          fi
          if [ "$cache_loaded" = false ]; then
            echo 'Binance WebSocket cache: unavailable/invalid; primary REST/inline WebSocket path remains authoritative.'
          fi

      - name: Self-heal stale Binance WS collector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache='data/binance_ws_1m.json'
          stale=false
          if [ -s "$cache" ]; then
            set +e
            cache_health="$(python - "$cache" <<'PY'
          import json, sys, time
          from pathlib import Path
          obj=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          rows=obj.get('rows', [])
          if not isinstance(rows, list) or not rows:
              print("rows=0 contiguous_suffix=0 retrieved_age_ms=-1 event_age_ms=-1")
              raise SystemExit(2)
          ordered=sorted(
              (row for row in rows if isinstance(row, dict)),
              key=lambda row:int(row.get('open_time_ms', 0)),
          )
          suffix=1 if ordered else 0
          for i in range(len(ordered)-1,0,-1):
              if int(ordered[i].get('open_time_ms',0))-int(ordered[i-1].get('open_time_ms',0)) != 60000:
                  break
              suffix += 1
          now_ms=int(time.time()*1000)
          latest=ordered[-1]
          retrieved_age=now_ms-int(latest.get('retrieved_at_ms',0))
          event_age=now_ms-int(latest.get('event_time_ms',latest.get('open_time_ms',0)))
          print(
              f"rows={len(ordered)} contiguous_suffix={suffix} "
              f"retrieved_age_ms={retrieved_age} event_age_ms={event_age}"
          )
          if suffix < 40 or retrieved_age < 0 or retrieved_age > 180000 or event_age < 0 or event_age > 180000:
              raise SystemExit(2)
          PY
            )"
            cache_health_status=$?
            set -e
            echo "Binance WS cache health before self-heal=${cache_health}" >&2
            if [ "$cache_health_status" -ne 0 ]; then
              echo 'Binance WS cache health check failed or found stale/gappy data; self-heal required.' >&2
              stale=true
            fi
          else
            echo 'Binance WS cache is absent before self-heal.' >&2
            stale=true
          fi

          if [ "$stale" != true ]; then
            echo 'Binance WS collector heartbeat is fresh; no self-heal dispatch needed.'
            exit 0
          fi

          set +e
          active_runs_json="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow btc_binance_ws_collector.yml \
            --limit 20 \
            --json databaseId,headSha,status 2>/tmp/btc_ws_gh_list.err)"
          list_status=$?
          set -e
          if [ "$list_status" -ne 0 ]; then
            cat /tmp/btc_ws_gh_list.err >&2
            echo 'WARN: could not inspect Binance WS collector runs; leaving live prediction policy unchanged.' >&2
            exit 0
          fi

          # Cancel only collector generations whose executable code differs from
          # the current main branch. Data/state-only commits keep the same code
          # blobs and therefore do not churn healthy collectors.
          set +e
          current_workflow_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/btc_binance_ws_collector.yml?ref=main" --jq '.sha' 2>/tmp/btc_ws_workflow_sha.err)"
          current_source_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/src/binance_ws.py?ref=main" --jq '.sha' 2>/tmp/btc_ws_source_sha.err)"
          code_status=$?
          set -e
          if [ "$code_status" -ne 0 ] || [ -z "$current_workflow_blob" ] || [ -z "$current_source_blob" ]; then
            cat /tmp/btc_ws_workflow_sha.err /tmp/btc_ws_source_sha.err >&2
            echo 'WARN: could not fingerprint current Binance collector code; preserving active collectors and continuing recovery.' >&2
          else
            while IFS=$'\t' read -r run_id run_sha run_status; do
              [ -n "$run_id" ] || continue
              [ "$run_status" = "queued" ] || [ "$run_status" = "in_progress" ] || continue

              set +e
              run_workflow_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/btc_binance_ws_collector.yml?ref=$run_sha" --jq '.sha' 2>/dev/null)"
              run_source_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/src/binance_ws.py?ref=$run_sha" --jq '.sha' 2>/dev/null)"
              set -e
              if [ -n "$run_workflow_blob" ] && [ -n "$run_source_blob" ] \
                && { [ "$run_workflow_blob" != "$current_workflow_blob" ] || [ "$run_source_blob" != "$current_source_blob" ]; }; then
                set +e
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
                cancel_status=$?
                set -e
                if [ "$cancel_status" -eq 0 ]; then
                  echo "Cancelled stale Binance WS collector generation run=${run_id} sha=${run_sha} because collector code differs from current main."
                else
                  echo "WARN: failed to cancel stale Binance WS collector generation run=${run_id} status=${cancel_status}." >&2
                fi
              fi
            done < <(printf '%s' "$active_runs_json" | jq -r '.[] | [.databaseId,.headSha,.status] | @tsv')
          fi

          set +e
          active="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow btc_binance_ws_collector.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length' 2>/tmp/btc_ws_gh_list2.err)"
          active_status=$?
          set -e
          if [ "$active_status" -ne 0 ]; then
            cat /tmp/btc_ws_gh_list2.err >&2
            echo 'WARN: could not recount Binance WS collector runs; leaving live prediction policy unchanged.' >&2
            exit 0
          fi

          # A stale cache with current-code collectors may still need one additional
          # recovery run. Avoid an unbounded dispatch storm when two collectors are active.
          if [ "${active:-0}" -ge 2 ]; then
            echo "Binance WS collector already has ${active} active current-code run(s); self-heal dispatch capped to avoid a recovery storm."
            exit 0
          fi

          set +e
          gh workflow run btc_binance_ws_collector.yml --repo "$GITHUB_REPOSITORY" --ref main
          dispatch_status=$?
          set -e
          if [ "$dispatch_status" -ne 0 ]; then
            echo "WARN: Binance WS collector self-heal dispatch failed with status ${dispatch_status}. Live prediction remains fail-closed on stale data." >&2
            exit 0
          fi
          echo 'Dispatched a Binance WS collector self-heal run because the persisted cache was stale.'


      - name: Load latest Binance depth cache from dedicated state branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/binance_ws_depth.json
          if git fetch --no-tags --depth=1 origin binance-ws-cache; then
            if git show origin/binance-ws-cache:data/binance_ws_depth.json > data/binance_ws_depth.json 2>/dev/null; then
              echo 'Loaded Binance depth WS cache.'
            else
              echo 'WARN: Binance depth WS cache unavailable at cycle start.' >&2
            fi
          else
            echo 'WARN: binance-ws-cache branch unavailable at cycle start.' >&2
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore BTC prediction database from repository archive
        shell: bash
        run: |
          set -euo pipefail
          archive='data/predictions.db.gz'
          db='data/predictions.db'
          if [ -s "$archive" ]; then
            python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          print('Restored predictions.db from compressed repository state.')
          PY
          elif [ -s "$db" ]; then
            echo 'Legacy uncompressed predictions.db detected; it will be migrated after validation.'
          else
            echo 'No existing prediction database found; workflow may initialize it.'
          fi
      - name: Install research dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 5 --timeout 60 -r requirements.txt; then exit 0; fi
            sleep $((10 * attempt))
          done
          exit 1
      - name: Compile research code
        run: python -m compileall -q src tests scripts
      - name: Run production-critical BTC guard suite
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/test_live_data_fail_closed.py
            tests/test_live_data_policy.py
            tests/test_market_fallbacks.py
            tests/test_model_guards.py
            tests/test_runtime_model_guards.py
            tests/test_predict_generation_binding.py
            tests/test_pit_schema.py
            tests/test_promotion_gate.py
            tests/test_model_compare_promotion_boundary.py
            tests/test_settle.py
            tests/test_settlement_source.py
            tests/test_state_archive.py
            tests/test_merge_prediction_state.py
            tests/test_prediction_state_guard.py
            tests/test_live_collector_self_heal.py
          )
          for test_file in "${tests[@]}"; do
            test -s "${test_file}" || { echo "Missing production guard test: ${test_file}" >&2; exit 1; }
          done
          PYTHONPATH="${GITHUB_WORKSPACE}/src:${GITHUB_WORKSPACE}/scripts" python -m pytest -q "${tests[@]}"

      - name: Ensure BTC production models exist without retraining every 5 minutes
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for horizon in 5m 10m; do
            if [ ! -s "models/${horizon}.joblib" ] || [ ! -s "models/${horizon}.json" ]; then missing=1; fi
          done
          if [ "${missing}" -eq 0 ]; then exit 0; fi
          python src/bootstrap_train.py
      - name: Ensure gated Coinbase fallback models exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for horizon in 5m 10m; do
            if [ ! -s "models/coinbase_${horizon}.joblib" ] || [ ! -s "models/coinbase_${horizon}.json" ]; then missing=1; fi
          done
          if [ "${missing}" -eq 0 ]; then exit 0; fi
          # Coinbase fallback is optional continuity infrastructure. A training
          # outage must not make the entire Live workflow red; the predictor will
          # explicitly remain fail-closed/deferred when the gated artifact is absent.
          if python src/coinbase_fallback_train.py; then
            exit 0
          fi
          echo "WARN: gated Coinbase fallback training unavailable; live prediction may defer safely if Binance is unavailable." >&2
          echo "BTC_FALLBACK_MODEL_UNAVAILABLE=1" >> "$GITHUB_ENV"
          exit 0
      - name: Reconcile legacy fallback settlement venue
        run: |
          set -euo pipefail
          python src/reconcile_fallback_settlements.py

      - name: Settle due BTC predictions
        run: python src/settle.py
      # Model adoption must precede both calibration layers so a newly
      # adopted generation is never left running with stale calibration.
      - name: Run BTC model comparison and adoption gate
        run: python src/model_compare.py
      - name: Recalculate BTC calibration metrics after model adoption
        run: python src/calibration.py
      - name: Recalibrate BTC live structural blend after model adoption
        run: python src/blend_calibration.py
      - name: Recalibrate source-native Coinbase fallback after settlement
        run: python src/fallback_calibration.py
      - name: Verify source-native fallback settlement bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          db=Path('data/predictions.db')
          with sqlite3.connect(db) as con:
              rows=con.execute("SELECT scenario_json, actual_price_5m, settlement_source_5m, actual_price_10m, settlement_source_10m FROM predictions WHERE actual_price_5m IS NOT NULL OR actual_price_10m IS NOT NULL").fetchall()
          expected={'coinbase_fallback':'coinbase_exchange','bybit_fallback':'bybit_linear'}
          for scenario_text, actual5, source5, actual10, source10 in rows:
              try: mode=str(json.loads(scenario_text or '{}').get('production_mode',''))
              except Exception: continue
              native=expected.get(mode)
              if not native: continue
              if actual5 is not None and source5 != native: raise SystemExit(f'fallback 5m source mismatch: {source5!r} != {native!r}')
              if actual10 is not None and source10 != native: raise SystemExit(f'fallback 10m source mismatch: {source10!r} != {native!r}')
          print('source-native fallback settlement bindings: VERIFIED')
          PY

      - name: Audit BTC production artifact provenance
        run: python src/production_artifact_audit.py
      - name: Refresh latest Binance WebSocket cache immediately before prediction
        shell: bash
        run: |
          set -euo pipefail
          tmp_cache="$(mktemp)"
          cache_loaded=false

          validate_boundary_cache() {
            python - "$tmp_cache" <<'PY'
          import json,sys,time
          from pathlib import Path
          obj=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          rows=obj.get('rows')
          if obj.get('schema_version') != 1 or obj.get('source') != 'Binance USD-M Futures WebSocket':
              raise SystemExit('invalid Binance WS cache provenance')
          if obj.get('stream') != 'btcusdt@kline_1m' or not isinstance(rows,list) or len(rows)<40:
              raise SystemExit('invalid Binance WS cache shape')
          required={'open_time_ms','event_time_ms','retrieved_at_ms','open','high','low','close','volume','taker_buy_base'}
          if not all(isinstance(row,dict) and required.issubset(row) for row in rows):
              raise SystemExit('invalid Binance WS cache row schema')
          ordered=sorted(rows,key=lambda row:int(row['open_time_ms']))
          suffix=1
          for i in range(len(ordered)-1,0,-1):
              if int(ordered[i]['open_time_ms'])-int(ordered[i-1]['open_time_ms']) != 60000:
                  break
              suffix+=1
          now_ms=int(time.time()*1000)
          retrieved_age=now_ms-int(ordered[-1]['retrieved_at_ms'])
          event_age=now_ms-int(ordered[-1].get('event_time_ms', ordered[-1]['open_time_ms']))
          print(f'latest_retrieved_age_ms={retrieved_age} latest_event_age_ms={event_age} contiguous_rows={suffix} latest_open_time_ms={ordered[-1]["open_time_ms"]}')
          if (
              suffix<40
              or retrieved_age<0
              or retrieved_age>180000
              or event_age<0
              or event_age>180000
          ):
              raise SystemExit('Binance WS cache stale_or_insufficient_at_prediction_boundary')
          PY
          }

          for attempt in 1 2 3 4 5 6; do
            rm -f "$tmp_cache"
            if git fetch --no-tags --depth=1 origin binance-ws-cache \
              && git show origin/binance-ws-cache:data/binance_ws_1m.json > "$tmp_cache" 2>/dev/null; then
              if validate_boundary_cache; then
                cp "$tmp_cache" data/binance_ws_1m.json
                cache_loaded=true
                echo 'Loaded fresh Binance WS cache immediately before prediction.'
                break
              fi
            else
              echo "WARN: Binance WS cache unavailable at prediction boundary (attempt ${attempt}/6)." >&2
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Waiting 15s for next verified Binance WS checkpoint (attempt ${attempt}/6)." >&2
              sleep 15
            fi
          done

          if [ "$cache_loaded" != true ]; then
            echo 'WARN: no fresh verified Binance WS cache after 90s; existing predictor fallback policy remains authoritative.' >&2
          fi
          rm -f "$tmp_cache"

      - name: Refresh latest Binance depth cache immediately before prediction
        shell: bash
        run: |
          set -euo pipefail
          tmp_depth="$(mktemp)"
          depth_loaded=false
          validate_depth() {
            python - "$tmp_depth" <<'PY'
          import json,sys,time
          from src.binance_ws import parse_depth_message
          from pathlib import Path
          obj=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if obj.get('schema_version') != 1 or obj.get('source') != 'Binance USD-M Futures WebSocket' or obj.get('stream') != 'btcusdt@depth20@100ms':
              raise SystemExit('invalid Binance depth cache provenance')
          snap=obj.get('snapshot')
          if isinstance(snap,dict) and 'E' not in snap and 'event_time_ms' in snap:
              snap=dict(snap)
              snap['E']=snap['event_time_ms']
          parsed=parse_depth_message(snap,int(snap.get('retrieved_at_ms',0)) if isinstance(snap,dict) else 0)
          if parsed is None: raise SystemExit('invalid Binance depth cache snapshot')
          now_ms=int(time.time()*1000)
          retrieved_age=now_ms-int(parsed['retrieved_at_ms'])
          event_age=now_ms-int(parsed['event_time_ms'])
          print(f'binance_depth_retrieved_age_ms={retrieved_age} binance_depth_event_age_ms={event_age} event_time_ms={parsed["event_time_ms"]} levels={min(len(parsed["bids"]),len(parsed["asks"]))}')
          if (
              retrieved_age<0
              or retrieved_age>180000
              or event_age<0
              or event_age>180000
              or min(len(parsed['bids']),len(parsed['asks']))<20
          ):
              raise SystemExit('Binance depth cache stale_or_insufficient')
          PY
          }
          for attempt in 1 2 3 4 5 6; do
            rm -f "$tmp_depth"
            if git fetch --no-tags --depth=1 origin binance-ws-cache && git show origin/binance-ws-cache:data/binance_ws_depth.json > "$tmp_depth" 2>/dev/null; then
              if validate_depth; then
                cp "$tmp_depth" data/binance_ws_depth.json
                depth_loaded=true
                echo 'Loaded fresh Binance depth WS cache immediately before prediction.'
                break
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Waiting 15s for fresh Binance depth checkpoint (attempt ${attempt}/6)." >&2
              sleep 15
            fi
          done
          if [ "$depth_loaded" != true ]; then
            echo 'WARN: no fresh Binance depth cache after 90s; predictor will attempt direct WS recovery and fail closed if depth remains unavailable.' >&2
          fi
          rm -f "$tmp_depth"

      - name: Generate next BTC prediction
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp)"
          err="$(mktemp)"
          # Bound network/model generation latency. A hung public endpoint must
          # become a safe DEFERRED cycle rather than consuming the full 20-minute
          # production slot and blocking subsequent 5-minute cycles.
          set +e
          timeout --signal=TERM --kill-after=15s 210s python src/predict.py >"$out" 2>"$err"
          predict_status=$?
          set -e
          if [ "$predict_status" -eq 0 ]; then
            cat "$out"
            rm -f "$out" "$err"
            exit 0
          fi
          cat "$out"
          cat "$err" >&2
          # A broad Binance market-data outage is a safe no-prediction state:
          # do not manufacture a prediction or promote a fallback. Preserve the
          # database and let diagnostics/state archival continue, while keeping
          # real code/data-contract failures red.
          if [ "$predict_status" -eq 124 ] || [ "$predict_status" -eq 137 ] || \
             grep -Eq "^(.*stale_live_market_event:|.*future_live_market_event:)" "$err" || \
             (grep -q "live_prediction_inputs_incomplete:" "$err" && \
              (grep -Eq "binance_(futures|depth|taker|premium)='error:" "$err" || grep -q "fallback_not_allowed" "$err")); then
            echo "BTC_LIVE_DEFERRED=1" >> "$GITHUB_ENV"
            echo "BTC live prediction deferred: Binance critical market-data endpoints are unavailable. No prediction was fabricated." >&2
            rm -f "$out" "$err"
            exit 0
          fi
          rm -f "$out" "$err"
          exit 1
      - name: Fail closed on incomplete live prediction inputs
        run: python src/live_data_fail_closed.py
      - name: Snapshot exact immutable event count before compaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          from scripts.merge_prediction_state import expected_compacted_event_count
          db = Path('data/predictions.db')
          if not db.exists():
              Path('/tmp/btc_live_compaction_before.json').write_text(
                  json.dumps({'count': 0, 'expected_exact_unique_events': 0}, sort_keys=True),
                  encoding='utf-8'
              )
              raise SystemExit(0)
          with sqlite3.connect(db) as con:
              expected = expected_compacted_event_count(con)
              total = con.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]
          Path('/tmp/btc_live_compaction_before.json').write_text(
              json.dumps(
                  {'count': int(total), 'expected_exact_unique_events': int(expected)},
                  sort_keys=True
              ),
              encoding='utf-8'
          )
          print(Path('/tmp/btc_live_compaction_before.json').read_text())
          PY
      - name: Compact exact immutable BTC prediction events before audits
        shell: bash
        run: |
          set -euo pipefail
          if [ -s data/predictions.db ]; then
            python scripts/merge_prediction_state.py --compact data/predictions.db
          else
            echo 'No prediction DB to compact on this cycle.'
          fi
      - name: Verify exact compaction cardinality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          before = json.loads(Path('/tmp/btc_live_compaction_before.json').read_text(encoding='utf-8'))
          db = Path('data/predictions.db')
          with sqlite3.connect(db) as con:
              after = con.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]
          expected = int(before['expected_exact_unique_events'])
          if int(after) != expected:
              raise SystemExit(
                  f'live compaction cardinality mismatch: before={before["count"]} '
                  f'expected={expected} after={after}'
              )
          print(
              f'live compaction cardinality verified: before={before["count"]} '
              f'exact_unique={expected} after={after}'
          )
          PY
      - name: Run non-fatal BTC research health audit
        run: python src/research_health.py
      - name: Run strict research input audit
        run: python src/research_input_audit.py
      - name: Audit Coinbase Binance Bybit venue distribution drift
        run: python src/venue_drift.py
      - name: Diagnose FLAT disappearance by prediction pipeline stage
        run: python src/flat_diagnostic.py
      - name: Validate BTC prediction state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('data/predictions.db')
          if not p.exists() or p.stat().st_size == 0: raise SystemExit('predictions.db missing')
          with sqlite3.connect(p) as con:
              n=con.execute('SELECT COUNT(*) FROM predictions').fetchone()[0]
              if n <= 0: raise SystemExit('predictions table is empty')
              if __import__('os').environ.get('BTC_LIVE_DEFERRED') == '1':
                  latest=con.execute('SELECT created_at_utc,base_price FROM predictions ORDER BY prediction_id DESC LIMIT 1').fetchone()
                  if latest:
                      age=(datetime.now(timezone.utc)-datetime.fromisoformat(latest[0].replace('Z','+00:00'))).total_seconds()
                      if age < -60: raise SystemExit(f'latest prediction timestamp is in the future: {age:.0f}s')
                  print('BTC live cycle deferred safely: no fresh prediction was created; existing state remains intact.')
                  raise SystemExit(0)
              for cols in [('p_up_5m','p_down_5m','p_flat_5m'),('p_up_10m','p_down_10m','p_flat_10m')]:
                  a,b,c=cols
                  bad=con.execute(f'SELECT COUNT(*) FROM predictions WHERE abs(({a}+{b}+{c})-1.0)>0.00001 OR {a}<0 OR {b}<0 OR {c}<0').fetchone()[0]
                  if bad: raise SystemExit(f'probability integrity failure {cols}: {bad}')
              latest=con.execute('SELECT created_at_utc,base_price,model_version,scenario_json FROM predictions ORDER BY prediction_id DESC LIMIT 1').fetchone()
              if not latest: raise SystemExit('latest prediction missing')
              age=(datetime.now(timezone.utc)-datetime.fromisoformat(latest[0].replace('Z','+00:00'))).total_seconds()
              if age > 900: raise SystemExit(f'latest prediction is stale: {age:.0f}s')
              if age < -60: raise SystemExit(f'latest prediction timestamp is in the future: {age:.0f}s')
              scenario=json.loads(latest[3]) if latest[3] else {}
              degraded=(latest[2]=='DEGRADED_NO_FRESH_DATA')
              if not degraded and latest[1] <= 0: raise SystemExit('latest BTC base price is invalid')
              if degraded and latest[1] != 0: raise SystemExit('degraded BTC prediction must not claim a market base price')
              if not degraded and not scenario.get('data_quality'): raise SystemExit('live BTC prediction is missing data-quality metadata')
          for horizon in ('5m','10m'):
              mj=Path(f'models/{horizon}.json'); mf=Path(f'models/{horizon}.joblib')
              if mj.exists():
                  obj=json.loads(mj.read_text())
                  if obj.get('horizon') != horizon: raise SystemExit(f'{horizon} horizon mismatch')
                  if obj.get('artifact') != f'{horizon}.joblib': raise SystemExit(f'{horizon} artifact mismatch')
                  if obj.get('classes') and obj['classes'] != ['DOWN','FLAT','UP']: raise SystemExit(f'{horizon} class order mismatch')
                  if obj.get('features') and obj['features'] != list(__import__('src.feature_schema', fromlist=['FEATURES']).FEATURES): raise SystemExit(f'{horizon} feature schema mismatch')
              if mj.exists() and not mf.exists(): raise SystemExit(f'{horizon} model artifact missing')
              cp=Path(f'models/{horizon}.calibration.json')
              if cp.exists():
                  obj=json.loads(cp.read_text()); t=float(obj.get('temperature',1.0)); n=int(obj.get('n_settled',0))
                  if not 0.5 <= t <= 3.0 or n < 0: raise SystemExit(f'{horizon} calibration invalid')
              bp=Path(f'models/{horizon}.blend.json')
              if bp.exists():
                  obj=json.loads(bp.read_text()); w=float(obj.get('base_weight',0.20)); n=int(obj.get('n',0))
                  if not 0.0 <= w <= 0.45 or n < 0: raise SystemExit(f'{horizon} blend invalid')
          audit=Path('data/historical_research/production_artifact_audit.json')
          if not audit.exists(): raise SystemExit('production artifact audit output missing')
          audit_obj=json.loads(audit.read_text())
          if not isinstance(audit_obj.get('artifacts'),list) or len(audit_obj['artifacts']) != 2: raise SystemExit('production artifact audit malformed')
          for item in audit_obj['artifacts']:
              if item.get('horizon') not in {'5m','10m'} or len(str(item.get('model_sha256',''))) != 64 or len(str(item.get('metadata_sha256',''))) != 64: raise SystemExit('production artifact fingerprint invalid')
          health=Path('data/historical_research/research_health.json')
          if not health.exists(): raise SystemExit('research health audit output missing')
          if not isinstance(json.loads(health.read_text()).get('ok'),bool): raise SystemExit('research health audit malformed')
          drift=Path('data/historical_research/venue_drift.json')
          if not drift.exists(): raise SystemExit('venue drift audit output missing')
          drift_obj=json.loads(drift.read_text())
          if drift_obj.get('policy') != 'monitor_only_no_model_input_no_promotion_effect': raise SystemExit('venue drift audit policy mismatch')
          if not isinstance(drift_obj.get('source_counts'),dict) or not isinstance(drift_obj.get('cross_exchange_gap'),dict): raise SystemExit('venue drift audit malformed')
          flat=Path('data/historical_research/flat_diagnostic.json')
          if not flat.exists(): raise SystemExit('FLAT diagnostic output missing')
          flat_obj=json.loads(flat.read_text())
          if flat_obj.get('policy') != 'diagnostic_only_no_model_input_no_promotion_effect': raise SystemExit('FLAT diagnostic policy mismatch')
          if not isinstance(flat_obj.get('counts'),dict) or not isinstance(flat_obj.get('window'),int) or flat_obj.get('window',0) <= 0: raise SystemExit('FLAT diagnostic malformed')
          print('BTC prediction database, models, calibration, blend, artifact provenance, research-health, venue-drift, and FLAT diagnostic validation: OK')
          PY
      - name: Record BTC live cycle outcome for downstream integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          db = Path('data/predictions.db')
          mode = 'deferred' if os.environ.get('BTC_LIVE_DEFERRED') == '1' else 'prediction_created'
          latest_id = None
          latest_created = None
          if db.exists():
              with sqlite3.connect(db) as con:
                  row = con.execute(
                      'SELECT prediction_id, created_at_utc FROM predictions ORDER BY prediction_id DESC LIMIT 1'
                  ).fetchone()
                  if row:
                      latest_id, latest_created = int(row[0]), row[1]
          payload = {
              'schema_version': 1,
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'head_sha': os.environ['GITHUB_SHA'],
              'mode': mode,
              'completed_at_utc': datetime.now(timezone.utc).isoformat(),
              'latest_prediction_id': latest_id,
              'latest_prediction_created_at_utc': latest_created,
          }
          Path('data/live_cycle_status.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n',
              encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Compress validated BTC prediction database for repository storage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import compress_db, restore_db
          import tempfile
          db=Path('data/predictions.db')
          archive=Path('data/predictions.db.gz')
          info=compress_db(db, archive)
          print(f'Compressed BTC state: {info["bytes"]} bytes, sha256={info["sha256"]}')
          if info['bytes'] >= 95 * 1024 * 1024:
              raise SystemExit('compressed BTC state is still too large for safe GitHub storage')
          if archive.stat().st_size >= db.stat().st_size:
              raise SystemExit('BTC state compression produced no size reduction')
          with tempfile.TemporaryDirectory() as td:
              probe=Path(td)/'predictions.db'
              restore_db(archive, probe)
              if probe.read_bytes() != db.read_bytes():
                  raise SystemExit('BTC state archive round-trip mismatch; refusing to delete source DB')
          db.unlink()
          print('Exact archive round-trip verified before deleting uncompressed DB.')
          PY
      - name: Upload minimal BTC cycle handoff artifact
        uses: actions/upload-artifact@v6
        with:
          name: btc-predictions-db
          path: |
            data/predictions.db.gz
            data/live_cycle_status.json
          if-no-files-found: error
          retention-days: 3
      - name: Check repository diff before commit
        run: git diff --check
      - name: Commit BTC research state with conflict-safe merge retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- data/predictions.db.gz data/live_cycle_status.json
          for path in \
            data/historical_research/research_health.json \
            data/historical_research/venue_drift.json \
            data/historical_research/flat_diagnostic.json; do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          for path in models/*.json models/*.joblib; do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          if git ls-files --cached --error-unmatch data/predictions.db >/dev/null 2>&1; then
            git rm --cached -- data/predictions.db
          fi
          if git diff --cached --quiet; then echo 'No BTC research-state changes to commit.'; exit 0; fi
          git commit -m 'Update BTC research state'
          for attempt in 1 2 3 4 5; do
            if timeout 90s git push origin HEAD:main; then exit 0; fi
            echo "push attempt ${attempt} rejected; preserving local state and rebuilding on origin/main"
            cp data/predictions.db.gz /tmp/btc_local_predictions.db.gz
            if [ -f data/live_cycle_status.json ]; then cp data/live_cycle_status.json /tmp/btc_local_live_cycle_status.json; fi
            if [ -d models ]; then rm -rf /tmp/btc_local_models && cp -R models /tmp/btc_local_models; fi
            if [ -f data/historical_research/research_health.json ]; then cp data/historical_research/research_health.json /tmp/btc_local_health.json; fi
            if [ -f data/historical_research/venue_drift.json ]; then cp data/historical_research/venue_drift.json /tmp/btc_local_venue_drift.json; fi
            if [ -f data/historical_research/flat_diagnostic.json ]; then cp data/historical_research/flat_diagnostic.json /tmp/btc_local_flat_diagnostic.json; fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
            fi
            timeout 90s git fetch --prune origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db, compress_db
          import subprocess, shutil
          archive=Path('data/predictions.db.gz')
          if archive.exists():
              restore_db(archive, Path('data/predictions.db'))
          else:
              Path('data').mkdir(exist_ok=True)
          restore_db(Path('/tmp/btc_local_predictions.db.gz'), Path('/tmp/btc_local_predictions.db'))
          if Path('data/predictions.db').exists():
              subprocess.run(['python','scripts/merge_prediction_state.py','/tmp/btc_local_predictions.db','data/predictions.db'],check=True)
          else:
              shutil.copy2('/tmp/btc_local_predictions.db','data/predictions.db')
          compress_db(Path('data/predictions.db'), archive)
          Path('data/predictions.db').unlink()
          PY
            if [ -d /tmp/btc_local_models ]; then rm -rf models && cp -R /tmp/btc_local_models models; fi
            # live_cycle_status belongs to this writer and records the exact
            # run/prediction that just completed. Restore it after rebasing so
            # a conflict cannot silently roll the status back to an older run.
            if [ -f /tmp/btc_local_live_cycle_status.json ]; then cp /tmp/btc_local_live_cycle_status.json data/live_cycle_status.json; fi
            if [ -f /tmp/btc_local_health.json ]; then cp /tmp/btc_local_health.json data/historical_research/research_health.json; fi
            if [ -f /tmp/btc_local_venue_drift.json ]; then cp /tmp/btc_local_venue_drift.json data/historical_research/venue_drift.json; fi
            if [ -f /tmp/btc_local_flat_diagnostic.json ]; then cp /tmp/btc_local_flat_diagnostic.json data/historical_research/flat_diagnostic.json; fi
            git add -- data/predictions.db.gz data/live_cycle_status.json
            for path in \
              data/historical_research/research_health.json \
              data/historical_research/venue_drift.json \
              data/historical_research/flat_diagnostic.json; do
              if [ -f "$path" ]; then git add -- "$path"; fi
            done
            for path in models/*.json models/*.joblib; do
              if [ -f "$path" ]; then git add -- "$path"; fi
            done
            if git ls-files --cached --error-unmatch data/predictions.db >/dev/null 2>&1; then
              git rm --cached -- data/predictions.db
            fi
            git diff --cached --quiet || git commit -m 'Merge BTC research state safely'
            sleep $((5 * attempt))
          done
          exit 1

