name: BTC Upset Uncertainty OOS

on:
  pull_request:
    paths:
      - 'src/upset_uncertainty_oos.py'
      - 'tests/test_upset_uncertainty_oos.py'
      - 'data/historical_research/oos_*_*.csv'
      - '.github/workflows/btc_upset_uncertainty_oos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-upset-uncertainty-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  upset_uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest -q tests/test_upset_uncertainty_oos.py
      - name: Run OOS upset uncertainty research
        run: |
          set -euo pipefail
          python src/upset_uncertainty_oos.py
          test -s data/historical_research/upset_uncertainty_oos.json
      - name: Validate evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/upset_uncertainty_oos.json')
          o=json.loads(p.read_text())
          if o.get('research_only') is not True or o.get('production_changed') is not False:
              raise SystemExit('research-only contract violated')
          for h,item in o.get('horizons',{}).items():
              if item.get('status') == 'OK' and item.get('final_holdout_protected') is not True:
                  raise SystemExit(f'{h}: holdout protection missing')
              if item.get('status') == 'DEFERRED' and not item.get('reason'):
                  raise SystemExit(f'{h}: DEFERRED without reason')
          print('upset uncertainty evidence: VERIFIED')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-upset-uncertainty-\${{ github.run_id }}
          path: data/historical_research/upset_uncertainty_oos.json
          if-no-files-found: error
          retention-days: 7
