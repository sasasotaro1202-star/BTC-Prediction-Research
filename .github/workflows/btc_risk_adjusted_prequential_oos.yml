name: BTC Risk-Adjusted Prequential OOS

on:
  pull_request:
    paths:
      - 'src/risk_adjusted_prequential_oos.py'
      - 'tests/test_risk_adjusted_prequential_oos.py'
      - 'src/model_compare.py'
      - '.github/workflows/btc_risk_adjusted_prequential_oos.yml'
  push:
    branches: [main]
    paths:
      - 'src/risk_adjusted_prequential_oos.py'
      - 'tests/test_risk_adjusted_prequential_oos.py'
      - '.github/workflows/btc_risk_adjusted_prequential_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-risk-adjusted-prequential-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_risk_adjusted_prequential_oos.py
      - name: Run chronological OOS
        run: |
          set -euo pipefail
          python src/risk_adjusted_prequential_oos.py
          test -s data/historical_research/risk_adjusted_prequential_oos.json
      - name: Validate evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/historical_research/risk_adjusted_prequential_oos.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          if obj.get('research_only') is not True or obj.get('production_changed') is not False:
              raise SystemExit('production contract violated')
          for h in obj['horizons'].values():
              if h.get('final_holdout_used_for_selection') is not False:
                  raise SystemExit('holdout leakage contract violated')
          print('risk-adjusted prequential evidence: VERIFIED')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-risk-adjusted-prequential-oos
          path: data/historical_research/risk_adjusted_prequential_oos.json
          if-no-files-found: error
          retention-days: 7
