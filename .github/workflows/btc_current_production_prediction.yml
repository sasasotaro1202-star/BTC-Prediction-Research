name: BTC Current Production Prediction

# On-demand path for producing a prediction with the exact production model
# registered on main at run start. It never selects candidate/research/fallback
# models and never mutates the repository prediction state.
on:
  workflow_dispatch:

concurrency:
  group: btc-current-production-prediction
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  predict:
    name: Predict with current production model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore latest Binance WebSocket caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          rm -f data/binance_ws_1m.json data/binance_ws_depth.json
           . scripts/ci_network_retry.sh
           if ci_git_fetch --no-tags --depth=1 origin binance-ws-cache; then
             if ! git show origin/binance-ws-cache:data/binance_ws_1m.json > data/binance_ws_1m.json 2>/dev/null; then
               echo 'WARN: Binance kline WS cache unavailable; predictor will use its fail-closed market-data path.'
             fi
             if ! git show origin/binance-ws-cache:data/binance_ws_depth.json > data/binance_ws_depth.json 2>/dev/null; then
               echo 'WARN: Binance depth WS cache unavailable; predictor will use its direct-WS/REST recovery path.'
             fi
           else
             echo 'WARN: binance-ws-cache branch unavailable; predictor will use its fail-closed market-data path.'
           fi

      - name: Restore current production state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          restore_db(Path("data/predictions.db.gz"), Path("data/predictions.db"))
          PY

      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Compile production code
        run: python -m compileall -q src scripts

      - name: Snapshot exact production model binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import sqlite3
          from pathlib import Path

          with sqlite3.connect("data/predictions.db") as con:
              registry = dict(con.execute(
                  "SELECT horizon, production_version FROM model_registry"
              ).fetchall())

          if set(registry) != {"5m", "10m"}:
              raise SystemExit(f"production registry incomplete: {registry}")

          for horizon in ("5m", "10m"):
              meta_path = Path(f"models/{horizon}.json")
              model_path = Path(f"models/{horizon}.joblib")
              if not meta_path.is_file() or not model_path.is_file():
                  raise SystemExit(f"production artifact missing: {horizon}")

              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              if meta.get("model_version") != registry[horizon]:
                  raise SystemExit(
                      f"production binding mismatch: {horizon}: "
                      f"registry={registry[horizon]!r} metadata={meta.get('model_version')!r}"
                  )
              if meta.get("candidate") is True:
                  raise SystemExit(f"candidate exposed as production: {horizon}")
              if meta.get("artifact") != model_path.name:
                  raise SystemExit(f"artifact name mismatch: {horizon}")

              print(json.dumps({
                  "horizon": horizon,
                  "production_model_version": registry[horizon],
                  "artifact": model_path.name,
                  "model_sha256": hashlib.sha256(model_path.read_bytes()).hexdigest(),
              }, sort_keys=True))
          PY

      - name: Generate prediction with current production model
        shell: bash
        run: |
          set -euo pipefail
          python src/predict.py | tee /tmp/btc_current_production_prediction.jsonl

      - name: Verify latest record is bound to current production registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          payload = json.loads(Path("/tmp/btc_current_production_prediction.jsonl").read_text(encoding="utf-8").strip().splitlines()[-1])
          with sqlite3.connect("data/predictions.db") as con:
              reg = dict(con.execute("SELECT horizon, production_version FROM model_registry").fetchall())
              row = con.execute(
                  "SELECT model_version FROM predictions ORDER BY prediction_id DESC LIMIT 1"
              ).fetchone()

          expected = f"5m:{reg['5m']}|10m:{reg['10m']}"
          if not row or row[0] != expected:
              raise SystemExit(f"latest prediction model binding mismatch: {row} expected={expected!r}")

          def pct(v):
              return f"{float(v)*100:.2f}%"

          summary = [
              "# BTC Current Production Prediction",
              "",
              f"- Timestamp (JST): **{payload['timestamp_jst']}**",
              f"- BTC price: **{float(payload['btc_price']):.2f}**",
              f"- Production model 5m: **{payload['model_5m']}**",
              f"- Production model 10m: **{payload['model_10m']}**",
              "",
              "| Horizon | UP | FLAT | DOWN |",
              "|---|---:|---:|---:|",
              f"| 5m | {pct(payload['probabilities_5m']['UP'])} | {pct(payload['probabilities_5m']['FLAT'])} | {pct(payload['probabilities_5m']['DOWN'])} |",
              f"| 10m | {pct(payload['probabilities_10m']['UP'])} | {pct(payload['probabilities_10m']['FLAT'])} | {pct(payload['probabilities_10m']['DOWN'])} |",
              "",
              f"- Regime: **{payload['regime']}**",
              f"- Confidence (5m): **{pct(payload['confidence'])}**",
          ]
          warnings = payload.get("warnings") or []
          if warnings:
              summary.append("- Warnings: " + ", ".join(map(str, warnings)))
          with open("/tmp/btc_current_production_summary.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          PY

      - name: Build auditable production prediction evidence envelope
        shell: bash
        env:
          MODEL_SNAPSHOT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/btc_current_production_prediction.jsonl")
              .read_text(encoding="utf-8")
              .strip()
              .splitlines()[-1]
          )

          def parse_iso(value):
              return datetime.fromisoformat(str(value).replace("Z", "+00:00"))

          cutoff = parse_iso(payload["timestamp_jst"])
          horizons = {
              "5m": {
                  "target_at": payload["target_5m_jst"],
                  "forecast_lifetime_seconds": int(
                      (parse_iso(payload["target_5m_jst"]) - cutoff).total_seconds()
                  ),
                  "research_status": "PRODUCTION",
              },
              "10m": {
                  "target_at": payload["target_10m_jst"],
                  "forecast_lifetime_seconds": int(
                      (parse_iso(payload["target_10m_jst"]) - cutoff).total_seconds()
                  ),
                  "research_status": "PRODUCTION",
              },
          }
          for horizon, item in (payload.get("extended_horizons") or {}).items():
              target = parse_iso(item["target_jst"])
              horizons[horizon] = {
                  "target_at": target.isoformat(),
                  "forecast_lifetime_seconds": int((target - cutoff).total_seconds()),
                  "research_status": "RESEARCH_ONLY",
                  "forecast_method": item.get("forecast_method"),
              }

          with sqlite3.connect("data/predictions.db") as con:
              row = con.execute(
                  "SELECT scenario_json FROM predictions ORDER BY prediction_id DESC LIMIT 1"
              ).fetchone()
          if not row or not row[0]:
              raise SystemExit("production evidence: persisted scenario missing")
          scenario = json.loads(row[0])
          provenance = scenario.get("provenance")
          if not isinstance(provenance, dict):
              raise SystemExit("production evidence: persisted provenance missing")

          required = ("available_at", "retrieved_at", "prediction_cutoff")
          if any(not provenance.get(k) for k in required):
              raise SystemExit("production evidence: top-level PIT provenance incomplete")

          sources = provenance.get("sources")
          if not isinstance(sources, dict) or not sources:
              raise SystemExit("production evidence: source provenance missing")

          decision = parse_iso(provenance["prediction_cutoff"])
          source_checks = {}
          for name, source in sources.items():
              if not isinstance(source, dict):
                  source_checks[name] = {"status": "INVALID", "pit_order": "not_object"}
                  continue
              available = source.get("available_at")
              retrieved = source.get("retrieved_at")
              cutoff_value = source.get("prediction_cutoff")
              reason = "missing_timestamp"
              if available and retrieved and cutoff_value:
                  try:
                      a = parse_iso(available)
                      r = parse_iso(retrieved)
                      c = parse_iso(cutoff_value)
                      reason = "PASS" if a <= r <= c <= decision else "temporal_order_invalid"
                  except (TypeError, ValueError):
                      reason = "invalid_timestamp"
              source_checks[name] = {
                  "status": source.get("status"),
                  "pit_order": reason,
                  "available_at": available,
                  "retrieved_at": retrieved,
                  "prediction_cutoff": cutoff_value,
                  "temporal_basis": source.get("temporal_basis"),
              }

          situation = payload.get("situation") or {}
          evidence = {
              "schema_version": 1,
              "evidence_type": "current_production_prediction",
              "status": "VERIFIED_RUNTIME_BINDING_AND_PERSISTENCE_CONTRACT",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "git_sha": "${MODEL_SNAPSHOT_SHA}",
              "target": {
                  "primary_classes": ["DOWN", "FLAT", "UP"],
                  "primary_horizons": ["5m", "10m"],
              },
              "prediction": {
                  "timestamp_jst": payload["timestamp_jst"],
                  "btc_price": payload["btc_price"],
                  "probabilities_5m": payload["probabilities_5m"],
                  "probabilities_10m": payload["probabilities_10m"],
                  "regime": payload.get("regime"),
                  "confidence_5m": payload.get("confidence"),
                  "warnings": payload.get("warnings") or [],
                  "situation": situation,
                  "calibration": payload.get("calibration"),
                  "data_quality": payload.get("data_quality"),
              },
              "reliability": {
                  "signal_quality": situation.get("signal_quality"),
                  "data_state": situation.get("data_state"),
                  "horizon_alignment": situation.get("horizon_alignment"),
                  "predictability": {
                      "status": "NOT_COMPUTED_AT_PRODUCTION_RUNTIME",
                      "production_influence": False,
                  },
                  "ood": {
                      "status": "NOT_COMPUTED_AT_PRODUCTION_RUNTIME",
                      "production_influence": False,
                  },
                  "failure_risk": {
                      "status": "NOT_COMPUTED_AT_PRODUCTION_RUNTIME",
                      "production_influence": False,
                  },
              },
              "pit": {
                  "status": "PASS_BY_RUNTIME_PERSISTENCE_CONTRACT",
                  "prediction_cutoff": provenance["prediction_cutoff"],
                  "top_level": {key: provenance[key] for key in required},
                  "sources": source_checks,
              },
              "forecast_lifetime": horizons,
              "model_snapshot": {
                  "git_sha": "${MODEL_SNAPSHOT_SHA}",
                  "model_5m": payload["model_5m"],
                  "model_10m": payload["model_10m"],
              },
              "delta": {
                  "status": "NOT_AVAILABLE_IN_SINGLE_CURRENT_PREDICTION_RUN",
                  "production_influence": False,
              },
              "change_drivers": {
                  "status": "NOT_AVAILABLE_IN_SINGLE_CURRENT_PREDICTION_RUN",
                  "production_influence": False,
              },
              "research_boundary": {
                  "extended_horizons_are_research_only": True,
                  "external_oos_results_do_not_change_current_prediction": True,
              },
          }

          # Fail closed on contradictory source state.
          invalid = [
              name for name, check in source_checks.items()
              if check["pit_order"] != "PASS"
              and str(check.get("status", "")).startswith(("ok", "ok_current_only"))
          ]
          if invalid:
              raise SystemExit(
                  "production evidence: valid source has invalid PIT order: " + ",".join(invalid)
              )

          out = Path("/tmp/btc_current_production_evidence.json")
          out.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload production prediction evidence envelope
        uses: actions/upload-artifact@v6
        with:
          name: btc-current-production-evidence
          path: |
            /tmp/btc_current_production_evidence.json
            /tmp/btc_current_production_summary.md
          if-no-files-found: error
          retention-days: 7
