name: BTC Workflow Watchdog

on:
  schedule:
    - cron: '4-59/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_watchdog.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-workflow-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry recent eligible interrupted BTC workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          workflows=(
            btc_live_cycle.yml
            btc_integrity.yml
            btc_research.yml
            btc_pit_oos_audit.yml
            btc_historical_research.yml
            btc_9h_research_marathon.yml
            btc_recency_research.yml
            btc_archive_refresh.yml
            btc_selective_research.yml
            btc_microstructure_research.yml
            btc_hierarchical_research.yml
            btc_rolling_challenger.yml
            btc_exogenous_research.yml
            btc_interaction_research.yml
            btc_time_regime_research.yml
            btc_calibration_frozen_replay.yml
            btc_adaptive_calibration_replay.yml
            btc_multiscale_frozen_replay.yml
            btc_archive_primary_bridge.yml
            btc_canonical_state_compaction.yml
            btc_binance_ws_collector.yml
          )
          main_sha=$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$main_sha" ]; then
            echo "WARN: unable to resolve current main SHA; failed-run retries will be skipped for safety."
          else
            echo "Current main SHA: ${main_sha}"
          fi
          now=$(date -u +%s)
          for workflow in "${workflows[@]}"; do
            echo "Checking ${workflow}"
            response=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=5" 2>/dev/null) || { echo "WARN: unable to inspect ${workflow}; continuing"; continue; }
            printf '%s' "$response" | jq -c '.workflow_runs[]? | {id,status,conclusion,run_attempt,head_sha,updated_at}' | while IFS= read -r run; do
              [ -n "$run" ] || continue
              status=$(printf '%s' "$run" | jq -r '.status // ""')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
              run_id=$(printf '%s' "$run" | jq -r '.id // 0')
              attempt=$(printf '%s' "$run" | jq -r '.run_attempt // 1')
              head_sha=$(printf '%s' "$run" | jq -r '.head_sha // ""')
              updated=$(printf '%s' "$run" | jq -r '.updated_at // ""')
              updated_epoch=$(date -d "$updated" +%s 2>/dev/null || echo 0)
              age=$((now - updated_epoch))
              echo "run=${run_id} status=${status} conclusion=${conclusion} attempt=${attempt} head_sha=${head_sha:-unknown} age=${age}s"
              if [ "$status" != "completed" ]; then continue; fi
              case "$conclusion" in
                failure|cancelled|timed_out)
                  if [ "$run_id" -gt 0 ] && [ "$attempt" -lt 3 ] && [ "$age" -ge 300 ] && [ -n "$main_sha" ] && [ "$head_sha" = "$main_sha" ]; then
                    if gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs" >/dev/null 2>&1; then
                      echo "Retry requested successfully for ${workflow} run ${run_id}"
                    else
                      echo "WARN: retry request failed for ${workflow} run ${run_id}; continuing"
                    fi
                  elif [ "$run_id" -gt 0 ] && [ "$attempt" -lt 3 ] && [ "$age" -ge 300 ]; then
                    echo "Skip retry for ${workflow} run ${run_id}: head SHA ${head_sha:-unknown} is not current main."
                  fi
                  ;;
              esac
            done
          done

          code_or_protocol_changed_since() {
            active_head="$1"
            workflow="$2"
            if [ -z "$main_sha" ] || [ -z "$active_head" ] || [ "$active_head" = "$main_sha" ]; then
              return 1
            fi
            compare=$(gh api "/repos/${REPO}/compare/${active_head}...${main_sha}" 2>/dev/null || true)
            if [ -z "$compare" ]; then
              echo "WARN: unable to compare active head ${active_head} with current main ${main_sha}; stale-head cancellation is skipped."
              return 1
            fi
            if printf '%s' "$compare" | jq -e '.too_large == true' >/dev/null 2>&1; then
              echo "WARN: compare ${active_head}...${main_sha} is too large; stale-head cancellation is skipped and age timeout remains authoritative."
              return 1
            fi
            if printf '%s' "$compare" | jq -e '
              any(.files[]?.filename?;
                test("^(src/|scripts/|tests/|requirements\.txt$|\.github/workflows/" + $workflow + "$)")
              )' >/dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          recover_if_stale() {
            workflow="$1"
            threshold="$2"
            active_grace="$3"
            stale_head_grace="$4"
            response=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=10" 2>/dev/null || true)
            if [ -z "$response" ]; then echo "WARN: unable to inspect ${workflow}; no recovery dispatch"; return; fi
            latest=$(printf "%s" "$response" | jq -c '[.workflow_runs[]? | select(.status == "completed" and .conclusion != "skipped")] | sort_by(.updated_at) | last // empty')
            running=$(printf "%s" "$response" | jq '[.workflow_runs[]? | select(.status == "queued" or .status == "pending" or .status == "in_progress")] | length')

            # A completed-run freshness check alone cannot recover a stuck active
            # run. Inspect active runs separately and cancel only when they are
            # clearly stale or affected by a source/protocol change or exceeded its hard active-age limit. The next watchdog tick
            # performs the recovery dispatch after cancellation has settled.
            printf "%s" "$response" | jq -c '.workflow_runs[]? | select(.status == "queued" or .status == "pending" or .status == "in_progress") | {id,status,head_sha,updated_at}' |
              while IFS= read -r active; do
                [ -n "$active" ] || continue
                active_id=$(printf "%s" "$active" | jq -r '.id // 0')
                active_head=$(printf "%s" "$active" | jq -r '.head_sha // ""')
                active_updated=$(printf "%s" "$active" | jq -r '.updated_at // ""')
                active_epoch=$(date -d "$active_updated" +%s 2>/dev/null || echo 0)
                active_age=$((now - active_epoch))
                stale_by_source=false
                stale_by_age=false
                if [ "$active_age" -ge "$stale_head_grace" ] && code_or_protocol_changed_since "$active_head" "$workflow"; then
                  stale_by_source=true
                fi
                if [ "$active_age" -ge "$active_grace" ]; then
                  stale_by_age=true
                fi
                if [ "$active_id" -gt 0 ] && { [ "$stale_by_source" = true ] || [ "$stale_by_age" = true ]; }; then
                  echo "${workflow}: cancelling stale active run ${active_id} head=${active_head:-unknown} age=${active_age}s"
                  if gh api --method POST "/repos/${REPO}/actions/runs/${active_id}/cancel" >/dev/null 2>&1; then
                    echo "${workflow}: stale active run ${active_id} cancellation requested."
                  else
                    echo "WARN: unable to cancel stale active run ${active_id}; leaving state unchanged."
                  fi
                fi
              done

            latest_updated=$(printf "%s" "$latest" | jq -r '.updated_at // ""')
            latest_epoch=$(date -d "$latest_updated" +%s 2>/dev/null || echo 0)
            age=$((now - latest_epoch))
            echo "${workflow}: latest=${latest_updated:-none} age=${age}s running=${running} threshold=${threshold}s active_grace=${active_grace}s stale_head_grace=${stale_head_grace}s"
            if [ "$running" -eq 0 ] && { [ "$latest_epoch" -eq 0 ] || [ "$age" -ge "$threshold" ]; }; then
              echo "${workflow} appears stale; ensuring the workflow is enabled before recovery."
              if gh workflow enable "$workflow" >/dev/null 2>&1; then
                echo "${workflow} enable check completed."
              else
                echo "WARN: could not enable ${workflow}; attempting dispatch anyway."
              fi
              # Prefer the CLI helper, then fall back to the explicit workflow_dispatch
              # REST endpoint. Both paths remain fail-closed: a failed recovery request
              # must never mutate prediction state or be reported as successful.
              if gh workflow run "$workflow" --ref main >/dev/null 2>&1; then
                echo "${workflow} recovery dispatch succeeded via gh workflow run."
              elif gh api --method POST "/repos/${REPO}/actions/workflows/${workflow}/dispatches" -f ref=main >/dev/null 2>&1; then
                echo "${workflow} recovery dispatch succeeded via workflow_dispatch API."
              else
                echo "WARN: ${workflow} recovery dispatch failed through both supported paths; leaving state unchanged."
              fi
            fi
          }
          recover_if_stale btc_live_cycle.yml 600 1800 600
          recover_if_stale btc_pit_oos_audit.yml 7200 10800 7200
          # Keep the daily research lanes alive without dispatching duplicates
          # while an existing run is queued or in progress.
          recover_if_stale btc_research.yml 21600 32400 900
          recover_if_stale btc_interaction_research.yml 43200 64800 900
          recover_if_stale btc_historical_research.yml 43200 64800 900
          recover_if_stale btc_exogenous_research.yml 7200 10800 900
          recover_if_stale btc_recency_research.yml 21600 32400 900
          recover_if_stale btc_archive_refresh.yml 21600 32400 900
          recover_if_stale btc_selective_research.yml 28800 43200 900
          recover_if_stale btc_microstructure_research.yml 21600 32400 900
          recover_if_stale btc_hierarchical_research.yml 21600 32400 900
          # The 9H marathon is intentionally long-running; recover it only when
          # there is no active run and no completed run for 10 hours.
          # A 9H run has a hard workflow timeout; allow it to finish before treating an old-head run as stale.
          recover_if_stale btc_9h_research_marathon.yml 36000 39600 900
          # Research-only model/feature and maintenance lanes are recoverable
          # independently. They never mutate production probabilities directly.
          recover_if_stale btc_rolling_challenger.yml 28800 43200 900
          recover_if_stale btc_archive_primary_bridge.yml 21600 32400 900
          recover_if_stale btc_canonical_state_compaction.yml 21600 32400 900
          recover_if_stale btc_time_regime_research.yml 21600 32400 900
          recover_if_stale btc_calibration_frozen_replay.yml 28800 43200 900
          recover_if_stale btc_adaptive_calibration_replay.yml 28800 43200 900
          recover_if_stale btc_multiscale_frozen_replay.yml 21600 32400 900
          recover_if_stale btc_binance_ws_collector.yml 900 1800 900
          echo 'BTC workflow watchdog completed without masking core workflow results.'
