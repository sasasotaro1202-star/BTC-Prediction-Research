name: BTC Workflow Watchdog

on:
  # Run off-hour every 5 minutes so dropped/delayed GitHub schedule events have
  # more recovery opportunities without colliding with the exact top of the hour.
  schedule:
    - cron: '4-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_watchdog.yml'
      - '.github/workflows/btc_9h_research_marathon.yml'
  workflow_dispatch:
  # Completion of frequent BTC workflows provides a second recovery heartbeat
  # when GitHub delays or drops schedule events. The watchdog itself is still
  # lightweight and collapses bursts through its concurrency group.
  workflow_run:
    workflows:
      - BTC Live Cycle
      - BTC Binance WS Collector
      - BTC PIT OOS Audit
      - BTC Research
      - BTC Nested Selective Research
      - BTC Microstructure Research
      - BTC Exogenous Research
      - BTC Time-Regime OOS Research
      - BTC Frozen Archive Replay Research
      - BTC Unit Tests
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-workflow-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry recent eligible interrupted BTC workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          watchdog_degraded=0
          workflows=(
            btc_live_cycle.yml
            btc_integrity.yml
            btc_research.yml
            btc_pit_oos_audit.yml
            btc_historical_research.yml
            btc_9h_research_marathon.yml
            btc_recency_research.yml
            btc_archive_refresh.yml
            btc_selective_research.yml
            btc_microstructure_research.yml
            btc_hierarchical_research.yml
            btc_rolling_challenger.yml
            btc_exogenous_research.yml
            btc_interaction_research.yml
            btc_time_regime_research.yml
            btc_calibration_frozen_replay.yml
            btc_adaptive_calibration_replay.yml
            btc_multiscale_frozen_replay.yml
            btc_archive_primary_bridge.yml
            btc_canonical_state_compaction.yml
            btc_frozen_archive_replay.yml
            btc_unit_tests.yml
            btc_binance_ws_collector.yml
          )
          main_sha=$(gh api "/repos/${REPO}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$main_sha" ]; then
            echo "ERROR: unable to resolve current main SHA; watchdog recovery cannot be trusted." >&2
            watchdog_degraded=1
          else
            echo "Current main SHA: ${main_sha}"
          fi
          now=$(date -u +%s)
          for workflow in "${workflows[@]}"; do
            echo "Checking ${workflow}"
            # 100 recent runs cover the retry eligibility window while keeping
            # per-workflow API/rate-limit cost bounded. Active stale-run inspection
            # below also uses 100, independently of this retry-history window.
            response=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=100" 2>/dev/null) || { echo "ERROR: unable to inspect ${workflow}; watchdog recovery degraded." >&2; watchdog_degraded=1; continue; }
            recent_runs_json=$(jq -c '.workflow_runs[]? | {id,status,conclusion,run_attempt,head_sha,updated_at}' <<<"$response") || {
              echo "ERROR: unable to parse ${workflow} run history; watchdog recovery cannot be trusted." >&2
              exit 1
            }
            while IFS= read -r run; do
              [ -n "$run" ] || continue
              status=$(jq -r '.status // ""' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              run_id=$(jq -r '.id // 0' <<<"$run")
              attempt=$(jq -r '.run_attempt // 1' <<<"$run")
              head_sha=$(jq -r '.head_sha // ""' <<<"$run")
              updated=$(jq -r '.updated_at // ""' <<<"$run")
              updated_epoch=$(date -d "$updated" +%s 2>/dev/null || echo 0)
              age=$((now - updated_epoch))
              echo "run=${run_id} status=${status} conclusion=${conclusion} attempt=${attempt} head_sha=${head_sha:-unknown} age=${age}s"
              if [ "$status" != "completed" ]; then continue; fi
              case "$conclusion" in
                failure|cancelled|timed_out)
                  if [ "$run_id" -gt 0 ] && [ "$attempt" -lt 3 ] && [ "$age" -ge 300 ] && [ -n "$main_sha" ] && [ "$head_sha" = "$main_sha" ]; then
                    if gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs" >/dev/null 2>&1; then
                      echo "Retry requested successfully for ${workflow} run ${run_id}"
                    else
                      echo "ERROR: retry request failed for ${workflow} run ${run_id}; watchdog recovery degraded." >&2
                      watchdog_degraded=1
                    fi
                  elif [ "$run_id" -gt 0 ] && [ "$attempt" -lt 3 ] && [ "$age" -ge 300 ]; then
                    echo "Skip retry for ${workflow} run ${run_id}: head SHA ${head_sha:-unknown} is not current main."
                  fi
                  ;;
              esac
            done <<<"$recent_runs_json"
          done

          code_or_protocol_changed_since() {
            active_head="$1"
            workflow="$2"
            if [ -z "$main_sha" ] || [ -z "$active_head" ] || [ "$active_head" = "$main_sha" ]; then
              return 1
            fi
            compare=$(gh api "/repos/${REPO}/compare/${active_head}...${main_sha}" 2>/dev/null || true)
            if [ -z "$compare" ]; then
              echo "ERROR: unable to compare active head ${active_head} with current main ${main_sha}; stale-head cancellation is degraded." >&2
              watchdog_degraded=1
              return 1
            fi
            if jq -e '.too_large == true' <<<"$compare" >/dev/null 2>&1; then
              echo "ERROR: compare ${active_head}...${main_sha} is too large; stale-head cancellation is degraded and age timeout remains authoritative." >&2
              watchdog_degraded=1
              return 1
            fi
            changed_files=$(jq -r --arg workflow ".github/workflows/$workflow" '
              [.files[]?.filename? |
                select(
                  startswith("src/") or
                  startswith("scripts/") or
                  startswith("tests/") or
                  . == "requirements.txt" or
                  . == $workflow
                )
              ] | length
            ' <<<"$compare" 2>/dev/null) || {
              echo "ERROR: unable to evaluate changed-file scope for ${active_head}...${main_sha}; stale-head cancellation is degraded." >&2
              watchdog_degraded=1
              return 1
            }
            if ! [[ "$changed_files" =~ ^[0-9]+$ ]]; then
              echo "ERROR: stale-head changed-file count is malformed for ${active_head}...${main_sha}: ${changed_files:-empty}" >&2
              watchdog_degraded=1
              return 1
            fi
            if [ "$changed_files" -gt 0 ]; then
              echo "Detected $changed_files source/protocol files changed since active head ${active_head} for ${workflow}."
              return 0
            fi
            echo "No monitored source/protocol changes detected since active head ${active_head} for ${workflow}."
            return 1
          }

          recover_if_stale() {
            workflow="$1"
            threshold="$2"
            active_grace="$3"
            stale_head_grace="$4"
            response=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=100" 2>/dev/null || true)
            if [ -z "$response" ]; then echo "WARN: unable to inspect ${workflow}; no recovery dispatch"; return; fi
            latest=$(jq -c '[.workflow_runs[]? | select(.status == "completed" and .conclusion != "skipped")] | sort_by(.updated_at) | last // empty' <<<"$response")
            running=$(jq '[.workflow_runs[]? | select(.status == "queued" or .status == "pending" or .status == "in_progress")] | length' <<<"$response")

            # A completed-run freshness check alone cannot recover a stuck active
            # run. Inspect active runs separately and cancel only when they are
            # clearly stale or affected by a source/protocol change or exceeded its hard active-age limit. The next watchdog tick
            # performs the recovery dispatch after cancellation has settled.
            active_runs_json=$(jq -c '.workflow_runs[]? | select(.status == "queued" or .status == "pending" or .status == "in_progress") | {id,status,head_sha,updated_at}' <<<"$response") || {
              echo "ERROR: unable to parse ${workflow} active-run state; stale-run cancellation cannot be trusted." >&2
              return 1
            }
            active_count=0
            cancellation_requested_count=0
            while IFS= read -r active; do
                active_count=$((active_count + 1))
                [ -n "$active" ] || continue
                active_id=$(jq -r '.id // 0' <<<"$active")
                active_head=$(jq -r '.head_sha // ""' <<<"$active")
                active_updated=$(jq -r '.updated_at // ""' <<<"$active")
                active_epoch=$(date -d "$active_updated" +%s 2>/dev/null || echo 0)
                active_age=$((now - active_epoch))
                stale_by_source=false
                stale_by_age=false
                if [ "$active_age" -ge "$stale_head_grace" ] && code_or_protocol_changed_since "$active_head" "$workflow"; then
                  stale_by_source=true
                fi
                if [ "$active_age" -ge "$active_grace" ]; then
                  stale_by_age=true
                fi
                if [ "$active_id" -gt 0 ] && { [ "$stale_by_source" = true ] || [ "$stale_by_age" = true ]; }; then
                  echo "${workflow}: cancelling stale active run ${active_id} head=${active_head:-unknown} age=${active_age}s"
                  if gh api --method POST "/repos/${REPO}/actions/runs/${active_id}/cancel" >/dev/null 2>&1; then
                    echo "${workflow}: stale active run ${active_id} cancellation requested."
                    cancellation_requested_count=$((cancellation_requested_count + 1))
                  else
                    echo "ERROR: unable to cancel stale active run ${active_id}; watchdog recovery degraded." >&2
                    watchdog_degraded=1
                  fi
                fi
            done <<<"$active_runs_json"

            force_dispatch=false
            if [ "$active_count" -gt 0 ] && [ "$cancellation_requested_count" -eq "$active_count" ]; then
              force_dispatch=true
              echo "${workflow}: all ${active_count} active run(s) were marked for stale cancellation; recovery dispatch will be queued immediately."
            fi

            latest_updated=$(jq -r '.updated_at // ""' <<<"$latest")
            latest_epoch=$(date -d "$latest_updated" +%s 2>/dev/null || echo 0)
            age=$((now - latest_epoch))
            echo "${workflow}: latest=${latest_updated:-none} age=${age}s running=${running} threshold=${threshold}s active_grace=${active_grace}s stale_head_grace=${stale_head_grace}s"
            should_dispatch=false
            if [ "$force_dispatch" = true ] || { [ "$running" -eq 0 ] && { [ "$latest_epoch" -eq 0 ] || [ "$age" -ge "$threshold" ]; }; }; then
              should_dispatch=true
            fi
            if [ "$should_dispatch" = true ]; then
              echo "${workflow} appears stale; ensuring the workflow is enabled before recovery."
              if gh workflow enable "$workflow" >/dev/null 2>&1; then
                echo "${workflow} enable check completed."
              else
                echo "WARN: could not enable ${workflow}; attempting dispatch anyway."
              fi
              # Prefer the CLI helper, then fall back to the explicit workflow_dispatch
              # REST endpoint. Both paths remain fail-closed: a failed recovery request
              # must never mutate prediction state or be reported as successful.
              if gh workflow run "$workflow" --ref main >/dev/null 2>&1; then
                echo "${workflow} recovery dispatch succeeded via gh workflow run."
              elif gh api --method POST "/repos/${REPO}/actions/workflows/${workflow}/dispatches" -f ref=main >/dev/null 2>&1; then
                echo "${workflow} recovery dispatch succeeded via workflow_dispatch API."
              else
                echo "ERROR: ${workflow} recovery dispatch failed through both supported paths; watchdog recovery degraded." >&2
                watchdog_degraded=1
              fi
            fi
          }
          # Integrity is read-only and has a 15m hard timeout. Cancel only
          # genuinely stale runs so an old-head audit cannot block the next current-main audit.
          recover_if_stale btc_integrity.yml 3600 1200 900
          recover_if_stale btc_live_cycle.yml 600 1800 600
          recover_if_stale btc_pit_oos_audit.yml 7200 10800 7200
          # Keep the daily research lanes alive without dispatching duplicates
          # while an existing run is queued or in progress.
          recover_if_stale btc_research.yml 21600 32400 900
          recover_if_stale btc_interaction_research.yml 43200 64800 900
          recover_if_stale btc_historical_research.yml 43200 64800 900
          recover_if_stale btc_exogenous_research.yml 7200 10800 900
          recover_if_stale btc_recency_research.yml 21600 32400 900
          recover_if_stale btc_archive_refresh.yml 21600 32400 900
          recover_if_stale btc_selective_research.yml 28800 43200 900
          recover_if_stale btc_microstructure_research.yml 21600 32400 900
          recover_if_stale btc_hierarchical_research.yml 21600 32400 900
          # The 9H marathon is intentionally long-running; recover it only when
          # there is no active run and no completed run for 10 hours.
          # A 9H run has a hard workflow timeout; allow it to finish before treating an old-head run as stale.
          recover_if_stale btc_9h_research_marathon.yml 36000 39600 900
          # Research-only model/feature and maintenance lanes are recoverable
          # independently. They never mutate production probabilities directly.
          recover_if_stale btc_rolling_challenger.yml 28800 43200 900
          recover_if_stale btc_archive_primary_bridge.yml 21600 32400 900
          recover_if_stale btc_canonical_state_compaction.yml 21600 32400 900
          recover_if_stale btc_time_regime_research.yml 21600 32400 900
          recover_if_stale btc_calibration_frozen_replay.yml 28800 43200 900
          recover_if_stale btc_adaptive_calibration_replay.yml 28800 43200 900
          recover_if_stale btc_multiscale_frozen_replay.yml 21600 32400 900
          recover_if_stale btc_frozen_archive_replay.yml 25200 12600 900
          recover_if_stale btc_unit_tests.yml 1800 1200 300
          # The WS collector is a long-lived rolling publisher (up to ~50m); do not cancel a healthy run merely because it exceeds the old 30m grace window.
          # The collector intentionally runs for ~53 minutes; allow it to
          # survive both its full capture window and frequent main state commits.
          recover_if_stale btc_binance_ws_collector.yml 3600 5400 7200
          if [ "$watchdog_degraded" -ne 0 ]; then
            echo 'ERROR: BTC workflow watchdog completed in DEGRADED state; at least one recovery/inspection action failed.' >&2
            exit 1
          fi
          echo 'BTC workflow watchdog completed without masking core workflow results.'
