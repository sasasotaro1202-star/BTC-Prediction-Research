name: BTC Workflow Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry only the latest eligible interrupted BTC workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          workflows=(btc_live_cycle.yml btc_integrity.yml btc_research.yml)
          now=$(date -u +%s)
          for workflow in "${workflows[@]}"; do
            echo "Checking ${workflow}"
            response=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=5" 2>/dev/null) || {
              echo "WARN: unable to inspect ${workflow}; continuing"
              continue
            }

            # Always inspect the newest run, never an older completed run.
            # This prevents stale failures from being retried while a newer
            # run is queued or already executing.
            latest=$(printf '%s' "$response" | jq -c '.workflow_runs[0] // empty')
            [ -n "$latest" ] || { echo "No run found for ${workflow}"; continue; }

            status=$(printf '%s' "$latest" | jq -r '.status // ""')
            conclusion=$(printf '%s' "$latest" | jq -r '.conclusion // ""')
            run_id=$(printf '%s' "$latest" | jq -r '.id // 0')
            attempt=$(printf '%s' "$latest" | jq -r '.run_attempt // 1')
            updated=$(printf '%s' "$latest" | jq -r '.updated_at // ""')
            updated_epoch=$(date -d "$updated" +%s 2>/dev/null || echo 0)
            age=$((now - updated_epoch))
            echo "run=${run_id} status=${status} conclusion=${conclusion} attempt=${attempt} age=${age}s"

            # Never interfere with a run that is still queued/in progress.
            if [ "$status" != "completed" ]; then
              echo "Latest run is not completed; no retry for ${workflow}"
              continue
            fi

            # Recover the classes of terminal failures most likely to be
            # transient infrastructure interruptions. Do not retry a fresh
            # failure immediately; allow logs/artifacts to settle first.
            retryable=false
            case "$conclusion" in
              failure|cancelled|timed_out) retryable=true ;;
            esac

            if [ "$retryable" = true ] && [ "$run_id" -gt 0 ] && [ "$attempt" -lt 3 ] && [ "$age" -ge 300 ]; then
              echo "Retrying eligible failed jobs for latest ${workflow} run ${run_id}"
              if gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs" >/dev/null 2>&1; then
                echo "Retry requested successfully for ${workflow} run ${run_id}"
              else
                echo "WARN: retry request failed for ${workflow} run ${run_id}; continuing"
              fi
            else
              echo "No retry needed for ${workflow}"
            fi
          done
          echo 'BTC workflow watchdog completed without masking core workflow results.'
