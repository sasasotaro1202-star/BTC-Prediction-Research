name: BTC Workflow Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc_watchdog.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry recent eligible interrupted BTC workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          workflows=(btc_live_cycle.yml btc_integrity.yml btc_research.yml btc_pit_oos_audit.yml btc_historical_research.yml)
          now=$(date -u +%s)
          for workflow in "${workflows[@]}"; do
            echo "Checking ${workflow}"
            response=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=5" 2>/dev/null) || { echo "WARN: unable to inspect ${workflow}; continuing"; continue; }
            printf '%s' "$response" | jq -c '.workflow_runs[]? | {id,status,conclusion,run_attempt,updated_at}' | while IFS= read -r run; do
              [ -n "$run" ] || continue
              status=$(printf '%s' "$run" | jq -r '.status // ""')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
              run_id=$(printf '%s' "$run" | jq -r '.id // 0')
              attempt=$(printf '%s' "$run" | jq -r '.run_attempt // 1')
              updated=$(printf '%s' "$run" | jq -r '.updated_at // ""')
              updated_epoch=$(date -d "$updated" +%s 2>/dev/null || echo 0)
              age=$((now - updated_epoch))
              echo "run=${run_id} status=${status} conclusion=${conclusion} attempt=${attempt} age=${age}s"
              if [ "$status" != "completed" ]; then continue; fi
              case "$conclusion" in
                failure|cancelled|timed_out)
                  if [ "$run_id" -gt 0 ] && [ "$attempt" -lt 3 ] && [ "$age" -ge 300 ]; then
                    if gh api --method POST "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs" >/dev/null 2>&1; then
                      echo "Retry requested successfully for ${workflow} run ${run_id}"
                    else
                      echo "WARN: retry request failed for ${workflow} run ${run_id}; continuing"
                    fi
                  fi
                  ;;
              esac
            done
          done

          recover_if_stale() {
            workflow="$1"
            threshold="$2"
            response=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?per_page=10" 2>/dev/null || true)
            if [ -z "$response" ]; then echo "WARN: unable to inspect ${workflow}; no recovery dispatch"; return; fi
            latest=$(printf '%s' "$response" | jq -c '[.workflow_runs[]? | select(.status == "completed")] | sort_by(.updated_at) | last // empty')
            running=$(printf '%s' "$response" | jq '[.workflow_runs[]? | select(.status == "queued" or .status == "in_progress")] | length')
            latest_updated=$(printf '%s' "$latest" | jq -r '.updated_at // ""')
            latest_epoch=$(date -d "$latest_updated" +%s 2>/dev/null || echo 0)
            age=$((now - latest_epoch))
            echo "${workflow}: latest=${latest_updated:-none} age=${age}s running=${running} threshold=${threshold}s"
            if [ "$running" -eq 0 ] && { [ "$latest_epoch" -eq 0 ] || [ "$age" -ge "$threshold" ]; }; then
              echo "${workflow} appears stale; dispatching recovery run."
              if gh workflow run "$workflow" --ref main >/dev/null 2>&1; then echo "${workflow} recovery dispatch succeeded."; else echo "WARN: ${workflow} recovery dispatch failed; leaving state unchanged."; fi
            fi
          }

          recover_if_stale btc_live_cycle.yml 600
          recover_if_stale btc_pit_oos_audit.yml 7200
          recover_if_stale btc_historical_research.yml 93600
          echo 'BTC workflow watchdog completed without masking core workflow results.'
