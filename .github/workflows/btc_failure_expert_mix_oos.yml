name: BTC Failure Expert Mix OOS

on:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'src/experience_failure_expert_mix_oos.py'
      - 'src/experience_predictability_router_oos.py'
      - 'src/experience_case_adaptive_controller_oos.py'
      - 'tests/test_experience_failure_expert_mix_oos.py'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: btc-failure-expert-mix-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Restore settled prediction state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db
          from src.db import init_db
          restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db'))
          init_db()
          PY
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build experience ledger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH='${{ github.workspace }}/src:${{ github.workspace }}/scripts' python src/experience_ledger.py
          test -s data/experience/experience_summary.json
      - name: Run expert mixture OOS
        shell: bash
        run: |
          set -euo pipefail
          python src/experience_failure_expert_mix_oos.py
          test -s data/historical_research/experience_failure_expert_mix_oos.json
      - name: Verify research and PIT boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('data/historical_research/experience_failure_expert_mix_oos.json').read_text(encoding='utf-8'))
          if obj.get('research_only') is not True or obj.get('production_changed') is not False:
              raise SystemExit('expert mix must remain research-only')
          if obj.get('promotion_evidence_eligible') is not False:
              raise SystemExit('expert mix cannot create promotion evidence')
          for horizon,item in obj.get('horizons',{}).items():
              if item.get('status') == 'OK':
                  if int(item.get('pit_violation_count',0)) != 0:
                      raise SystemExit(f'{horizon}: PIT violation detected')
                  for name in ('base','global_adjusted','expert_mix'):
                      for metric in ('accuracy','logloss','brier'):
                          value=item[name].get(metric)
                          if not isinstance(value,(int,float)):
                              raise SystemExit(f'{horizon}: missing numeric {name}.{metric}')
          print('BTC failure expert mix safety boundary: VERIFIED')
          PY
      - name: Run expert mixture regression tests
        run: python -m pytest -q tests/test_experience_failure_expert_mix_oos.py
      - name: Upload expert mixture artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btc-failure-expert-mix-oos-${{ github.run_id }}
          path: |
            data/experience/experience_summary.json
            data/historical_research/experience_failure_expert_mix_oos.json
          retention-days: 14
