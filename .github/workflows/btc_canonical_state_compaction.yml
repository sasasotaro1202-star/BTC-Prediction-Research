name: BTC Canonical State Compaction

# Maintenance-only workflow. It repairs only exact immutable duplicate
# prediction events in the persisted SQLite state. Settlement fields are
# preserved, production model artifacts are not changed, and every mutation is
# committed through the same state serialization path used by Live Cycle.
on:
  push:
    paths:
      - 'scripts/merge_prediction_state.py'
      - '.github/workflows/btc_canonical_state_compaction.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: btc-state-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore canonical prediction state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python -c "from pathlib import Path; from src.state_archive import restore_db; restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db')); print('Canonical prediction state restored.')"
          test -s data/predictions.db

      - name: Install runtime dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Compact exact immutable prediction events
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_prediction_state.py --compact data/predictions.db

      - name: Validate repaired prediction state
        shell: bash
        run: |
          set -euo pipefail
          python src/research_input_audit.py
          test -s data/historical_research/research_input_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('data/historical_research/research_input_audit.json').read_text())
          if obj.get('status') != 'PASS':
              raise SystemExit(f"canonical state audit did not pass: {obj.get('failure_reasons')}")
          print('canonical prediction state audit: VERIFIED')
          PY

      - name: Repack canonical state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import compress_db
          db = Path('data/predictions.db')
          archive = Path('data/predictions.db.gz')
          print(compress_db(db, archive))
          db.unlink()
          PY
          test -s data/predictions.db.gz

      - name: Commit canonical state repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- data/predictions.db.gz data/historical_research/research_input_audit.json
          if git diff --cached --quiet; then
            echo 'No canonical state changes to commit.'
            exit 0
          fi
          git commit -m 'Compact canonical BTC prediction state'
          for attempt in 1 2 3 4 5; do
            if timeout 90s git push origin HEAD:main; then
              echo 'Canonical state repair pushed successfully.'
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebuilding from origin/main"
            cp data/predictions.db.gz /tmp/btc_compaction_predictions.db.gz
            git fetch --prune origin main
            git reset --hard origin/main
            if [ -s data/predictions.db.gz ]; then
              python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db, compress_db
          restore_db(Path('data/predictions.db.gz'), Path('/tmp/btc_origin_predictions.db'))
          restore_db(Path('/tmp/btc_compaction_predictions.db.gz'), Path('/tmp/btc_local_predictions.db'))
          import subprocess
          subprocess.run(['python', 'scripts/merge_prediction_state.py', '/tmp/btc_local_predictions.db', '/tmp/btc_origin_predictions.db'], check=True)
          Path('data/predictions.db').write_bytes(Path('/tmp/btc_origin_predictions.db').read_bytes())
          compress_db(Path('data/predictions.db'), Path('data/predictions.db.gz'))
          Path('data/predictions.db').unlink()
          PY
            fi
            git add -- data/predictions.db.gz
            git diff --cached --quiet || git commit -m 'Merge canonical BTC prediction state safely'
          done
          echo 'canonical state push failed after 5 attempts'
          exit 1
