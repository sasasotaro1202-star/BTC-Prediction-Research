name: BTC Canonical State Compaction

# Maintenance-only workflow. It repairs only exact immutable duplicate
# prediction events in the persisted SQLite state. Settlement fields are
# preserved, production model artifacts are not changed, and every mutation is
# committed through the same state serialization path used by Live Cycle.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/merge_prediction_state.py'
      - '.github/workflows/btc_canonical_state_compaction.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: btc-state-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore canonical prediction state
        shell: bash
        run: |
          set -euo pipefail
          test -s data/predictions.db.gz
          python -c "from pathlib import Path; from src.state_archive import restore_db; restore_db(Path('data/predictions.db.gz'), Path('data/predictions.db')); print('Canonical prediction state restored.')"
          test -s data/predictions.db

      - name: Install runtime dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt

      - name: Snapshot canonical prediction state before compaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.prediction_state_guard import prediction_table_fingerprint
          from scripts.merge_prediction_state import expected_compacted_event_count
          from src.prediction_identity import canonical_compaction_snapshot
          db = Path('data/predictions.db')
          fp = prediction_table_fingerprint(db)
          import sqlite3
          with sqlite3.connect(db) as con:
              expected_unique = expected_compacted_event_count(con)
              identity = canonical_compaction_snapshot(con)
          snapshot = {**fp, 'expected_exact_unique_events': expected_unique, **identity}
          if snapshot['settlement_conflicts']:
              raise SystemExit(
                  'conflicting settlement state detected before compaction: '
                  + '; '.join(snapshot['settlement_conflicts'][:10])
              )
          Path('/tmp/btc_compaction_before.json').write_text(
              json.dumps(snapshot, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(snapshot, sort_keys=True))
          PY
      - name: Compact exact immutable prediction events
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_prediction_state.py --compact data/predictions.db

      - name: Guard compaction against unexpected state loss
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.prediction_state_guard import prediction_table_fingerprint
          from src.prediction_identity import canonical_compaction_snapshot

          before = json.loads(Path('/tmp/btc_compaction_before.json').read_text(encoding='utf-8'))
          after = prediction_table_fingerprint(Path('data/predictions.db'))
          import sqlite3
          with sqlite3.connect('data/predictions.db') as con:
              after_identity = canonical_compaction_snapshot(con)
          before_n = int(before['count'])
          after_n = int(after['count'])
          expected_unique = int(before['expected_exact_unique_events'])

          if after_identity['immutable_identity_sha256'] != before['immutable_identity_sha256']:
              raise SystemExit(
                  'canonical compaction immutable identity digest mismatch'
              )
          if after_identity['settlement_state_sha256'] != before['settlement_state_sha256']:
              raise SystemExit(
                  'canonical compaction settlement-state digest mismatch'
              )
          if after_identity['settlement_conflicts']:
              raise SystemExit(
                  'conflicting settlement state remained after compaction: '
                  + '; '.join(after_identity['settlement_conflicts'][:10])
              )

          if after_n != expected_unique:
              raise SystemExit(
                  f'canonical compaction count mismatch: before={before_n} '
                  f'expected_exact_unique={expected_unique} after={after_n}'
              )
          if after_n > before_n:
              raise SystemExit(
                  f'canonical compaction increased row count: before={before_n} after={after_n}'
              )

          removed = before_n - after_n
          removal_fraction = removed / before_n if before_n else 0.0
          payload = {
              'schema_version': 1,
              'research_only': True,
              'production_changed': False,
              'status': 'PASS',
              'before': before,
              'after': after,
              'removed_rows': removed,
              'removal_fraction': removal_fraction,
              'expected_exact_unique_events': expected_unique,
              'immutable_identity_digest_verified': True,
              'settlement_state_digest_verified': True,
              'policy': 'exact-identity-and-settlement-digest-preservation-plus-precomputed-unique-count',
          }
          out = Path('data/historical_research/canonical_compaction_guard.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8')
          print('canonical compaction state guard: VERIFIED')
          print(json.dumps(payload, sort_keys=True))
          PY

      - name: Validate repaired prediction state
        shell: bash
        run: |
          set -euo pipefail
          python src/research_input_audit.py
          test -s data/historical_research/research_input_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('data/historical_research/research_input_audit.json').read_text())
          if obj.get('status') != 'PASS':
              raise SystemExit(f"canonical state audit did not pass: {obj.get('failure_reasons')}")
          print('canonical prediction state audit: VERIFIED')
          PY

      - name: Repack canonical state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from src.state_archive import compress_db
          db = Path('data/predictions.db')
          archive = Path('data/predictions.db.gz')
          print(compress_db(db, archive))
          db.unlink()
          PY
          test -s data/predictions.db.gz

      - name: Commit canonical state repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- data/predictions.db.gz data/historical_research/research_input_audit.json data/historical_research/canonical_compaction_guard.json
          if git diff --cached --quiet; then
            echo 'No canonical state changes to commit.'
            exit 0
          fi
          git commit -m 'Compact canonical BTC prediction state'
          for attempt in 1 2 3 4 5; do
            if timeout 90s git push origin HEAD:main; then
              echo 'Canonical state repair pushed successfully.'
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebuilding from origin/main"
            cp data/predictions.db.gz /tmp/btc_compaction_predictions.db.gz
            git fetch --prune origin main
            git reset --hard origin/main
            if [ -s data/predictions.db.gz ]; then
              python - <<'PY'
          from pathlib import Path
          from src.state_archive import restore_db, compress_db
          restore_db(Path('data/predictions.db.gz'), Path('/tmp/btc_origin_predictions.db'))
          restore_db(Path('/tmp/btc_compaction_predictions.db.gz'), Path('/tmp/btc_local_predictions.db'))
          import subprocess
          subprocess.run(['python', 'scripts/merge_prediction_state.py', '/tmp/btc_local_predictions.db', '/tmp/btc_origin_predictions.db'], check=True)
          Path('data/predictions.db').write_bytes(Path('/tmp/btc_origin_predictions.db').read_bytes())
          compress_db(Path('data/predictions.db'), Path('data/predictions.db.gz'))
          Path('data/predictions.db').unlink()
          PY
            fi
            git add -- data/predictions.db.gz
            git diff --cached --quiet || git commit -m 'Merge canonical BTC prediction state safely'
          done
          echo 'canonical state push failed after 5 attempts'
          exit 1
