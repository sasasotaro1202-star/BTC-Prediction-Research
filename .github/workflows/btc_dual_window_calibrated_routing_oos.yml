name: BTC Dual-Window Calibrated Routing OOS

on:
  pull_request:
    paths:
      - 'src/dual_window_calibrated_routing_oos.py'
      - 'tests/test_dual_window_calibrated_routing_oos.py'
      - 'data/historical_research/oos_5m_*.csv'
      - 'data/historical_research/oos_10m_*.csv'
      - '.github/workflows/btc_dual_window_calibrated_routing_oos.yml'
  workflow_dispatch:

concurrency:
  group: btc-dual-window-calibrated-routing-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and unit test
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m pytest -q tests/test_dual_window_calibrated_routing_oos.py
      - name: Run chronological OOS
        run: |
          set -euo pipefail
          python src/dual_window_calibrated_routing_oos.py
          test -s data/historical_research/dual_window_calibrated_routing_oos.json
      - name: Validate research evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/historical_research/dual_window_calibrated_routing_oos.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          assert obj.get('research_only') is True
          assert obj.get('production_changed') is False
          for item in obj.get('horizons', {}).values():
              assert item.get('status') == 'OK'
              assert item.get('final_holdout_protected') is True
              assert item.get('final_holdout_used_for_selection') is False
          print('dual-window calibrated routing evidence: VERIFIED')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v6
        with:
          name: btc-dual-window-calibrated-routing-oos
          path: data/historical_research/dual_window_calibrated_routing_oos.json
          if-no-files-found: error
          retention-days: 7
